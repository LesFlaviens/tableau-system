        .toolbar-single-line .flow-filters {

        /* Compacte juste assez pour tenir sur un écran Full HD sans perdre la lisibilité */

        .t-body,

        .course-list,

        .t-header {
            flex: 0 0 auto !important;
        }

        .t-body {
            flex: 0 0 auto !important;
            display: flex !important;
            flex-direction: column !important;
            height: auto !important;
            min-height: 0 !important;
            max-height: none !important;
            overflow: visible !important;
        }

        .phase-note {
            display: block !important;
            flex: 0 0 auto !important;
            height: auto !important;
            min-height: 0 !important;
            white-space: normal !important;
            overflow-wrap: anywhere;
        }

        .course-section {
            display: block !important;
            flex: 0 0 auto !important;
            width: 100% !important;
            height: auto !important;
            min-height: 0 !important;

        .course-list {

        /* Le temps ne doit jamais déborder sur le titre de table. */

</style>

<body>

 <script>
 const urlParams = new URLSearchParams(window.location.search);
 const rawTenantID = urlParams.get('tenantID') || localStorage.getItem('ichef_tenant_id') || '';
 const tenantID = /^[A-Za-z0-9_-]{2,80}$/.test(rawTenantID) ? rawTenantID : '';
 const SERVER_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
 ? "http://localhost:10000" : "https://tableau-system.onrender.com";
 const PASS_TERMINAL = 'PASS-CUISINE';

 if (tenantID) localStorage.setItem('ichef_tenant_id', tenantID);

 let currentStation = 'all';
 let currentFlowFilter = 'all';
 let activeOrdersData = {};
 let systemSettings = {};
 let rushHistory = [];

 const antiRush = {
 level: 0,
 label: 'Calme',
 color: '#38bdf8',
 cuisineLoad: 0,
 passLoad: 0,
 estimatedDelay: 10,
 trend: 'stable',
 saturationIn: null
 };

 if (!tenantID) window.location.href = 'connexionpartenaire.html';

 function passHeaders(extra = {}) {
     return {
         'Content-Type': 'application/json',
         'Accept': 'application/json',
         ...extra
     };
 }

 async function passFetchState() {
     const r = await fetch(
         `${SERVER_URL}/get-current-state?tenantID=${encodeURIComponent(tenantID)}&_t=${Date.now()}`,
         {
             cache: 'no-store',
             credentials: 'omit',
             headers: {
                 'Accept': 'application/json'
             }
         }
     );
     if (!r.ok) throw new Error(`HTTP ${r.status}`);
     return r.json();
 }


 function setStation(station) {
 currentStation = station;
 document.querySelectorAll('.filter-btn').forEach(btn => {
 btn.classList.remove('active');
 if(btn.dataset.station === station) btn.classList.add('active');
 });
 renderBoard();
 }

 function parseServerTimestamp(value) {
     if (value == null || value === '') return null;

     // Timestamp numérique en secondes ou millisecondes
     const numeric = Number(value);
     if (Number.isFinite(numeric) && numeric > 0) {
         return numeric < 100000000000 ? numeric * 1000 : numeric;
     }

     // Date ISO / chaîne MongoDB
     const parsed = Date.parse(String(value));
     return Number.isFinite(parsed) ? parsed : null;
 }

 function formatTimeDiff(timestamp) {
     const ts = parseServerTimestamp(timestamp);
     if (!ts) return "--";

     const nowMs = Date.now();
     const diffMs = Math.max(0, nowMs - ts);
     const diff = Math.floor(diffMs / 60000);

     const clock = new Date(ts).toLocaleTimeString('fr-FR', {
         hour: '2-digit',
         minute: '2-digit'
     });

     if (diff < 1) return `${clock} · maintenant`;
     if (diff <= 360) return `${clock} · ${diff} min`;
     return `${clock} · ancien`;
 }

 /* ===== ANTI-RUSH ===== */
 function isSystemKey(key) {
 return /MASTER|ARCHIVE|STAFF_/i.test(String(key));
 }

 function getRushTheme(level) {
 const map = {
 0: { label:'Calme', color:'#38bdf8' },
 1: { label:'Normal', color:'#10b981' },
 2: { label:'Tendu', color:'#fbbf24' },
 3: { label:'Saturé', color:'#f97316' },
 4: { label:'Critique', color:'#ef4444' },
 5: { label:'SOS', color:'#a855f7' }
 };
 return map[Math.max(0, Math.min(5, Number(level) || 0))];
 }

 function getCapacities() {
 const c = systemSettings?.rushV3?.capacity || {};
 return {
 cuisine: Math.max(1, Number(c.cuisine || 18)),
 pass: Math.max(1, Number(c.pass || 10))
 };
 }

 function calculateRushSnapshot() {
 const cap = getCapacities();
 let cuisineUnits = 0;
 let passUnits = 0;
 let lateUnits = 0;
 const now = Date.now();

 for (const key in activeOrdersData) {
 if (isSystemKey(key)) continue;

 const order = activeOrdersData[key];
 if (!order || !Array.isArray(order.items)) continue;

 for (const item of order.items) {
 if (isServedItem(item)) continue;
 const qty = Number(item.qty || 1);
 const dest = String(item.dest || item.station || '').toLowerCase();
 const status = String(item.status || '').toUpperCase();

 if (status === 'PRET_AU_PASS' && item.served !== true) {
 passUnits += qty;
 continue;
 }

 if (item.done || item.isSent === false) continue;

 const isCuisine =
 !dest ||
 ['chaud','froid','grill','pizza','dessert','cuisine'].includes(dest);

 if (isCuisine) cuisineUnits += qty;

 const t = Number(item.itemId || order.time || now);
 if (Number.isFinite(t) && t > 100000000000 && (now - t) / 60000 >= 15) {
 lateUnits += qty;
 }
 }
 }

 return {
 cuisineUnits,
 passUnits,
 lateUnits,
 cuisineLoad: Math.round((cuisineUnits / cap.cuisine) * 100),
 passLoad: Math.round((passUnits / cap.pass) * 100)
 };
 }

 function calculateTrend(maxLoad) {
 const now = Date.now();
 rushHistory.push({ t: now, load: maxLoad });
 rushHistory = rushHistory.filter(x => now - x.t <= 10 * 60 * 1000);

 if (rushHistory.length < 2) return { trend:'stable', saturationIn:null };

 const first = rushHistory[0];
 const last = rushHistory[rushHistory.length - 1];
 const minutes = Math.max(.2, (last.t - first.t) / 60000);
 const slope = (last.load - first.load) / minutes;

 let trend = 'stable';
 if (slope >= 3) trend = 'up';
 else if (slope <= -3) trend = 'down';

 let saturationIn = null;
 if (slope > 1 && maxLoad < 100) {
 saturationIn = Math.ceil((100 - maxLoad) / slope);
 saturationIn = Math.max(1, Math.min(99, saturationIn));
 }

 return { trend, saturationIn };
 }

 function updateAntiRush() {
 const snap = calculateRushSnapshot();
 const maxLoad = Math.max(snap.cuisineLoad, snap.passLoad);
 const trend = calculateTrend(maxLoad);

 let level = 0;
 if (maxLoad >= 160 || snap.lateUnits >= 8) level = 5;
 else if (maxLoad >= 130 || snap.lateUnits >= 5) level = 4;
 else if (maxLoad >= 100 || snap.lateUnits >= 3) level = 3;
 else if (maxLoad >= 70 || snap.lateUnits >= 1) level = 2;
 else if (maxLoad >= 35) level = 1;

 const serverLevel = Number(systemSettings.rushLevel);
 if (Number.isFinite(serverLevel)) {
 level = Math.max(level, Math.max(0, Math.min(5, serverLevel)));
 }

 const delays = { 0:10, 1:15, 2:25, 3:35, 4:45, 5:60 };
 let estimatedDelay = delays[level];

 if (systemSettings?.rushV3?.timeShift?.active && level >= 2) {
 estimatedDelay += Number(systemSettings.rushV3.timeShift.delay || 15);
 }

 const theme = getRushTheme(level);

 Object.assign(antiRush, snap, trend, {
 level,
 label: theme.label,
 color: theme.color,
 estimatedDelay
 });

 renderAntiRush();
 }

 function renderAntiRush() {
 const panel = document.getElementById('anti-rush-top');
 const status = document.getElementById('anti-rush-status');
 const banner = document.getElementById('rush-banner');

 const trendIcon = antiRush.trend === 'up' ? '↗' : antiRush.trend === 'down' ? '↘' : '→';
 const trendText = antiRush.trend === 'up' ? 'charge en hausse' :
 antiRush.trend === 'down' ? 'charge en baisse' : 'charge stable';

 status.innerHTML = `
 Service <span style="color:${antiRush.color};font-weight:900;text-transform:uppercase">${antiRush.label}</span>
 · ${trendIcon} ${trendText}
 ${antiRush.saturationIn && antiRush.trend === 'up'
 ? ` · <strong style="color:${antiRush.color}">saturation ~${antiRush.saturationIn} min</strong>`
 : ''
 }
 `;

 document.getElementById('anti-cuisine-load').innerHTML = `CUISINE <strong>${antiRush.cuisineLoad}%</strong>`;
 document.getElementById('anti-pass-load').innerHTML = `PASS <strong>${antiRush.passLoad}%</strong>`;
 document.getElementById('anti-delay').innerHTML = `ATTENTE <strong>${antiRush.estimatedDelay} MIN</strong>`;

 panel.style.borderColor = antiRush.color;
 panel.style.boxShadow = antiRush.level >= 3 ? `0 0 18px ${antiRush.color}22` : 'none';

 if (antiRush.level >= 2) {
 banner.style.display = 'block';
 banner.style.background = antiRush.color;
 banner.style.color = antiRush.level === 2 ? '#000' : '#fff';
 banner.textContent =
 ` ANTI-RUSH ${antiRush.label.toUpperCase()} — CUISINE ${antiRush.cuisineLoad}% · PASS ${antiRush.passLoad}% · ATTENTE ${antiRush.estimatedDelay} MIN`;
 } else {
 banner.style.display = 'none';
 }
 }

 // RENDU KANBAN

 function setFlowFilter(flow) {
 currentFlowFilter = flow;
 document.querySelectorAll('.flow-btn').forEach(btn => {
 btn.classList.toggle('active', btn.dataset.flow === flow);
 });
 renderBoard();
 }

 function itemText(item) {
 return [
 item?.name, item?.n, item?.category, item?.categorie, item?.type, item?.kind,
 item?.section, item?.family, item?.famille, item?.course, item?.courseName,
 item?.menuName, item?.formuleName, item?.menu, item?.formule
 ].filter(Boolean).join(' ').toLowerCase();
 }

 function isDessertItem(item) {
 const dest = String(item?.dest || item?.station || '').toLowerCase();
 const txt = itemText(item);
 return dest === 'dessert' || /dessert|patisserie|pâtisserie|sucre|sucré|glace|sorbet|gateau|gâteau/.test(txt);
 }

 function isMenuSequenceItem(item) {
 const seqStatus = String(item?.sequenceStatus || '').toUpperCase();
 const seq = Number(item?.sequence || 0);
 const txt = itemText(item);
 const explicitMenu = Boolean(
 item?.menuId || item?.menuName || item?.parentMenuId || item?.menuParentId ||
 item?.formuleId || item?.formuleName || item?.menu || item?.formule
 );
 return explicitMenu || /menu|formule/.test(txt) || (seq > 0 && Boolean(seqStatus));
 }

 function itemFlow(item) {
 if (isDessertItem(item)) return 'dessert';
 if (isMenuSequenceItem(item)) return 'menu';
 return 'direct';
 }

 function getMenuLabel(item) {
 const value = item?.menuName || item?.formuleName || item?.menu || item?.formule || '';
 if (typeof value === 'string' || typeof value === 'number') return String(value);
 if (value && typeof value === 'object') return String(value.name || value.nom || value.title || 'Menu');
 return isMenuSequenceItem(item) ? 'Menu / séquence' : '';
 }

 function getItemKindLabel(item) {
 if (isDessertItem(item)) return 'Dessert';
 if (isMenuSequenceItem(item)) return 'Menu';
 const txt = itemText(item);
 if (/entree|entrée|starter|hors d.oeuvre/.test(txt)) return 'Entrée';
 return 'Plat direct';
 }

 function flowRank(item) {
 const flow = itemFlow(item);
 return flow === 'direct' ? 0 : flow === 'menu' ? 1 : 2;
 }

 function sequenceRank(item) {
 const n = Number(item?.sequence || 0);
 return Number.isFinite(n) && n > 0 ? n : 999;
 }

 function itemTimestamp(item) {
 const n = Number(item?.requestedAt || item?.itemId || item?.createdAt || 0);
 return Number.isFinite(n) ? n : 0;
 }

 function normalizeLifecycleValue(value) {
 return String(value || '').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 }

 function isServedItem(item) {
 if (!item) return false;
 const seq = normalizeLifecycleValue(item.sequenceStatus);
 const st = normalizeLifecycleValue(item.status);
 return item.served === true || seq === 'SERVED' || seq === 'SERVI' || st === 'SERVED' || st === 'SERVI';
 }

 function guestSeat(item) {
 const direct = Number(item?.seat ?? item?.guestSeat ?? item?.seatNumber ?? item?.conviveSeat ?? 0);
 if (Number.isFinite(direct) && direct >= 1 && direct <= 9) return Math.trunc(direct);
 const raw = [item?.guestName,item?.guest,item?.conviveName,item?.convive,item?.who].filter(Boolean).join(' ');
 const m = raw.match(/(?:^|\b)C?([1-9])(?:\b|$)/i);
 return m ? Number(m[1]) : 0;
 }

 function guestLabel(item) {
 const seat = guestSeat(item);
 if (seat) return `C${seat}`;
 const raw = String(item?.guestName || item?.guest || item?.conviveName || item?.convive || '').trim();
 return raw || '';
 }

 function cookingValue(item) {
 return String(item?.cooking ?? item?.cuisson ?? item?.cookingLevel ?? item?.doneness ?? '').trim();
 }

 function observationValue(item) {
 return String(item?.obs ?? item?.observation ?? item?.note ?? item?.comment ?? '').trim();
 }

 function allergyValue(item) {
 const value = item?.allergy ?? item?.allergie ?? item?.allergies ?? item?.allergen ?? '';
 if (Array.isArray(value)) return value.filter(Boolean).join(', ');
 return String(value || '').trim();
 }

 function preserveWhoCookingOrder(order) {
 if (!order || !Array.isArray(order.items)) return order;
 order.items.forEach(item => {
 if (!item || typeof item !== 'object') return;
 const seat = guestSeat(item);
 if (seat) {
 item.seat = seat;
 item.guestSeat = seat;
 item.seatNumber = seat;
 if (!item.guestName) item.guestName = `C${seat}`;
 if (!item.guest) item.guest = item.guestName || `C${seat}`;
 }
 const cooking = cookingValue(item);
 if (cooking) {
 item.cooking = cooking;
 item.cuisson = cooking;
 }
 const obs = observationValue(item);
 if (obs) {
 item.obs = obs;
 if (!item.observation) item.observation = obs;
 }
 const allergy = allergyValue(item);
 if (allergy) {
 if (!item.allergy) item.allergy = allergy;
 if (!item.allergie) item.allergie = allergy;
 }
 });
 return order;
 }

 function guestSummaryHtml(items) {
 const counts = new Map();
 (items || []).forEach(item => {
 if (!item || isServedItem(item)) return;
 const seat = guestSeat(item);
 if (!seat) return;
 counts.set(seat, (counts.get(seat) || 0) + Math.max(1, Number(item.qty || 1)));
 });
 if (!counts.size) return '';
 return `<div class="guest-summary">${[...counts.entries()].sort((a,b)=>a[0]-b[0]).map(([seat,qty]) => `<span class="guest-chip g${seat}">C${seat} · ${qty}</span>`).join('')}</div>`;
 }

 function isWaitingItem(item) {
 const s = normalizeLifecycleValue(item?.sequenceStatus);
 return !isServedItem(item) && (s === 'WAITING' || s === 'DRAFT');
 }

 function isProductionItem(item) {
 const s = normalizeLifecycleValue(item?.sequenceStatus);
 return !isServedItem(item) && !item?.done && item?.isSent !== false && !isWaitingItem(item) && (s === 'PRODUCTION' || !s || s === 'EN_PREPARATION');
 }

 function getPhaseInfo(items) {
 const live = items.filter(i => i && i.isSent !== false && !isServedItem(i) && !i.done);
 const direct = live.filter(i => itemFlow(i) === 'direct' && !isWaitingItem(i));
 const menu = live.filter(i => itemFlow(i) === 'menu');
 const dessert = live.filter(i => itemFlow(i) === 'dessert');

 if (direct.length) return { phase:'direct', label:'PRIORITE : PLATS EN DIRECT' };

 const menuProduction = menu.filter(i => !isWaitingItem(i));
 if (menuProduction.length) {
 const minSeq = Math.min(...menuProduction.map(sequenceRank));
 return { phase:'menu', sequence:minSeq, label:`MENU / SEQUENCE ${minSeq === 999 ? '' : minSeq}`.trim() };
 }

 if (menu.some(isWaitingItem)) return { phase:'menu-wait', label:'MENUS EN ATTENTE DE SEQUENCE' };
 if (dessert.length) return { phase:'dessert', label:'DESSERTS' };
 return { phase:'done', label:'PRODUCTION TERMINEE' };
 }

 function isItemAllowedNow(item, phaseInfo) {
 if (!item || isServedItem(item) || item.done || item.isSent === false || isWaitingItem(item)) return false;
 const flow = itemFlow(item);
 if (phaseInfo.phase === 'direct') return flow === 'direct';
 if (phaseInfo.phase === 'menu') return flow === 'menu' && sequenceRank(item) === phaseInfo.sequence;
 if (phaseInfo.phase === 'dessert') return flow === 'dessert';
 return false;
 }

 function orderPriority(order) {
 const items = Array.isArray(order?.items) ? order.items : [];
 const pending = items.filter(i => i && i.isSent !== false && !isServedItem(i) && !i.done);
 if (!pending.length) return 9;
 return Math.min(...pending.map(flowRank));
 }

 function renderItemRow(order, item, phaseInfo) {
 const globalIdx = order.items.indexOf(item);
 const served = isServedItem(item);
 const isDone = !served && item.done === true;
 const sequenceStatus = normalizeLifecycleValue(item.sequenceStatus);
 const waiting = isWaitingItem(item);
 const allowedNow = isItemAllowedNow(item, phaseInfo);
 const sequence = Number(item.sequence || 0);
 const flow = itemFlow(item);
 const seat = guestSeat(item);
 const who = guestLabel(item);

 let stateText = '';
 let stateStyle = '';
 if (served) {
 stateText = 'SERVI';
 stateStyle = 'color:#58a9ff;border-color:rgba(88,169,255,.55)';
 } else if (waiting) {
 stateText = `ATTENTE${sequence ? ' S'+sequence : ''}`;
 stateStyle = 'color:#fbbf24;border-color:rgba(251,191,36,.45)';
 } else if (isDone || sequenceStatus === 'READY') {
 stateText = `PRET${sequence ? ' S'+sequence : ''}`;
 stateStyle = 'color:#10b981;border-color:rgba(16,185,129,.45)';
 } else if (!allowedNow) {
 stateText = flow === 'dessert' ? 'APRES PLATS / MENUS' : 'APRES PRIORITE';
 stateStyle = 'color:#94a3b8;border-color:rgba(148,163,184,.35)';
 } else {
 stateText = `EN PRODUCTION${sequence ? ' S'+sequence : ''}`;
 stateStyle = 'color:#f97316;border-color:rgba(249,115,22,.45)';
 }

 const cooking = cookingValue(item);
 const obs = observationValue(item);
 const allergy = allergyValue(item);
 const details = [];
 if (cooking) details.push(`<span class="kitchen-detail cooking">CUISSON : ${escapeHtml(cooking)}</span>`);
 if (item.modifiers?.add?.length) details.push(`<span class="kitchen-detail add">+ ${item.modifiers.add.map(escapeHtml).join(', ')}</span>`);
 if (item.modifiers?.remove?.length) details.push(`<span class="kitchen-detail remove">- ${item.modifiers.remove.map(escapeHtml).join(', ')}</span>`);
 if (obs) details.push(`<span class="kitchen-detail obs">NOTE : ${escapeHtml(obs)}</span>`);
 if (allergy) details.push(`<span class="kitchen-detail allergy">ALLERGIE : ${escapeHtml(allergy)}</span>`);
 const detailHtml = details.length ? `<div class="kitchen-details">${details.join('')}</div>` : '';
 const menuLabel = getMenuLabel(item);
 const locked = served || (!allowedNow && !isDone);
 const itemClass = served ? 'done served' : isDone ? 'done' : locked ? 'locked next-phase' : 'active-phase';
 const click = allowedNow && !served ? `toggleItemDone('${order.id}', ${globalIdx})` : '';
 const guestHtml = seat ? `<span class="guest-chip g${seat}">C${seat}</span>` : (who ? `<span class="guest-chip">${escapeHtml(who)}</span>` : '');

 return `
 <div class="t-item ${itemClass}" onclick="${click}">
 <div class="t-qty">${item.qty || 1}</div>
 <div class="t-name">
 <div class="order-line-title">${guestHtml}<span class="order-line-name">${escapeHtml(item.name || item.n || 'Article')}</span></div>
 <div class="item-subline">
 <span class="item-kind">${escapeHtml(getItemKindLabel(item))}</span>
 ${menuLabel ? `<span class="menu-name">${escapeHtml(menuLabel)}</span>` : ''}
 </div>
 ${detailHtml}
 </div>
 <div class="t-station" style="${stateStyle}">${stateText}</div>
 <button class="recipe-btn" type="button" title="Voir la recette" onclick="event.stopPropagation(); openRecipeByName(${JSON.stringify(item.name || item.n || '')})">RECETTE</button>
 </div>`;
 }

 function renderCourseSection(order, items, flow, title, phaseInfo) {
 if (!items.length) return '';
 return `
 <section class="course-section ${flow}">
 <div class="course-title"><span>${title}</span><span>${items.reduce((n,i) => n + Number(i.qty || 1), 0)} ARTICLE(S)</span></div>
 <div class="course-list">${items.map(i => renderItemRow(order, i, phaseInfo)).join('')}</div>
 </section>`;
 }

 function renderBoard() {
 const board = document.getElementById('board');
 let html = '';
 let hasTickets = false;

 const allowedStatuses = new Set([
 'PENDING','OPEN','NOUVELLE COMMANDE','EN PRÉPARATION','EN PREPARATION',
 'EN ATTENTE (TIME-SHIFT)','EN ATTENTE','PRÊT','PRET'
 ]);

 const ordersArray = Object.keys(activeOrdersData)
 .filter(k => !isSystemKey(k))
 .map(k => ({ id:k, ...activeOrdersData[k] }))
 .filter(o => {
 if (!o || !Array.isArray(o.items) || o.items.length === 0) return false;
 const status = String(o.status || 'pending').trim().toUpperCase();
 return allowedStatuses.has(status) || o.items.some(item => item && item.isSent === true);
 })
 .sort((a,b) => {
 const pa = orderPriority(a);
 const pb = orderPriority(b);
 if (pa !== pb) return pa - pb;
 const ta = Number(a.createdAt || a.items?.[0]?.itemId || 0);
 const tb = Number(b.createdAt || b.items?.[0]?.itemId || 0);
 if (ta !== tb) return ta - tb;
 return String(a.id).localeCompare(String(b.id), 'fr');
 });

 ordersArray.forEach(order => {
 const stationItems = order.items.filter(item => {
 if (!item || item.isSent === false || isServedItem(item)) return false;
 if (currentStation !== 'all') {
 const dest = String(item.dest || item.station || '').toLowerCase();
 if (dest && dest !== 'cuisine' && dest !== currentStation) return false;
 }
 return true;
 });

 if (!stationItems.length) return;
 const phaseInfo = getPhaseInfo(stationItems);

 let displayItems = stationItems.filter(item => {
 if (currentFlowFilter === 'all') return true;
 if (currentFlowFilter === 'menu') return isMenuSequenceItem(item);
 return itemFlow(item) === currentFlowFilter;
 });

 if (!displayItems.length) return;

 displayItems = [...displayItems].sort((a,b) => {
 const fr = flowRank(a) - flowRank(b);
 if (fr) return fr;
 const sr = sequenceRank(a) - sequenceRank(b);
 if (sr) return sr;
 return itemTimestamp(a) - itemTimestamp(b);
 });

 hasTickets = true;

 const isTimeShifted = order.timeShifted && Number(order.releaseTime) > Date.now();
 let ticketClass = 'ticket';
 if (phaseInfo.phase === 'direct') ticketClass += ' priority-direct';
 else if (phaseInfo.phase === 'menu' || phaseInfo.phase === 'menu-wait') ticketClass += ' priority-menu';
 else if (phaseInfo.phase === 'dessert') ticketClass += ' priority-dessert';

 const firstTimestamp = order.createdAt || order.updatedAt || stationItems.find(i => Number(i.itemId) > 100000000000)?.itemId || Date.now();
 let timeDisplay = formatTimeDiff(firstTimestamp);
 let timeClass = 't-time';

 if (isTimeShifted) {
 const minLeft = Math.ceil((Number(order.releaseTime) - Date.now()) / 60000);
 timeDisplay = `En attente (${minLeft}m)`;
 ticketClass += ' timeshift';
 } else {
 const parsedFirstTimestamp = parseServerTimestamp(firstTimestamp);
 const diffMinutes = parsedFirstTimestamp
     ? Math.floor(Math.max(0, Date.now() - parsedFirstTimestamp) / 60000)
     : 0;
 if (diffMinutes >= 15 && diffMinutes <= 360) {
     ticketClass += ' urgent';
     timeClass += ' late';
 }
 }

 const directItems = displayItems.filter(i => itemFlow(i) === 'direct');
 const menuItems = displayItems.filter(i => itemFlow(i) === 'menu');
 const dessertItems = displayItems.filter(i => itemFlow(i) === 'dessert');

 const directCount = stationItems.filter(i => itemFlow(i) === 'direct').reduce((n,i)=>n+Number(i.qty||1),0);
 const menuCount = stationItems.filter(i => itemFlow(i) === 'menu').reduce((n,i)=>n+Number(i.qty||1),0);
 const dessertCount = stationItems.filter(i => itemFlow(i) === 'dessert').reduce((n,i)=>n+Number(i.qty||1),0);

 const itemsHtml = [
 renderCourseSection(order, directItems, 'direct', 'EN DIRECT — PRIORITE', phaseInfo),
 renderCourseSection(order, menuItems, 'menu', 'MENUS / SEQUENCES', phaseInfo),
 renderCourseSection(order, dessertItems, 'dessert', 'DESSERTS — A PART', phaseInfo)
 ].join('');

 const stillWaiting = stationItems.some(isWaitingItem);
 const activeNow = stationItems.filter(i => isItemAllowedNow(i, phaseInfo));
 const currentDone = activeNow.length > 0 && activeNow.every(i => i.done === true);
 const allNonWaitingDone = stationItems.filter(i => !isWaitingItem(i)).every(i => i.done === true);

 let btnHtml = '';
 if (isTimeShifted) {
 btnHtml = `<button class="btn-ready waiting" disabled>EN ATTENTE...</button>`;
 } else if (allNonWaitingDone && stationItems.some(i => i.done === true)) {
 btnHtml = `<button class="btn-ready" onclick="markOrderReady('${order.id}')">VALIDER LES ELEMENTS PRETS AU PASS</button>`;
 } else {
 btnHtml = `<button class="btn-ready" style="background:rgba(255,255,255,.1);color:var(--text-muted);" disabled>${escapeHtml(phaseInfo.label)}</button>`;
 }

 const tableLabel = String(order.table || order.id || '');
 html += `
 <div class="${ticketClass}">
 <div class="t-header">
 <div>
 <div class="t-table">${tableLabel.includes('WEB') ? 'Web ' + escapeHtml(tableLabel.replace('WEB_','#')) : 'Table ' + escapeHtml(tableLabel)}</div>
 <div class="t-meta">${escapeHtml(order.typePaiement || 'Sur place')} • ${escapeHtml(order.couverts || order.pax || 2)} Pax</div>
 <div class="order-counts">
 ${directCount ? `<span class="order-count direct">DIRECT ${directCount}</span>` : ''}
 ${menuCount ? `<span class="order-count menu">MENU ${menuCount}</span>` : ''}
 ${dessertCount ? `<span class="order-count dessert">DESSERT ${dessertCount}</span>` : ''}
 </div>
 ${guestSummaryHtml(stationItems)}
 </div>
 <div class="${timeClass}">${timeDisplay}</div>
 </div>
 <div class="t-body">
 <div class="phase-note">${escapeHtml(phaseInfo.label)}. Ordre de lecture : direct, menus / séquences, desserts.</div>
 ${itemsHtml}
 </div>
 <div class="t-footer">${btnHtml}</div>
 </div>`;
 });

 if (!hasTickets) {
 board.innerHTML = `<div class="empty-state"><h3>Cuisine prête</h3><p>Aucune commande pour ce filtre.</p></div>`;
 } else {
 board.innerHTML = html;
 }
 updateAntiRush();
 }

 async function toggleItemDone(orderId, itemIndex) {
 if(!activeOrdersData[orderId]) return;
 let order = activeOrdersData[orderId];

 if(order.timeShifted && Number(order.releaseTime) > Date.now()) return;
 if (!order.items?.[itemIndex]) return;
 if (isServedItem(order.items[itemIndex])) return;

 if (order.status === 'NOUVELLE COMMANDE') order.status = 'EN PRÉPARATION';
 order.items[itemIndex].done = !order.items[itemIndex].done;

 if (order.items[itemIndex].done) {
 order.items[itemIndex].status = 'PRET_AU_PASS';
 order.items[itemIndex].sequenceStatus = 'READY';
 order.items[itemIndex].readyAt = Date.now();
 } else {
 order.items[itemIndex].status = 'EN_PREPARATION';
 order.items[itemIndex].sequenceStatus = 'PRODUCTION';
 delete order.items[itemIndex].readyAt;
 }

 preserveWhoCookingOrder(order);
 renderBoardIfChanged(true);

 try {
 const r = await fetch(`${SERVER_URL}/update-order?tenantID=${encodeURIComponent(tenantID)}`, {
     method: 'POST',
     cache: 'no-store',
     credentials: 'omit',
     headers: passHeaders(),
     body: JSON.stringify({ tableId: orderId, order, terminal: PASS_TERMINAL })
 });
 const reply = await r.json().catch(() => ({}));
 if (!r.ok || reply.success === false || reply.persisted === false) {
     throw new Error(reply.error || `HTTP ${r.status}`);
 }
 showPassSyncMessage('PRÊT ENREGISTRÉ', true);
 schedulePassResync(60);
 } catch (e) {
 console.error("Erreur réseau Pass :", e);
 showPassSyncMessage('ENVOI ÉCHOUÉ', false);
 }
 }

 async function markOrderReady(orderId) {
 if (!activeOrdersData[orderId]) return;
 const order = activeOrdersData[orderId];

 const liveItems = order.items.filter(item => item && item.isSent !== false && !isServedItem(item));
 if (!liveItems.length) return;
 const stillWaiting = liveItems.some(item => isWaitingItem(item));
 const unfinishedReleased = liveItems.some(item => !isWaitingItem(item) && item.done !== true);

 order.status = stillWaiting || unfinishedReleased ? 'EN PRÉPARATION' : 'PRÊT';
 order.readyAt = Date.now();
 preserveWhoCookingOrder(order);
 renderBoardIfChanged(true);

 try {
 const r = await fetch(`${SERVER_URL}/update-order?tenantID=${encodeURIComponent(tenantID)}`, {
     method: 'POST',
     cache: 'no-store',
     credentials: 'omit',
     headers: passHeaders(),
     body: JSON.stringify({ tableId: orderId, order, terminal: PASS_TERMINAL })
 });
 const reply = await r.json().catch(() => ({}));
 if (!r.ok || reply.success === false || reply.persisted === false) {
     throw new Error(reply.error || `HTTP ${r.status}`);
 }
 showPassSyncMessage('PRÊT ENVOYÉ AU PAD', true);
 schedulePassResync(60);
 } catch (e) {
 console.error('Erreur synchronisation Pass vers Pad :', e);
 showPassSyncMessage('PAD NON MIS À JOUR', false);
 }
 }

 // --- BIBLIOTHÈQUE CUISINE & PÂTISSERIE ---
 let libraryTab = 'all';
 let recipeLibrary = [];

 function safeParse(value, fallback = null) {
 try { return value ? JSON.parse(value) : fallback; } catch (e) { return fallback; }
 }

 function normalizeRecipe(raw, department) {
 if (!raw || typeof raw !== 'object') return null;
 const name = raw.name || raw.nom || raw.title || raw.plat || raw.label;
 if (!name) return null;
 const ingredients = raw.ingredients || raw.ingredientList || raw.composition || [];
 const steps = raw.steps || raw.etapes || raw.preparation || raw.instructions || [];
 const allergens = raw.allergens || raw.allergenes || [];
 return {
 id: raw.id || `${department}-${String(name).toLowerCase().replace(/[^a-z0-9]+/gi,'-')}`,
 name,
 department,
 category: raw.category || raw.categorie || (department === 'patisserie' ? 'Pâtisserie' : 'Cuisine'),
 ingredients: Array.isArray(ingredients) ? ingredients : [ingredients].filter(Boolean),
 steps: Array.isArray(steps) ? steps : String(steps || '').split(/\n+/).filter(Boolean),
 allergens: Array.isArray(allergens) ? allergens : String(allergens || '').split(',').map(x => x.trim()).filter(Boolean),
 cooking: raw.cooking || raw.cuisson || raw.tempsCuisson || '',
 temperature: raw.temperature || raw.temperatureCuisson || '',
 plating: raw.plating || raw.dressage || '',
 conservation: raw.conservation || '',
 chefTip: raw.chefTip || raw.astuce || raw.conseil || '',
 updatedAt: raw.updatedAt || raw.dateModification || raw.lastUpdate || ''
 };
 }

 function collectRecipes() {
 const sources = [];
 const keys = [
 ['MENU','cuisine'], ['RECIPES','cuisine'], ['FICHES_TECHNIQUES','cuisine'],
 ['MENU_PATISSERIE','patisserie'], ['RECIPES_PATISSERIE','patisserie'], ['FICHES_PATISSERIE','patisserie']
 ];

 keys.forEach(([key, dep]) => {
 const value = safeParse(localStorage.getItem(key), null);
 if (value) sources.push([value, dep]);
 });

 if (systemSettings && typeof systemSettings === 'object') {
 ['menu','recipes','fichesTechniques'].forEach(k => systemSettings[k] && sources.push([systemSettings[k], 'cuisine']));
 ['menuPatisserie','recipesPatisserie','fichesPatisserie'].forEach(k => systemSettings[k] && sources.push([systemSettings[k], 'patisserie']));
 }

 const out = [];
 const walk = (value, dep) => {
 if (Array.isArray(value)) return value.forEach(v => walk(v, dep));
 if (!value || typeof value !== 'object') return;
 const candidate = normalizeRecipe(value, dep);
 if (candidate && (value.ingredients || value.ingredientList || value.composition || value.steps || value.etapes || value.preparation || value.instructions || value.recipe || value.recette)) out.push(candidate);
 Object.values(value).forEach(v => { if (v && typeof v === 'object') walk(v, dep); });
 };

 sources.forEach(([value, dep]) => walk(value, dep));
 const unique = new Map();
 out.forEach(r => unique.set(`${r.department}:${r.name.toLowerCase()}`, r));
 recipeLibrary = Array.from(unique.values()).sort((a,b) => a.name.localeCompare(b.name, 'fr'));
 }

 function openRecipeLibrary() {
 collectRecipes();
 document.getElementById('recipe-library').classList.add('open');
 document.getElementById('recipe-library').setAttribute('aria-hidden','false');
 showRecipeList();
 renderRecipeLibrary();
 }

 function closeRecipeLibrary() {

 const haystack = [r.name, r.category, ...r.ingredients.map(formatIngredient), ...r.allergens].join(' ').toLowerCase();
 return !q || haystack.includes(q);
 });

 const host = document.getElementById('recipe-list-view');
 if (!rows.length) {

 function openRecipeByName(name) {

 if (!r) return;

 const host = document.getElementById('recipe-detail-view');
 host.classList.add('open');
 host.innerHTML = `

 <div class="recipe-meta" style="margin-bottom:14px;">${r.department === 'patisserie' ? ' Pâtisserie' : ' Cuisine'} • ${escapeHtml(r.category)}</div>

 <section class="detail-section"><h4>Préparation</h4>${renderList(r.steps, true)}</section>
 <section class="detail-section"><h4>Cuisson & dressage</h4>
 <p><strong>Temps :</strong> ${escapeHtml(r.cooking || 'Non renseigné')}</p>
 <p><strong>Température :</strong> ${escapeHtml(r.temperature || 'Non renseignée')}</p>
 <p><strong>Dressage :</strong> ${escapeHtml(r.plating || 'Non renseigné')}</p>
 </section>
 <section class="detail-section"><h4>Allergènes & conservation</h4>
 <div>${r.allergens.length ? r.allergens.map(a => `<span class="allergen-chip">${escapeHtml(a)}</span>`).join('') : '<span class="recipe-meta">Aucun allergène renseigné</span>'}</div>
 <p><strong>Conservation :</strong> ${escapeHtml(r.conservation || 'Non renseignée')}</p>
 </section>
 <section class="detail-section" style="grid-column:1/-1;"><h4>Conseil du Chef</h4><p>${escapeHtml(r.chefTip || 'Aucun conseil renseigné.')}</p></section>
 </div>
 <div class="readonly-note"> Lecture seule${r.updatedAt ? ' • Dernière mise à jour : ' + escapeHtml(String(r.updatedAt)) : ''}</div>`;
 }

 function renderList(values, ordered) {
 if (!values || !values.length) return '<p class="recipe-meta">Non renseigné</p>';
 const tag = ordered ? 'ol' : 'ul';
 return `<${tag}>${values.map(v => `<li>${escapeHtml(formatIngredient(v))}</li>`).join('')}</${tag}>`;
 }

 function formatIngredient(v) {
 if (v == null) return '';
 if (typeof v === 'string' || typeof v === 'number') return String(v);
 return [v.qty || v.quantity || v.quantite, v.unit || v.unite, v.name || v.nom || v.ingredient].filter(Boolean).join(' ');
 }

 function escapeHtml(value) {
 return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
 }

 function escapeAttr(value) {
 return escapeHtml(value).replace(/`/g, '&#096;');
 }

 document.getElementById('recipe-library').addEventListener('click', (e) => {
 if (e.target.id === 'recipe-library') closeRecipeLibrary();
 });

 document.addEventListener('keydown', (e) => {
 if (e.key === 'Escape') closeRecipeLibrary();
 });


 // =========================================================
 // RENDU STABLE — ÉVITE LES TICKETS QUI "SAUTENT"
 // =========================================================
 let lastBoardFingerprint = '';

 function buildBoardFingerprint(orders) {
 try {
 const compact = {};

 Object.keys(orders || {})
 .filter(k => !isSystemKey(k))
 .sort()
 .forEach(k => {
 const o = orders[k];
 if (!o || !Array.isArray(o.items)) return;

 compact[k] = {
 status: o.status || '',
 readyAt: o.readyAt || null,
 timeShifted: !!o.timeShifted,
 releaseTime: o.releaseTime || null,
 items: o.items.map(i => ({
 id: i.itemId || i.id || null,
 n: i.n || i.name || '',
 qty: i.qty || 1,
 done: !!i.done,
 served: !!i.served,
 isSent: i.isSent !== false,
 status: i.status || '',
 sequenceStatus: i.sequenceStatus || '',
 sequence: i.sequence || 0,
 seat: guestSeat(i),
 guest: guestLabel(i),
 cooking: cookingValue(i),
 obs: observationValue(i),
 allergy: allergyValue(i),
 modifiers: i.modifiers || null,
 category: i.category || i.categorie || '',
 type: i.type || i.kind || i.section || '',
 menuId: i.menuId || i.formuleId || null,
 menuName: i.menuName || i.formuleName || '',
 dest: i.dest || i.station || ''
 }))
 };
 });

 return JSON.stringify(compact);
 } catch (e) {
 return String(Date.now());
 }
 }

 function renderBoardIfChanged(force = false) {
 const fingerprint = buildBoardFingerprint(activeOrdersData);

 if (!force && fingerprint === lastBoardFingerprint) {
 updateAntiRush();
 return;
 }

 lastBoardFingerprint = fingerprint;

 const board = document.getElementById('board');
 const previousScrollLeft = board ? board.scrollLeft : 0;
 const previousScrollTop = board ? board.scrollTop : 0;

 renderBoard();

 requestAnimationFrame(() => {
 const currentBoard = document.getElementById('board');
 if (!currentBoard) return;
 currentBoard.scrollLeft = previousScrollLeft;
 currentBoard.scrollTop = previousScrollTop;
 });
 }

 /* ===== SYNCHRONISATION ===== */
 function applyState(state) {
 if (!state || !state.activeOrders) return;

 activeOrdersData = state.activeOrders;
 Object.keys(activeOrdersData || {}).forEach(key => preserveWhoCookingOrder(activeOrdersData[key]));

 const settingsRaw = state.activeOrders?.SETTINGS_MASTER;
 systemSettings =
 settingsRaw?.data ||
 settingsRaw ||
 state.settings ||
 state.systemSettings ||
 systemSettings;

 renderBoardIfChanged(false);
 }

 const socket = io(SERVER_URL, {
     transports: ['websocket', 'polling'],
     withCredentials: false,
     upgrade: true,
     reconnection: true,
     reconnectionAttempts: Infinity,
     reconnectionDelay: 350,
     reconnectionDelayMax: 2500,
     timeout: 5000,
     auth: {
         tenantID,
         terminal: PASS_TERMINAL
     }
 });

 let passResyncTimer = null;
 function schedulePassResync(delay = 120) {
     clearTimeout(passResyncTimer);
     passResyncTimer = setTimeout(() => fetchInitialState(), delay);
 }

 function showPassSyncMessage(message, ok = true) {
     const badge = document.getElementById('connection-badge');
     if (!badge) return;
     badge.textContent = `● ${message}`;
     badge.style.borderColor = ok ? '#10b981' : '#ef4444';
     badge.style.color = ok ? '#10b981' : '#ef4444';
 }

 function setConnectionBadge(ok, label) {
 const badge = document.getElementById('connection-badge');
 if (!badge) return;

 badge.textContent = ok
 ? `● ${label || 'Connecté'}`
 : `● ${label || 'Déconnecté'}`;

 badge.style.borderColor = ok ? '#10b981' : '#ef4444';
 badge.style.color = ok ? '#10b981' : '#ef4444';
 }

 socket.on('connect', () => {
     socket.emit('joinTenant', tenantID);
     setConnectionBadge(true, 'Connecté');
     schedulePassResync(30);
 });

 socket.on('tenant-joined', payload => {
     if (payload?.tenantID && String(payload.tenantID) !== String(tenantID)) return;
     setConnectionBadge(true, 'Temps réel');
 });

 socket.on('server-state-changed', () => {
     schedulePassResync(100);
 });

 socket.on('disconnect', reason => {
     setConnectionBadge(false, 'Reconnexion...');
     console.warn('Pass déconnecté :', reason);
 });

 socket.on('connect_error', (err) => {
 console.error('Connexion Socket.IO Production :', err);
 setConnectionBadge(false, 'Erreur réseau');
 });

 socket.on('updateState', (state) => {
 if (!state || !state.activeOrders) return;

 let currentCount = Object.keys(activeOrdersData)
 .filter(k => activeOrdersData[k]?.status === 'NOUVELLE COMMANDE').length;

 let newCount = Object.keys(state.activeOrders)
 .filter(k => state.activeOrders[k]?.status === 'NOUVELLE COMMANDE').length;

 if (newCount > currentCount) {
 try {
 new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
 } catch(e){}
 }

 applyState(state);
 });

 async function fetchInitialState() {
     try {
         const state = await passFetchState();
         applyState(state);
         setConnectionBadge(socket.connected, socket.connected ? 'Synchronisé' : 'Serveur OK');
     } catch (e) {
         console.error('Chargement état Production impossible :', e);
         setConnectionBadge(false, 'Sync impossible');
     }
 }

 setInterval(() => {
     // Anti-Rush évolue en temps réel sans reconstruire tous les tickets.
     updateAntiRush();
 }, 5000);

 // Filet de sécurité si un événement Socket.IO est perdu.
 setInterval(() => {
     if (tenantID && (!socket.connected || document.visibilityState === 'visible')) {
         fetchInitialState();
     }
 }, 30000);

 document.addEventListener('visibilitychange', () => {
     if (document.visibilityState === 'visible') schedulePassResync(50);
 });

 fetchInitialState();
 </script>
</body>
</html>
