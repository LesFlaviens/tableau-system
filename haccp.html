
<!-- iCHEF HACCP V272 — propositions DLC lisibles + informations dans (i).
     Correctif strictement visuel, sans nouvelle API ni permission. -->
<style id="ichef-v272-dlc-proposals-style">
.h271-ready .h272-proposal-card{position:relative;background:#eefaf2;border:1px solid #bfe9d2;border-radius:10px;overflow:visible;min-width:0;padding:12px!important;color:#123f30}
.h271-ready .h272-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;margin-bottom:8px}
.h271-ready .h272-head-title{font-size:16px;line-height:1.3;font-weight:900;color:#096640;min-width:0}
.h271-ready .h272-info-button{display:inline-grid!important;place-items:center;flex:0 0 25px;width:25px;height:25px;min-height:25px!important;padding:0!important;border:1.5px solid #427d69!important;border-radius:50%!important;background:#fff!important;color:#17523c!important;font:bold 14px/1 Arial,sans-serif!important;cursor:pointer}
.h271-ready .h272-info-button:focus-visible{outline:3px solid #198c69;outline-offset:2px}
.h271-ready .h272-popover[hidden]{display:none!important}
.h271-ready .h272-popover{position:relative;z-index:2;margin:0 0 10px;padding:10px 12px;border:1px solid #b6ccbe;border-radius:8px;background:#fff;color:#234536;font-size:12px;font-weight:500;line-height:1.6;overflow-wrap:anywhere}
.h271-ready .h272-proposal-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:5px 12px;border-top:1px solid #d2e8db;padding:9px 0;min-width:0}
.h271-ready .h272-proposal-row:first-of-type{border-top:0}
.h271-ready .h272-proposal-name{font-size:13px;line-height:1.5;color:#284e3e;font-weight:750;min-width:0}
.h271-ready .h272-proposal-value{font-size:14px;line-height:1.45;color:#17583a;font-weight:900;overflow-wrap:anywhere;min-width:0;text-align:right}
.h271-ready .h272-proposal-value.muted{font-size:12px;color:#576c62;font-weight:650}
.h271-ready .h272-proposal-note{font-size:11.5px;line-height:1.55;color:#52685d;margin:6px 0 0}
.h271-ready .h272-proposal-empty{color:#647369}
.h271-ready .h272-urgent{color:#ab2139!important}
@media(max-width:750px){.h271-ready .h272-proposal-row{display:block}.h271-ready .h272-proposal-value{text-align:left;display:block;margin-top:2px}.h271-ready .h272-head-title{font-size:15px}}
@media(prefers-reduced-motion:reduce){.h271-ready .h272-info-button{transition:none}}
</style>
<script id="ichef-v272-dlc-proposals-script">
(()=>{'use strict';
 if(window.__ICHEF_HACCP_V272_DLC_DISPLAY__)return;
 window.__ICHEF_HACCP_V272_DLC_DISPLAY__=true;
 const wired=new WeakSet();
 const make=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;};
 function fmtDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return 'Non renseignée';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;}
 function fmtDuration(hours){
  const h=Number(hours);if(!Number.isSafeInteger(h)||h<1)return null;
  const day=Math.floor(h/24),remain=h%24;
  return day>0?`${day} j${remain?' '+remain+' h':''} (${h} h)`:`${h} h`;
 }
 function formKey(root){
  return ['product','family','formState','packaging','process','temperature','manufacturer'].map(name=>root.querySelector(`[data-h268="${name}"]`)?.value||'').join('||');
 }
 function render(root,card,state){
  const manufacturer=root.querySelector('[data-h268="manufacturer"]')?.value||'';
  const ref=root.querySelector('[data-h268="reference"]');
  const advice=root.querySelector('[data-h268="result"]');
  const matched=!state.dirty&&ref&&!ref.hidden&&/Référence validée par le chef\s*:/i.test(ref.textContent||'');
  const validMatch=matched?String(ref.textContent||'').match(/Référence validée par le chef\s*:\s*(\d+)\s*h\s*à/i):null;
  const validHours=validMatch?fmtDuration(validMatch[1]):null;
  const aiReceived=advice&&!advice.hidden&&String(advice.textContent||'').trim();
  const fallback=aiReceived&&String(advice.textContent).includes('MODE SECOURS');
  const manufacturerNode=card.querySelector('[data-h272="manufacturer"]');
  const chefNode=card.querySelector('[data-h272="validated"]');
  const aiNode=card.querySelector('[data-h272="ai"]');
  const now=new Date();const today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
  const expired=!!manufacturer&&manufacturer<today;
  manufacturerNode.textContent=expired?`${fmtDate(manufacturer)} · date dépassée`:fmtDate(manufacturer);
  manufacturerNode.classList.toggle('h272-urgent',expired);
  chefNode.textContent=validHours||'Aucune durée validée trouvée';
  chefNode.classList.toggle('muted',!validHours);
  aiNode.textContent=!aiReceived?'En attente de conseil':fallback?'IA indisponible · conseils généraux':'Conseil IA disponible · sans DLC chiffrée';
  aiNode.classList.toggle('muted',true);
  const foot=card.querySelector('[data-h272="foot"]');
  foot.textContent=expired?'DLC fabricant dépassée : appliquer la procédure PMS, sans prolongation par l’IA.':validHours?'Durée de référence PMS pour les conditions déclarées ; ne jamais dépasser la DLC fabricant.':'Pour obtenir une durée utilisable, consultez une fiche PMS validée par votre chef.';
 }
 function setup(root){
  if(wired.has(root)||!root.classList.contains('h271-ready'))return;
  const card=root.querySelector('.h271-result > .h271-section.good');
  const ref=root.querySelector('[data-h268="reference"]');
  const advice=root.querySelector('[data-h268="result"]');
  const form=root.querySelector('[data-h268="form"]');
  if(!card||!ref||!advice||!form)return;
  wired.add(root);card.classList.add('h272-proposal-card');
  const heading=make('div','h272-head');const title=make('span','h272-head-title','DLC · Propositions');
  const infoBtn=make('button','h272-info-button','i');infoBtn.type='button';
  infoBtn.setAttribute('aria-label','Informations sur les durées et DLC');infoBtn.setAttribute('aria-expanded','false');
  const pop=make('div','h272-popover','Une durée proposée par l’IA n’est pas une DLC autorisée. Une durée applicable doit être justifiée pour le produit, son procédé, sa température et son conditionnement dans le PMS de l’établissement, puis validée par le chef. La DLC fabricant ne doit jamais être prolongée. Le sous-vide ne prolonge pas automatiquement la conservation.');
  pop.hidden=true;pop.id='h272-help-'+(root.id||'haccp').replace(/[^a-z0-9_-]/gi,'');infoBtn.setAttribute('aria-controls',pop.id);
  infoBtn.addEventListener('click',()=>{pop.hidden=!pop.hidden;infoBtn.setAttribute('aria-expanded',String(!pop.hidden));});
  infoBtn.addEventListener('keydown',e=>{if(e.key==='Escape'){pop.hidden=true;infoBtn.setAttribute('aria-expanded','false');infoBtn.focus();}});
  heading.append(title,infoBtn);
  function row(label,key){const r=make('div','h272-proposal-row');r.append(make('span','h272-proposal-name',label));const value=make('span','h272-proposal-value muted','—');value.setAttribute('data-h272',key);r.append(value);return r;}
  const rows=make('div','h272-rows');rows.append(row('Durée validée par le chef','validated'),row('DLC fabricant','manufacturer'),row('Analyse IA','ai'));
  const foot=make('p','h272-proposal-note','');foot.setAttribute('data-h272','foot');
  card.replaceChildren(heading,pop,rows,foot);
  const state={dirty:true,key:formKey(root)};
  const redraw=()=>render(root,card,state);
  form.addEventListener('input',()=>{state.dirty=true;state.key=formKey(root);redraw();});
  form.addEventListener('change',()=>{state.dirty=true;state.key=formKey(root);redraw();});
  // Le module existant est seul responsable des lectures/validations serveur.
  // Ici on observe uniquement ses résultats déjà contrôlés et on les présente.
  const watcher=new MutationObserver(()=>{if(!ref.hidden&&/^Référence validée par le chef/i.test((ref.textContent||'').trim()))state.dirty=false;redraw();});
  watcher.observe(ref,{attributes:true,attributeFilter:['hidden'],childList:true,characterData:true,subtree:true});
  const adviceWatcher=new MutationObserver(redraw);
  adviceWatcher.observe(advice,{attributes:true,attributeFilter:['hidden'],childList:true,characterData:true,subtree:true});
  root.addEventListener('toggle',redraw);
  redraw();
 }
 const init=()=>document.querySelectorAll('.h268-root.h271-ready').forEach(setup);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
 setInterval(init,2800);
})();
</script>
