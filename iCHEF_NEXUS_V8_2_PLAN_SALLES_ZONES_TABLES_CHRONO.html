<!DOCTYPE html>
<html lang="fr" data-ichef-module="padServer">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFFFFF">
    <title>iCHEF OS - Pad Serveur PRO</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. THÈME GLOBAL ET STRUCTURE DE BASE
   ========================================================= */
:root { --bg:#FFFFFF; --panel:#F4F4F6; --border:#CCCCCC; --text-main:#000000; --gold:#C5A059; --alert:#D9534F; }
html, body { font-family:'Inter', sans-serif; background:var(--bg); color:var(--text-main); margin:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
* { box-sizing:border-box; }
button { font-family:'Inter', sans-serif; }

/* En-tête */
header { display:flex; align-items:center; justify-content:space-between; padding:20px; min-height:120px; background:#E5E5E5; border-bottom:4px solid #CCC; flex-shrink:0; }
.header-left { display:flex; align-items:center; gap:20px; flex-shrink:0; }
#service-tools-bar { display:flex; align-items:center; gap:15px; padding:20px; background:#E5E5E5; border-bottom:4px solid #CCC; overflow-x:auto; white-space:nowrap; scrollbar-width:none; flex-shrink:0; }
#service-tools-bar::-webkit-scrollbar { display:none; }
.dock-btn, .folder-btn, .room-tab, .btn-mini-alert { min-height:80px; padding:15px 30px; border:4px solid #000; border-radius:12px; background:#FFF; color:#000; font-size:28px; font-weight:900; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; gap:15px; }
.dock-btn:active, .folder-btn:active, .room-tab:active { transform:scale(0.95); background:#E0E0E0; }
.room-tab.active { border-color:var(--gold); color:var(--gold); background:rgba(197,160,89,0.1); }
.dock-btn.primary { border-color:var(--gold); color:var(--gold); }
.service-dock-folders { margin-left:auto; }

/* Menu Outils */
.quick-folder-panel { position:fixed; top:125px; right:20px; width:500px; display:none; flex-direction:column; background:#FFF; border:6px solid #000; border-radius:20px; box-shadow:0 15px 40px rgba(0,0,0,0.4); z-index:10000; }
.quick-folder-panel.open { display:flex; }
.quick-folder-title { padding:25px; color:var(--gold); font-size:26px; font-weight:900; border-bottom:4px solid #CCC; text-align:center; }
.quick-folder-panel button { width:100%; min-height:80px; display:flex; align-items:center; padding:20px 25px; border:0; border-bottom:2px solid #EEE; background:transparent; font-size:28px; font-weight:900; text-align:left; cursor:pointer; gap:15px; }

/* Login PIN */
#login-screen { position:fixed; inset:0; background:#FFF; z-index:9999999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.pin-display { font-size:100px; letter-spacing:40px; margin-bottom:50px; color:#000; min-height:120px; }
.pin-pad { display:grid; grid-template-columns:repeat(3, 250px); gap:40px; }
.pin-btn { width:250px; height:250px; font-size:80px; font-weight:900; border:8px solid #000; border-radius:50%; background:#FFF; cursor:pointer; }
.pin-btn[onclick*="submitPin"] { background:#000; color:#FFF; }

/* Plan de salle (DrillDown) */
.dd-wrapper { display:flex; flex-direction:column; width:100%; height:100%; padding:40px; background:#FFF; overflow-y:auto; }
.dd-header { display:flex; align-items:center; gap:40px; border-bottom:8px solid #000; padding-bottom:30px; margin-bottom:40px; flex-shrink:0; }
.dd-title { font-size:70px; font-weight:900; color:#000; }
.dd-back, .dd-home { background:#000; color:#FFF; font-size:50px; font-weight:900; padding:20px 40px; border:none; border-radius:20px; cursor:pointer; }
.dd-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:40px; }
.dd-card { min-height:350px; border:10px solid #000; border-radius:30px; background:#F4F4F6; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; padding:30px; text-align:center; }
.dd-name { font-size:70px; font-weight:900; color:#000; }
.dd-status { font-size:50px; font-weight:900; margin-top:20px; color:#555; }
.dd-chrono { font-size:60px; font-weight:900; margin-top:20px; }
.dd-card.active { border-color:#3498db; } .dd-card.active .dd-status { color:#3498db; }
.dd-card.ready { border-color:#10b981; } .dd-card.ready .dd-status { color:#10b981; }

/* Modales */
.modal { position:fixed; inset:0; background:rgba(255,255,255,0.95); z-index:20000; display:none; flex-direction:column; align-items:center; justify-content:center; }
.modal.open { display:flex; }
.modal-card { background:#F4F4F6; padding:60px; border-radius:30px; border:10px solid #000; max-width:90%; max-height:90vh; overflow-y:auto; width:800px; }
.modal-title { font-size:60px; text-align:center; border-bottom:8px solid #000; padding-bottom:30px; margin-bottom:30px; font-weight:900; }
.edit-input { font-size:50px; padding:20px; border:4px solid #000; border-radius:12px; width:100%; margin-bottom:20px; }
.pay-btn { background:#FFF; border:8px solid #000; color:#000; padding:30px; border-radius:20px; font-weight:900; font-size:40px; width:100%; margin-top:20px; cursor:pointer; text-transform:uppercase; }
.pay-btn.cancel { border-color:#CCC; color:#555; }

/* =========================================================
   2. TIROIR COMMANDE (DOUBLE SÉPARATEUR & TACTILE)
   ========================================================= */
.drawer { position:fixed; inset:0; background:#FFF; z-index:10000; display:none; flex-direction:column; }
.drawer.open { display:flex; }

#dynamic-categories-container { background:#000 !important; border-bottom:4px solid var(--gold) !important; padding:10px !important; display:flex !important; align-items:center !important; overflow-x:auto; gap:10px; }
#dynamic-categories-container > button { background:#222 !important; color:#FFF !important; border:2px solid #444 !important; border-radius:8px !important; font-size:clamp(24px, 3vw, 36px) !important; min-height:60px !important; padding:10px 20px !important; white-space:nowrap; cursor:pointer; }
#dynamic-categories-container > button.ichef-cat-active { background:var(--gold) !important; color:#000 !important; border-color:var(--gold) !important; font-weight:900 !important; }

@media (max-width: 1200px) {
    #order-drawer .drawer-body {
        --ichef-ticket-left: 45%; 
        display:grid !important;
        grid-template-columns: minmax(0, var(--ichef-ticket-left)) 45px minmax(0, calc(100% - var(--ichef-ticket-left) - 45px)) !important;
        grid-template-rows: 100% !important;
        width:100vw !important; height:100dvh !important;
        position:fixed !important; top:0 !important; left:0 !important;
        overscroll-behavior:none !important; 
        overflow:hidden !important;
    }

    #ichef-structural-splitter {
        grid-column:2 !important; grid-row:1 !important;
        display:flex !important; align-items:center !important; justify-content:center !important;
        width:45px !important; height:100% !important;
        background:#000 !important; z-index:999999 !important;
        cursor:col-resize !important; touch-action:none !important; pointer-events:auto !important;
        border-left:2px solid #333 !important; border-right:2px solid #333 !important;
    }
    #ichef-structural-splitter::after {
        content:"⇹" !important; color:#000 !important; background:var(--gold) !important;
        border-radius:8px !important; width:38px !important; height:70px !important;
        display:flex !important; align-items:center !important; justify-content:center !important;
        font-size:28px !important; font-weight:900 !important; position:absolute !important;
        pointer-events:none !important; 
    }

    #order-drawer .drawer-left { grid-column:3 !important; grid-row:1 !important; width:100% !important; height:100% !important; display:flex !important; flex-direction:column !important; background:#e5e7eb !important; overscroll-behavior:contain !important; }
    
    #order-drawer .drawer-right { grid-column:1 !important; grid-row:1 !important; width:100% !important; height:100% !important; display:flex !important; flex-direction:column !important; background:#F4F4F6 !important; overflow:hidden !important; }
    
    #order-drawer .drawer-right > div[style*="flex: 1"], #order-drawer .drawer-right > div[style*="flex:1"] { flex:1 1 auto !important; min-height:0 !important; overflow:hidden !important; position:relative !important; }
    
    #ticket-list { position:absolute !important; inset:0 !important; overflow-y:auto !important; overflow-x:hidden !important; -webkit-overflow-scrolling:touch !important; touch-action:pan-y !important; pointer-events:auto !important; overscroll-behavior:contain !important; }

    /* Panneau glissant bas (Poignée) */
    .ichef-bottom-panel { position:relative !important; flex-shrink:0 !important; height:var(--ichef-bottom-height, 45vh) !important; display:flex !important; flex-direction:column !important; overflow-y:auto !important; background:#F4F4F6 !important; padding-top:0 !important; border-top:4px solid #CCC !important; touch-action:pan-y !important; overscroll-behavior:contain !important; }
    #ticket-total-price { border-top:none !important; margin-top:0 !important; padding-top:10px !important; }
    .ichef-bottom-handle { flex-shrink:0 !important; width:100% !important; height:70px !important; display:flex !important; align-items:center !important; justify-content:center !important; cursor:row-resize !important; touch-action:none !important; pointer-events:auto !important; position:sticky !important; top:0 !important; background:#F4F4F6 !important; z-index:100 !important; margin-bottom:5px !important; }
    .ichef-bottom-handle::after { content:"⇕" !important; background:var(--gold) !important; color:#000 !important; font-size:38px !important; font-weight:900 !important; width:120px !important; height:44px !important; display:flex !important; align-items:center !important; justify-content:center !important; border-radius:22px !important; box-shadow:0 4px 10px rgba(0,0,0,0.3) !important; }
}

/* Grille des plats */
.menu-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; padding:40px; overflow-y:auto; flex:1; min-height:0; -webkit-overflow-scrolling:touch; }
.btn-item { background:#FFF; border:6px solid #000; padding:25px; border-radius:20px; font-weight:900; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; text-align:left; text-transform:uppercase; cursor:pointer; width:100%; min-height:180px; }
.btn-item:active { transform:scale(0.98); background:#E0E0E0; }
.btn-item > span:first-of-type { font-size:35px; color:#000; line-height:1.3; word-break:break-word; }
.btn-item .price { font-size:40px; font-weight:900; color:var(--gold); margin-top:15px; }

/* Lignes du ticket */
.ticket-item-row { display:flex; flex-direction:column; padding:20px 0; border-bottom:4px solid #CCC; gap:10px;}
.ticket-row-main { display:flex; justify-content:space-between; width:100%; align-items:center; }
.ticket-row-actions { display:flex; gap:10px; width:100%; justify-content:flex-end; }
.item-action-btn { background:#E5E5E5; color:#000; border:4px solid #000; padding:15px; font-weight:900; font-size:25px; cursor:pointer; border-radius:12px; text-transform:uppercase; }
.item-action-btn.danger { background:var(--alert); color:#FFF; border-color:var(--alert); }

/* =========================================================
   3. LE HUB (ONGLETS DE SERVICE)
   ========================================================= */
#ichef-action-hub { border:4px solid #000; border-radius:16px; background:#fff; margin-bottom:12px; overflow:hidden; display:flex; flex-direction:column; flex-shrink:0; }
.hub-nav { display:flex; background:#e5e5e5; border-bottom:4px solid #000; }
.hub-tab-btn { flex:1; border:none; border-right:4px solid #000; background:transparent; font-size:clamp(24px, 4vw, 36px) !important; font-weight:900; padding:20px 5px; cursor:pointer; color:#777; text-transform:uppercase; transition:all 0.2s ease; }
.hub-tab-btn:last-child { border-right:none; }
.hub-tab-btn.active { background:#000; color:var(--gold); }
#ichef-sequence-panel, #ichef-human-check-panel, #ichef-smart-service-panel { border:none !important; margin:0 !important; border-radius:0 !important; padding:20px !important; }
#ichef-sequence-panel:not(.hub-active), #ichef-human-check-panel:not(.hub-active), #ichef-smart-service-panel:not(.hub-active) { display:none !important; }

/* =========================================================
   4. MODAL FAST RECAP (SQUARE / LIGHTSPEED STYLE)
   ========================================================= */
#ichef-fast-add-modal { z-index:2147483647 !important; }
#ichef-fast-add-modal .modal-card { width:95% !important; max-width:700px !important; padding:20px !important; border-radius:20px !important; display:flex; flex-direction:column; gap:20px; }
.fast-recap-header { text-align:center; border-bottom:4px solid #CCC; padding-bottom:15px; }
.fast-recap-title { font-size:clamp(35px, 5vw, 50px); font-weight:900; color:#000; line-height:1.1; margin-bottom:10px; }
.fast-recap-price { font-size:clamp(30px, 4vw, 40px); font-weight:900; color:var(--gold); }
.fast-qty-row { display:flex; align-items:center; justify-content:center; gap:30px; background:#FFF; border-radius:16px; padding:15px; border:4px solid #000; }
.fast-qty-btn { width:80px; height:80px; font-size:50px; font-weight:900; background:#E5E5E5; border:none; border-radius:12px; cursor:pointer; }
.fast-qty-display { font-size:60px; font-weight:900; width:80px; text-align:center; }
.fast-section-title { font-size:26px; font-weight:900; color:#555; margin-bottom:10px; text-transform:uppercase; }
.fast-grid-options { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:10px; }
.fast-opt-btn { min-height:70px; font-size:22px; font-weight:900; border:3px solid #000; border-radius:12px; background:#FFF; cursor:pointer; }
.fast-opt-btn.active { background:#000; color:#FFF; }
.fast-opt-btn.danger { color:var(--alert); border-color:var(--alert); }
.fast-opt-btn.danger.active { background:var(--alert); color:#FFF; }
#fast-obs-display { font-size:24px; font-weight:900; color:var(--gold); min-height:30px; text-align:center; }
.fast-actions { display:flex; gap:15px; margin-top:10px; }
.fast-actions button { flex:1; min-height:90px; font-size:30px; font-weight:900; border-radius:16px; border:4px solid #000; cursor:pointer; }
.fast-btn-valid { background:#10b981; border-color:#10b981; }

@media (max-width: 900px) {
    .fast-opt-btn { font-size:28px !important; min-height:90px !important; }
    .fast-section-title { font-size:32px !important; }
    #fast-obs-display { font-size:30px !important; }
    .fast-actions button { font-size:40px !important; min-height:110px !important; }
    .hub-tab-btn { font-size:32px !important; padding:25px 10px; }
}
</style>
</head>

<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">
    <script>
        var appUrlParams = new URLSearchParams(window.location.search);
        var appTenantID = appUrlParams.get('tenantID') || localStorage.getItem('ichef_tenant_id');
        var APP_SERVER_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:10000" : "https://tableau-system.onrender.com";
        window.ICHEF_SECURITY = { deviceId: localStorage.getItem('ichef_device_id') || ('dev_' + Math.random().toString(36).substr(2, 9)) };
        localStorage.setItem('ichef_device_id', window.ICHEF_SECURITY.deviceId);
    </script>

    <!-- ÉCRAN DE CONNEXION (PIN) -->
    <div id="login-screen">
        <h1 style="font-size: 120px; letter-spacing: 10px;">SALLE</h1>
        <div style="font-size: 50px; font-weight: 900; margin-bottom: 50px; color:#555;">Saisissez votre accès</div>
        <div id="pin-display" class="pin-display"></div>
        <div id="error-msg" style="display:none; color:#D9534F; font-size:50px; font-weight:900; margin-bottom:30px;"></div>
        <div class="pin-pad">
            <button class="pin-btn" onclick="appendPin(1)">1</button><button class="pin-btn" onclick="appendPin(2)">2</button><button class="pin-btn" onclick="appendPin(3)">3</button>
            <button class="pin-btn" onclick="appendPin(4)">4</button><button class="pin-btn" onclick="appendPin(5)">5</button><button class="pin-btn" onclick="appendPin(6)">6</button>
            <button class="pin-btn" onclick="appendPin(7)">7</button><button class="pin-btn" onclick="appendPin(8)">8</button><button class="pin-btn" onclick="appendPin(9)">9</button>
            <button class="pin-btn" onclick="clearPin()">C</button>
            <button class="pin-btn" onclick="appendPin(0)">0</button>
            <button class="pin-btn" onclick="submitPin()">OK</button>
        </div>
    </div>

    <!-- EN-TÊTE PRINCIPAL -->
    <header>
        <div class="header-left">
            <div style="font-size: 50px; color: #000; font-weight: 900;">PAD SERVEUR</div>
            <div id="user-badge" style="font-size: 40px; color:#555; font-weight: 900;">Utilisateur: Aucun</div>
            <div id="empire-clock" style="font-size: 50px; color: #000; font-weight: 900;">00:00</div>
        </div>
    </header>

    <!-- BARRE OUTILS -->
    <div id="service-tools-bar">
        <div class="room-tab active" onclick="goDD('ROOMS')">SALLE PRINCIPALE</div>
        <button class="btn-mini-alert">🧠 ANTI-RUSH <span id="rush-level-display">0</span>/5</button>
        <button class="dock-btn primary" onclick="openOrder('W'+Math.floor(Math.random()*1000))"><span class="dock-icon">📝</span> COMMANDE</button>
        <button class="dock-btn" onclick="promptCouverts()"><span class="dock-icon">👥</span> CLIENT +</button>
        <button class="dock-btn" onclick="alert('Passez en mode Archi pour créer une table.')"><span class="dock-icon">➕</span> TABLE +</button>
        <div class="service-dock-folders">
            <button class="folder-btn" onclick="logout()">🔒 QUITTER</button>
        </div>
    </div>

    <!-- ZONE PRINCIPALE -->
    <div class="floor-plan-wrapper" id="main-wrapper" style="flex: 1; overflow-y: auto; min-height: 0;">
        <div id="dd-ui-engine" class="dd-wrapper"></div>
        <div id="floor-plan" class="floor-plan"></div>
    </div>

    <!-- TIROIR COMMANDE BLINDÉ -->
    <div id="order-drawer" class="drawer">
        <div class="drawer-body" style="height:100dvh; display:grid; overflow:hidden; width:100%; max-width:100%;">
            
            <!-- COLONNE GAUCHE (MENU) -->
            <div class="drawer-left">
                <div id="dynamic-categories-container"></div>
                <div style="flex: 1; position: relative;">
                    <div id="menu-grid" class="menu-grid"></div>
                </div>
            </div>

            <div id="ichef-structural-splitter"></div>
            
            <!-- COLONNE DROITE (TICKET) -->
            <div class="drawer-right ticket-view">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:8px solid #000; padding-bottom:20px; margin-bottom:20px; flex-shrink:0;">
                    <h2 id="ticket-table-name" style="margin:0; font-size:60px;">TABLE --</h2>
                    <div style="display: flex; gap: 15px;">
                        <button class="pay-btn" style="width:auto; margin:0; font-size: 30px; background:#E5E5E5;" onclick="closeOrder()">🔙 RETOUR</button>
                        <button class="pay-btn" style="width:auto; margin:0; font-size: 30px; background:#555; color:#FFF;" onclick="closeAndGoHome()">🏠 PLAN</button>
                    </div>
                </div>

                <div style="flex: 1; position: relative;">
                    <div id="ticket-list"></div>
                </div>

                <!-- Actions ticket sous la poignée verticale -->
                <div style="flex-shrink:0; padding-top: 10px;">
                    <div id="ticket-total-price" class="ticket-total">0.00 €</div>
                    <button id="btn-send-kds" class="pay-btn" style="background:#000; color:#FFF;" onclick="processOrderDispatch()">👨‍🍳 ENVOYER CUISINE</button>
                    <button class="pay-btn" onclick="openPaymentModal()">🧾 ENCAISSER</button>
                    <div style="display:flex; gap:20px;">
                        <button class="pay-btn" style="flex:1;" onclick="executeSaveTableState()">💾 ATTENTE</button>
                        <button class="pay-btn cancel" style="flex:1;" onclick="closeOrder()">🗑️ ANNULER</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL : ERREUR -->
    <div id="error-item-modal" class="modal">
        <div class="modal-card">
            <div class="modal-title" style="color:#D9534F;">⚠️ REFAIRE LE PLAT</div>
            <div id="error-item-title" style="font-size:40px; font-weight:900; text-align:center; margin-bottom:30px;"></div>
            <p style="font-size:30px; font-weight:600; text-align:center; margin-bottom:30px;">Un ticket prioritaire sera envoyé.</p>
            <button class="pay-btn" style="border-color:#D9534F; color:#D9534F;" onclick="executeErrorItem('Tombé en salle / Erreur')">💥 TOMBÉ / ERREUR SERVEUR</button>
            <button class="pay-btn" style="border-color:#D9534F; color:#D9534F;" onclick="executeErrorItem('Retour Client (Froid, pas bon)')">🍽️ RETOUR CLIENT</button>
            <button class="pay-btn cancel" onclick="closeErrorModal()">🔙 ANNULER</button>
        </div>
    </div>

    <!-- MODAL : PAIEMENT -->
    <div id="payment-modal" class="modal">
        <div class="modal-card">
            <div class="modal-title" id="pay-modal-title">TABLE X</div>
            <div style="display:flex; justify-content:space-between; font-size:60px; font-weight:900; margin:40px 0;"><span>Total:</span> <span id="pay-modal-total">0.00 €</span></div>
            <div style="display:flex; justify-content:space-between; font-size:80px; font-weight:900; margin:40px 0; color:#000;"><span>Reste:</span> <span id="pay-remaining">0.00 €</span></div>
            <input type="number" id="pay-amount-input" class="edit-input" placeholder="Montant">
            <div class="pay-methods" style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <button class="pay-btn" onclick="processPartialPayment('CB')">💳 CB</button>
                <button class="pay-btn" onclick="processPartialPayment('ESPÈCES')">💶 ESPÈCES</button>
            </div>
            <button id="btn-close-table" class="pay-btn" style="display:none; background:#10b981; color:#000;" onclick="finalizeTablePayment()">✅ CLÔTURER LA TABLE</button>
            <button class="pay-btn cancel" onclick="closePaymentModal()">❌ FERMER</button>
        </div>
    </div>

    <!-- SCRIPT APPLICATION BASE -->
    <script>
        var activeOrders = {}; var currentTableId = null; var currentTicket = []; 
        var isArchiMode = false; var unifiedMenu = {}; var unifiedCategories = [];
        var rooms = ['Salle Principale']; var tables = []; var zones = [];
        var currentPin = ""; var loginInProgress = false; var currentTableTotal = 0;

        window.ddLevel = 'ROOMS';

        function goDD(level, param) {
            window.ddLevel = level;
            if (level === 'ROOMS') { window.ddRoom = null; window.ddZone = null; }
            if (level === 'ZONES') { window.ddRoom = param; window.ddZone = null; }
            if (level === 'TABLES') { window.ddZone = param; }
            renderDrillDown();
        }

        function appendPin(n) { if (currentPin.length < 12) { currentPin += n; document.getElementById('pin-display').innerText = '•'.repeat(currentPin.length); } }
        function clearPin() { currentPin = ''; document.getElementById('pin-display').innerText = ''; }

        async function submitPin() {
            if (loginInProgress || !currentPin) return;
            loginInProgress = true;
            try {
                const response = await fetch(`${APP_SERVER_URL}/api/verify-pin`, {
                    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenantID: appTenantID, pin: currentPin, deviceId: window.ICHEF_SECURITY?.deviceId || null })
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error("Erreur");
                
                window.currentUser = { name: data.name || "Serveur", role: "Serveur", id: data.userId };
                document.getElementById('user-badge').innerText = `Badge: ${window.currentUser.name}`;
                document.getElementById('login-screen').style.display = 'none';
                clearPin();
                syncData();
                setInterval(syncData, 3000);
            } catch (e) {
                alert("Code erroné");
                clearPin();
            } finally {
                loginInProgress = false;
            }
        }

        function logout() { document.getElementById('login-screen').style.display = 'flex'; closeOrder(); clearPin(); }
        setInterval(() => { document.getElementById('empire-clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}); }, 1000);

        function securityHeaders() { return { 'Content-Type': 'application/json' }; }
        async function secureFetch(url, options) { return fetch(url, options); }

        async function syncData() {
            if (isArchiMode) return; 
            try {
                const res = await secureFetch(`${APP_SERVER_URL}/get-current-state?tenantID=${appTenantID}`);
                const state = await res.json();
                if (state && state.activeOrders) {
                    let nO = state.activeOrders;
                    if (nO['ARCHITECTURE']) {
                        let archi = nO['ARCHITECTURE'].data || nO['ARCHITECTURE'];
                        if (archi.rooms) rooms = archi.rooms;
                        if (archi.tables) tables = archi.tables;
                        if (archi.zones) zones = archi.zones;
                    }
                    unifiedCategories = [...(nO['CATEGORIES_CUISINE']?.data || []), ...(nO['CATEGORIES_BAR']?.data || [])];
                    unifiedMenu = { ...(nO['MENU_MASTER']?.data || {}), ...(nO['MENU_MASTER_BAR']?.data || {}) };
                    activeOrders = nO;
                    renderDrillDown();
                }
            } catch(e) {}
        }

        function renderDrillDown() {
            if (isArchiMode) return;
            let ddUI = document.getElementById('dd-ui-engine');
            if (!ddUI) return;
            ddUI.innerHTML = '';

            if (window.ddLevel === 'ROOMS') {
                let header = document.createElement('div'); header.className = 'dd-header';
                header.innerHTML = `<div class="dd-title">🏢 RESTAURANT > SALLES</div>`;
                ddUI.appendChild(header);
                let grid = document.createElement('div'); grid.className = 'dd-grid';
                rooms.forEach(r => { 
                    let card = document.createElement('div'); card.className = 'dd-card';
                    card.innerHTML = `<div class="dd-name">🚪 ${r}</div>`;
                    card.onclick = function() { goDD('ZONES', r); }; grid.appendChild(card);
                });
                ddUI.appendChild(grid);
            } 
            else if (window.ddLevel === 'ZONES') {
                let header = document.createElement('div'); header.className = 'dd-header';
                header.innerHTML = `<button class="dd-back" onclick="goDD('ROOMS')">🔙 SALLES</button><div class="dd-title">SALLE : ${window.ddRoom}</div>`;
                ddUI.appendChild(header);
                let grid = document.createElement('div'); grid.className = 'dd-grid';
                zones.filter(z => z.room === window.ddRoom).forEach(z => {
                    let card = document.createElement('div'); card.className = 'dd-card';
                    card.innerHTML = `<div class="dd-name">🔲 ${z.label}</div>`;
                    card.onclick = function() { goDD('TABLES', z.id); }; grid.appendChild(card);
                });
                ddUI.appendChild(grid);
            } 
            else if (window.ddLevel === 'TABLES') {
                let header = document.createElement('div'); header.className = 'dd-header';
                header.innerHTML = `<button class="dd-back" onclick="goDD('ZONES', window.ddRoom)">🔙 ZONES</button><div class="dd-title">TABLES</div>`;
                ddUI.appendChild(header);
                let grid = document.createElement('div'); grid.className = 'dd-grid';
                
                let tTables = tables.filter(t => t.room === window.ddRoom);
                tTables.forEach(t => {
                    let card = document.createElement('div'); card.className = `dd-card`;
                    card.innerHTML = `<div class="dd-name">TABLE ${t.label}</div>`;
                    card.onclick = function() { openOrder(t.label); }; grid.appendChild(card);
                });
                ddUI.appendChild(grid);
            }
        }

        function openOrder(tableLabel) {
            currentTableId = tableLabel;
            document.getElementById('ticket-table-name').innerText = "TABLE " + tableLabel;
            if (activeOrders[tableLabel] && activeOrders[tableLabel].items) currentTicket = JSON.parse(JSON.stringify(activeOrders[tableLabel].items));
            else currentTicket = [];

            document.getElementById('order-drawer').classList.add('open');
            let catContainer = document.getElementById('dynamic-categories-container');
            catContainer.innerHTML = unifiedCategories.map(c => `<button class="pay-btn" style="width:auto; margin:0; font-size:35px;" onclick="renderMenu('${c.id}')">${c.label}</button>`).join('');
            renderMenu(unifiedCategories[0]?.id || 'MenuJour');
            renderTicket();
        }

        function closeOrder() { document.getElementById('order-drawer').classList.remove('open'); currentTableId = null; }
        function closeAndGoHome() { closeOrder(); goDD('ROOMS'); }

        function renderMenu(catId) {
            let items = unifiedMenu[catId] || [];
            let grid = document.getElementById('menu-grid');
            grid.innerHTML = ''; 
            if(items.length === 0) return;
            items.forEach(item => {
                let btn = document.createElement('div'); btn.className = 'btn-item';
                btn.onclick = function() { addToTicket(item.name, parseFloat(item.price || 0)); };
                btn.innerHTML = `<span>${item.name}</span><span class="price">${parseFloat(item.price || 0).toFixed(2)} €</span>`;
                grid.appendChild(btn);
            });
        }

        function renderTicket() {
            let total = 0;
            let html = currentTicket.map((i, idx) => {
                total += (i.p * (i.qty || 1));
                let status = !i.isSent ? '<span style="color:#3498db;">NOUVEAU</span>' : (i.done ? '<span style="color:#10b981;">PRÊT</span>' : '<span style="color:#e056fd;">ATTENTE</span>');
                let cookingBadge = i.cooking ? `<span style="color:#8a681e; font-size:24px; font-weight:900;">🔥 ${i.cooking}</span> ` : '';
                let allergyBadge = i.allergy ? `<span style="color:#D9534F; font-size:24px; font-weight:900;">⚠️ ALLERGIE</span> ` : '';
                let obsText = i.obs ? `<div style="color:#555; font-size:26px; font-weight:800; margin-top:8px;">${i.obs}</div>` : '';

                let actionsHtml = !i.isSent ? `<button class="item-action-btn danger" onclick="removeTicketItem(${idx})">✕</button>` : `<button class="item-action-btn danger" onclick="openErrorModal(${idx})">⚠️ REFAIRE</button>`;

                return `<div class="ticket-item-row"><div class="ticket-row-main"><div><div style="font-size:45px; font-weight:900;">${i.qty||1}x ${i.n}</div><div>${cookingBadge}${allergyBadge}</div>${obsText}<div style="font-size:35px; margin-top:10px;">${status}</div></div><div style="font-size:50px; font-weight:900;">${(i.p * (i.qty || 1)).toFixed(2)} €</div></div><div class="ticket-row-actions">${actionsHtml}</div></div>`;
            }).join('');

            document.getElementById('ticket-list').innerHTML = html;
            document.getElementById('ticket-total-price').innerText = total.toFixed(2) + ' €';
            currentTableTotal = total;
            
            // Met à jour les panneaux KDS / HUB si présents
            if(window.refreshSequencePanel) window.refreshSequencePanel();
            if(window.refreshHumanCheckPanel) window.refreshHumanCheckPanel();
        }

        function removeTicketItem(idx) { currentTicket.splice(idx, 1); renderTicket(); }

        let pendingErrorIndex = null;
        function openErrorModal(idx) { pendingErrorIndex = idx; document.getElementById('error-item-title').innerText = currentTicket[idx].n; document.getElementById('error-item-modal').classList.add('open'); }
        function closeErrorModal() { pendingErrorIndex = null; document.getElementById('error-item-modal').classList.remove('open'); }

        async function executeErrorItem(motif) {
            if(pendingErrorIndex === null) return;
            let item = currentTicket[pendingErrorIndex];
            item.originalPrice = item.p; item.p = 0; item.obs = `❌ ANNULÉ (${motif})`; item.done = true; 
            let newItem = JSON.parse(JSON.stringify(item));
            newItem.id = Date.now(); newItem.p = item.originalPrice; newItem.done = false; newItem.served = false; newItem.isSent = true; newItem.obs = `🔥 URGENT : REFAIRE (${motif})`;
            currentTicket.push(newItem); closeErrorModal(); renderTicket(); await executeSaveTableState();
        }

        async function processOrderDispatch() {
            currentTicket.forEach(i => { if(!i.isSent) { i.isSent = true; i.itemId = Date.now(); } });
            renderTicket(); await executeSaveTableState();
            alert("✅ Commande envoyée !");
        }

        async function executeSaveTableState() {
            if(currentTableId) {
                await secureFetch(`${APP_SERVER_URL}/update-order?tenantID=${appTenantID}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tableId: currentTableId, order: { items: currentTicket, status: 'pending' } })
                });
            }
            closeOrder(); renderDrillDown();
        }

        function openPaymentModal() {
            if(currentTicket.length === 0) return alert("Table vide.");
            window.currentPayRemaining = currentTableTotal; window.paymentsDone = [];
            document.getElementById('pay-modal-total').innerText = currentTableTotal.toFixed(2) + " €";
            document.getElementById('pay-remaining').innerText = window.currentPayRemaining.toFixed(2) + " €";
            document.getElementById('pay-amount-input').value = window.currentPayRemaining.toFixed(2);
            document.getElementById('payment-modal').classList.add('open');
            document.querySelector('.pay-methods').style.display = 'grid';
            document.getElementById('btn-close-table').style.display = 'none';
        }
        function closePaymentModal() { document.getElementById('payment-modal').classList.remove('open'); }

        function processPartialPayment(method) {
            let amt = parseFloat(document.getElementById('pay-amount-input').value);
            if(isNaN(amt) || amt <= 0) return;
            window.currentPayRemaining -= amt;
            if(window.currentPayRemaining <= 0) {
                window.currentPayRemaining = 0;
                document.querySelector('.pay-methods').style.display = 'none';
                document.getElementById('btn-close-table').style.display = 'block';
            }
            document.getElementById('pay-remaining').innerText = window.currentPayRemaining.toFixed(2) + " €";
            document.getElementById('pay-amount-input').value = window.currentPayRemaining.toFixed(2);
        }

        async function finalizeTablePayment() {
            await secureFetch(`${APP_SERVER_URL}/update-order?tenantID=${appTenantID}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tableId: currentTableId, order: null }) 
            });
            closePaymentModal(); closeOrder(); renderDrillDown();
        }
    </script>

    <!-- HUB ONGLET PRO -->
    <script id="ichef-pro-tabs-engine">
    (function(){
        "use strict";
        function buildHub() {
            const p1 = document.getElementById('ichef-human-check-panel');
            const p2 = document.getElementById('ichef-sequence-panel');
            const p3 = document.getElementById('ichef-smart-service-panel');
            
            if ((p1 || p2 || p3) && !document.getElementById('ichef-action-hub')) {
                const hub = document.createElement('div'); hub.id = 'ichef-action-hub';
                const nav = document.createElement('div'); nav.className = 'hub-nav';
                const content = document.createElement('div'); content.className = 'hub-content';
                
                const firstPanel = p1 || p2 || p3;
                firstPanel.parentNode.insertBefore(hub, firstPanel);
                hub.appendChild(nav); hub.appendChild(content);
                
                const tabs = [
                    { id: 'ichef-human-check-panel', label: '🛡️ CONTRÔLE', el: p1 },
                    { id: 'ichef-sequence-panel', label: '🧾 SÉQUENCES', el: p2 },
                    { id: 'ichef-smart-service-panel', label: '👥 SUIVI', el: p3 }
                ];
                
                let activeSet = false;
                tabs.forEach(t => {
                    if(t.el) {
                        content.appendChild(t.el); 
                        const btn = document.createElement('button');
                        btn.className = 'hub-tab-btn'; btn.innerHTML = t.label;
                        if(!activeSet) { btn.classList.add('active'); t.el.classList.add('hub-active'); activeSet = true; }
                        
                        btn.onclick = () => {
                            nav.querySelectorAll('.hub-tab-btn').forEach(b => b.classList.remove('active'));
                            content.querySelectorAll('> div, > section').forEach(p => p.classList.remove('hub-active'));
                            btn.classList.add('active'); t.el.classList.add('hub-active');
                        };
                        nav.appendChild(btn);
                    }
                });
            }
        }
        if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", () => setInterval(buildHub, 500)); } else { setInterval(buildHub, 500); }
    })();
    </script>

    <!-- FAST RECAP (MICROS / LIGHTSPEED) -->
    <script id="ichef-fast-recap-engine">
    (function(){
        "use strict";

        function buildFastAddModal() {
            if(document.getElementById('ichef-fast-add-modal')) return;
            const modal = document.createElement('div');
            modal.id = 'ichef-fast-add-modal'; modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-card">
                    <div class="fast-recap-header">
                        <div class="fast-recap-title" id="fast-add-name">Nom</div>
                        <div class="fast-recap-price" id="fast-add-price">0.00 €</div>
                    </div>
                    <div class="fast-qty-row">
                        <button class="fast-qty-btn" onclick="fastAddChangeQty(-1)">−</button>
                        <div class="fast-qty-display" id="fast-add-qty">1</div>
                        <button class="fast-qty-btn" onclick="fastAddChangeQty(1)">+</button>
                    </div>
                    <div id="fast-cuisson-container" style="display:none;">
                        <div class="fast-section-title">🔥 CUISSON</div>
                        <div class="fast-grid-options" id="fast-cuisson-grid">
                            <button class="fast-opt-btn" onclick="fastAddSetCuisson(this, 'BLEU')">Bleu</button>
                            <button class="fast-opt-btn" onclick="fastAddSetCuisson(this, 'SAIGNANT')">Saignant</button>
                            <button class="fast-opt-btn" onclick="fastAddSetCuisson(this, 'À POINT')">À Point</button>
                            <button class="fast-opt-btn" onclick="fastAddSetCuisson(this, 'BIEN CUIT')">Bien Cuit</button>
                        </div>
                    </div>
                    <div>
                        <div class="fast-section-title">✏️ AJOUTS / RETRAITS</div>
                        <div class="fast-grid-options">
                            <button class="fast-opt-btn" onclick="fastAddToggleMod(this, 'Sans Oignon')">Sans Oignon</button>
                            <button class="fast-opt-btn" onclick="fastAddToggleMod(this, 'Sans Sauce')">Sans Sauce</button>
                            <button class="fast-opt-btn" onclick="fastAddToggleMod(this, 'Sauce à part')">Sauce à part</button>
                            <button class="fast-opt-btn danger" onclick="fastAddToggleMod(this, '🚨 ALLERGIE')">⚠️ ALLERGIE</button>
                        </div>
                    </div>
                    <div id="fast-obs-display"></div>
                    <div class="fast-actions">
                        <button class="fast-btn-cancel" onclick="closeFastAdd()">ANNULER</button>
                        <button class="fast-btn-valid" onclick="confirmFastAdd()">✅ AJOUTER</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }

        window.fastState = { n: '', p: 0, qty: 1, cooking: '', obs: [] };

        window.addToTicket = function(name, price) {
            if(!document.getElementById('ichef-fast-add-modal')) buildFastAddModal();
            window.fastState = { n: name, p: parseFloat(price)||0, qty: 1, cooking: '', obs: [] };
            
            document.getElementById('fast-add-name').innerText = name;
            document.getElementById('fast-add-price').innerText = window.fastState.p.toFixed(2) + ' €';
            document.getElementById('fast-add-qty').innerText = window.fastState.qty;
            document.getElementById('fast-obs-display').innerText = "";
            document.querySelectorAll('.fast-opt-btn').forEach(b => b.classList.remove('active'));

            const upper = name.toUpperCase();
            const needsCooking = ['BŒUF', 'VIANDE', 'ENTRECÔTE', 'STEAK', 'ONGLET', 'BAVETTE', 'BURGER'].some(m => upper.includes(m));
            document.getElementById('fast-cuisson-container').style.display = needsCooking ? 'block' : 'none';
            document.getElementById('ichef-fast-add-modal').classList.add('open');
        };

        window.fastAddChangeQty = function(delta) {
            let newQty = window.fastState.qty + delta;
            if (newQty < 1) newQty = 1; if (newQty > 99) newQty = 99;
            window.fastState.qty = newQty;
            document.getElementById('fast-add-qty').innerText = newQty;
            document.getElementById('fast-add-price').innerText = (window.fastState.p * newQty).toFixed(2) + ' €';
        };

        window.fastAddSetCuisson = function(btn, cuisson) {
            document.querySelectorAll('#fast-cuisson-grid .fast-opt-btn').forEach(b => b.classList.remove('active'));
            if (window.fastState.cooking === cuisson) { window.fastState.cooking = ''; } else { window.fastState.cooking = cuisson; btn.classList.add('active'); }
        };

        window.fastAddToggleMod = function(btn, mod) {
            const index = window.fastState.obs.indexOf(mod);
            if (index > -1) { window.fastState.obs.splice(index, 1); btn.classList.remove('active'); } 
            else { window.fastState.obs.push(mod); btn.classList.add('active'); }
            document.getElementById('fast-obs-display').innerText = window.fastState.obs.join(' | ');
        };

        window.closeFastAdd = function() { document.getElementById('ichef-fast-add-modal').classList.remove('open'); };

        window.confirmFastAdd = function() {
            let finalObs = window.fastState.obs.join(' | ');
            let newItem = {
                id: Date.now(), itemId: Date.now(),
                n: window.fastState.n, p: window.fastState.p, qty: window.fastState.qty,
                cooking: window.fastState.cooking, allergy: window.fastState.obs.find(o => o.includes('ALLERGIE')) ? 'OUI' : '',
                obs: finalObs, isSent: false, done: false, served: false
            };
            if(typeof currentTicket !== 'undefined') currentTicket.push(newItem);
            closeFastAdd();
            if(typeof renderTicket === 'function') renderTicket();
        };

        if(document.readyState === "loading") { document.addEventListener("DOMContentLoaded", buildFastAddModal); } else { buildFastAddModal(); }
    })();
    </script>

    <!-- DOUBLE SEPARATEUR (Largeur et Hauteur) -->
    <script id="ichef-dual-splitters-engine">
    (function(){
        "use strict";
        function installDualSplitters() {
            if (window.innerWidth > 1200) return;
            const body = document.querySelector("#order-drawer .drawer-body");
            const hSplit = document.getElementById("ichef-structural-splitter");
            
            if (body && hSplit && hSplit.dataset.hBound !== "1") {
                hSplit.dataset.hBound = "1";
                let draggingH = false, pidH = null;
                hSplit.addEventListener("pointerdown", e => { draggingH = true; pidH = e.pointerId; try { hSplit.setPointerCapture(pidH); } catch(_) {} e.preventDefault(); }, { passive: false });
                hSplit.addEventListener("pointermove", e => {
                    if (!draggingH || e.pointerId !== pidH) return;
                    const rect = body.getBoundingClientRect(); if (!rect.width) return;
                    let pct = ((e.clientX - rect.left) / rect.width) * 100;
                    pct = Math.max(20, Math.min(80, pct));
                    body.style.setProperty("--ichef-ticket-left", pct + "%", "important");
                    e.preventDefault();
                }, { passive: false });
                const stopH = () => { draggingH = false; try { if (pidH !== null) hSplit.releasePointerCapture(pidH); } catch(_) {} pidH = null; };
                hSplit.addEventListener("pointerup", stopH); hSplit.addEventListener("pointercancel", stopH);
            }

            const totalEl = document.getElementById('ticket-total-price');
            if (totalEl && totalEl.parentElement) {
                const bottomPanel = totalEl.parentElement;
                if (bottomPanel.dataset.vBound !== "1") {
                    bottomPanel.dataset.vBound = "1";
                    bottomPanel.classList.add('ichef-bottom-panel');
                    const vSplit = document.createElement('div'); vSplit.className = 'ichef-bottom-handle';
                    bottomPanel.insertBefore(vSplit, totalEl);
                    
                    let draggingV = false, startY = 0, startHeight = 0, pidV = null;
                    vSplit.addEventListener('pointerdown', e => {
                        draggingV = true; pidV = e.pointerId; startY = e.clientY; startHeight = bottomPanel.getBoundingClientRect().height;
                        try { vSplit.setPointerCapture(pidV); } catch(err){} e.preventDefault();
                    });
                    vSplit.addEventListener('pointermove', e => {
                        if (!draggingV || e.pointerId !== pidV) return;
                        const deltaY = startY - e.clientY; let newHeight = startHeight + deltaY;
                        const maxH = window.innerHeight * 0.85; const minH = window.innerHeight * 0.15;
                        newHeight = Math.max(minH, Math.min(maxH, newHeight));
                        bottomPanel.style.setProperty('--ichef-bottom-height', newHeight + 'px', 'important'); e.preventDefault();
                    });
                    const stopV = () => { draggingV = false; try { if (pidV !== null) vSplit.releasePointerCapture(pidV); } catch(err){} pidV = null; };
                    vSplit.addEventListener('pointerup', stopV); vSplit.addEventListener('pointercancel', stopV);
                }
            }
        }
        if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", () => setInterval(installDualSplitters, 500)); } else { setInterval(installDualSplitters, 500); }
    })();
    </script>
