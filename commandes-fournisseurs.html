<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="ichef-build" content="V137-ECONOMAT-ACHATS-TACHES-SECURE"><title>Commandes fournisseurs · iCHEF</title><style>
:root{--bg:#07090b;--panel:#0d1114;--line:rgba(255,255,255,.08);--text:#f4f5f6;--muted:#8b949b;--gold:#d8ad55;--red:#ef6868;--green:#4fd18b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 15% 0%,rgba(216,173,85,.08),transparent 24%),#07090b}
button,input,select,textarea{font:inherit}.shell{width:min(1280px,100%);margin:auto;padding:18px 18px 90px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}.brand{font-weight:950;font-size:1.45rem}.brand span{color:var(--gold)}.grow{flex:1}.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#0b0f12;color:var(--muted);font-size:.7rem}.chip.ok{color:#8be1b2}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.nav a{padding:9px 12px;border-radius:10px;text-decoration:none;background:#0d1216;border:1px solid var(--line);font-size:.72rem;font-weight:800;color:#b6bec4}.nav a.active{color:#15100a;background:var(--gold);border-color:var(--gold)}
.hero{display:flex;align-items:end;gap:14px;justify-content:space-between;margin:14px 0 18px}.hero h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:0}.hero p{margin:5px 0 0;color:var(--muted);font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);background:#151b20;color:#edf0f2;border-radius:11px;min-height:40px;padding:0 13px;font-weight:850;cursor:pointer}.btn.primary{background:var(--gold);border-color:var(--gold);color:#111}.btn.danger{border-color:rgba(239,104,104,.35);color:#ff9a9a;background:rgba(239,104,104,.07)}.btn.good{border-color:rgba(79,209,139,.35);color:#8be1b2;background:rgba(79,209,139,.07)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.stat{padding:13px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#0f1519,#0a0d10)}.stat small{display:block;color:var(--muted);font-size:.62rem}.stat strong{display:block;margin-top:4px;font-size:1.35rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{height:40px;border:1px solid var(--line);background:#0d1216;color:#fff;border-radius:10px;padding:0 11px;outline:none}.toolbar input{min-width:min(320px,100%);flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#0f1418,#0a0d0f);border-radius:16px;padding:14px}.card-head{display:flex;gap:10px}.card h3{margin:0;font-size:.94rem}.card p{color:var(--muted);font-size:.72rem;line-height:1.5}.meta,.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{border-radius:999px;padding:5px 8px;background:#151c21;border:1px solid var(--line);font-size:.58rem;color:#aeb7bd;font-weight:800}.tag.urgent{color:#ff9a9a}.tag.important{color:#e4c271}.tag.good{color:#8be1b2}.actions .btn{min-height:34px;font-size:.64rem}
.empty{padding:32px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78)}.modal.open{display:flex}.modal-card{width:min(680px,100%);max-height:92vh;overflow:auto;background:#0d1216;border:1px solid rgba(216,173,85,.25);border-radius:18px;padding:16px}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:1rem}.close{border:0;background:transparent;color:#fff;font-size:1.5rem}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:.62rem;color:#9ba3a9;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0a0e11;color:#fff;border-radius:10px;padding:10px}.field textarea{min-height:96px}.field select[multiple]{min-height:120px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.notice{position:fixed;right:16px;bottom:16px;z-index:300;padding:11px 13px;border-radius:11px;background:#172029;border:1px solid var(--line);font-size:.72rem;display:none}.notice.show{display:block}.notice.error{color:#ffaaaa}.small-list{display:flex;flex-direction:column;gap:5px;margin-top:8px}.small-row{padding:7px 8px;border-radius:9px;background:#0a0e11;color:#b3bbc1;font-size:.63rem}details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:#aeb6bc;font-size:.65rem}.auth-wall{max-width:560px;margin:12vh auto;padding:24px;border:1px solid var(--line);border-radius:18px;background:#0e1317;text-align:center}.auth-wall p{color:var(--muted)}
@media(max-width:760px){.shell{padding:12px 10px 80px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{overflow:auto;flex-wrap:nowrap}.nav a{white-space:nowrap}}
</style></head><body><div class="shell"><header class="topbar"><div class="brand">i<span>CHEF</span></div><span class="chip" id="who">Connexion…</span><div class="grow"></div><span class="chip ok">V136 sécurisé</span></header><nav class="nav"><a data-module="taches.html" class="">Tâches</a><a data-module="fournisseurs.html" id="navSuppliers" class="">Fournisseurs</a><a data-module="commandes-fournisseurs.html" id="navOrders" class="active">Commandes fournisseurs</a><a id="backPortal">Portail Staff</a></nav><section class="hero"><div><h1>Commandes fournisseurs</h1><p>Préparation, validation, envoi et réception des achats.</p></div><div id="heroAction"></div></section><div class="stats"><div class="stat"><small>À valider</small><strong id="sPending">0</strong></div><div class="stat"><small>Approuvées</small><strong id="sApproved">0</strong></div><div class="stat"><small>Envoyées</small><strong id="sSent">0</strong></div><div class="stat"><small>Reçues</small><strong id="sReceived">0</strong></div></div><div class="toolbar"><input id="search" type="search" placeholder="Rechercher une commande…"><select id="statusFilter"><option value="">Toutes</option><option value="DRAFT">Brouillons</option><option value="PENDING_APPROVAL">À valider</option><option value="APPROVED">Approuvées</option><option value="SENT">Envoyées</option><option value="PARTIAL">Partielles</option><option value="RECEIVED">Reçues</option></select></div><div class="grid" id="orderGrid"><div class="empty">Chargement…</div></div><div class="modal" id="orderModal"><div class="modal-card"><div class="modal-head"><h2>Nouvelle commande fournisseur</h2><button class="close" id="orderClose">×</button></div><div class="form"><div class="field"><label>Fournisseur</label><select id="oSupplier"></select></div><div class="field"><label>Devise</label><select id="oCurrency"><option>CHF</option><option>EUR</option></select></div><div class="field"><label>Livraison souhaitée</label><input id="oDelivery" type="datetime-local"></div><div class="field"><label>Workflow</label><select id="oSubmit"><option value="0">Brouillon</option><option value="1">Envoyer pour validation</option></select></div><div class="field full"><label>Notes</label><textarea id="oNotes"></textarea></div><div class="field full"><label>Articles</label><div id="itemRows"></div><button class="btn" id="addItemBtn" type="button">＋ Ajouter un article</button></div><div class="field full"><label><input id="oTask" type="checkbox" checked> Créer une tâche de réception</label></div></div><div class="form-actions"><button class="btn" id="orderCancel">Annuler</button><button class="btn primary" id="orderSave">Créer</button></div></div></div></div><div class="notice" id="notice"></div><script>
const SERVER_URL=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:10000':'https://tableau-system.onrender.com';
const TENANT=()=>String(new URLSearchParams(location.search).get('tenantID')||localStorage.getItem('ichef_tenant_id')||'').trim().toUpperCase();
const TOKEN=()=>sessionStorage.getItem('ichef_ops_token')||sessionStorage.getItem('ichef_auth_token')||sessionStorage.getItem('ichef_access_token')||'';
const DEVICE=()=>String(localStorage.getItem('ichef_device_id')||localStorage.getItem('ichef_device_fingerprint')||'').trim();
function authHeaders(json=false){const h={'Accept':'application/json','X-iCHEF-Tenant':TENANT()};if(TOKEN())h.Authorization=`Bearer ${TOKEN()}`;if(DEVICE())h['X-iCHEF-Device']=DEVICE();if(json)h['Content-Type']='application/json';return h}
async function api(path,opt={}){const r=await fetch(`${SERVER_URL}${path}`,{cache:'no-store',credentials:'omit',...opt,headers:{...authHeaders(Boolean(opt.body)),...(opt.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok||data.success===false)throw new Error(data.error||`Erreur ${r.status}`);return data}
function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v,c='CHF'){return `${Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} ${c}`}
function dateTime(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function notice(msg,type=''){const n=document.getElementById('notice');n.textContent=msg;n.className=`notice show ${type}`;clearTimeout(window.__nTimer);window.__nTimer=setTimeout(()=>n.className='notice',3200)}
function moduleLink(name){const t=TENANT();return `${name}${t?`?tenantID=${encodeURIComponent(t)}`:''}`}
function safeReturnModule(){const r=String(new URLSearchParams(location.search).get('returnTo')||'').trim();return ['economat.html','portail-staff.html'].includes(r)?r:'portail-staff.html'}
function wireNav(){document.querySelectorAll('[data-module]').forEach(a=>a.href=moduleLink(a.dataset.module));const b=document.getElementById('backPortal');if(b){const target=safeReturnModule();b.href=moduleLink(target);b.textContent=target==='economat.html'?'Économat':'Portail Staff'}}
function noSession(){return !TENANT()||!TOKEN()||!DEVICE()}
function showAuthWall(message='Votre session Staff est requise.'){document.body.innerHTML=`<div class="auth-wall"><div class="brand">i<span>CHEF</span></div><h2>Connexion requise</h2><p>${esc(message)}</p><a class="btn primary" href="${moduleLink('portail-staff.html')}">Retour au Portail Staff</a></div>`}


let CTX=null,ORDERS=[],SUPPLIERS=[];const L={DRAFT:'Brouillon',PENDING_APPROVAL:'À valider',APPROVED:'Approuvée',SENT:'Envoyée',PARTIAL:'Partielle',RECEIVED:'Reçue',CANCELLED:'Annulée'};
function addOrderItemRow(v={}){const row=document.createElement('div');row.className='small-row';row.dataset.inventoryItemId=String(v.inventoryItemId||'');row.style.display='grid';row.style.gridTemplateColumns='2fr .7fr .7fr .8fr auto';row.style.gap='6px';row.innerHTML=`<input data-i="name" placeholder="Article" value="${esc(v.name||'')}"><input data-i="quantity" type="number" min=".001" step=".001" placeholder="Qté" value="${esc(v.quantity||'')}"><input data-i="unit" placeholder="Unité" value="${esc(v.unit||'unité')}"><input data-i="unitPrice" type="number" min="0" step=".01" placeholder="Prix/u" value="${esc(v.unitPrice||'')}"><button class="btn danger" type="button">×</button>`;row.querySelector('button').onclick=()=>row.remove();itemRows.appendChild(row)}
function render(){const q=search.value.toLowerCase(),f=statusFilter.value;sPending.textContent=ORDERS.filter(o=>o.status==='PENDING_APPROVAL').length;sApproved.textContent=ORDERS.filter(o=>o.status==='APPROVED').length;sSent.textContent=ORDERS.filter(o=>['SENT','PARTIAL'].includes(o.status)).length;sReceived.textContent=ORDERS.filter(o=>o.status==='RECEIVED').length;const rows=ORDERS.filter(o=>(!f||o.status===f)&&(!q||`${o.id} ${o.supplierName}`.toLowerCase().includes(q)));orderGrid.innerHTML=rows.length?rows.map(o=>`<article class="card"><div class="card-head"><div class="grow"><h3>${esc(o.supplierName)}</h3><div class="meta"><span class="tag">${esc(L[o.status]||o.status)}</span><span class="tag">${money(o.totalEstimated,o.currency)}</span>${o.requestedDeliveryAt?`<span class="tag">${esc(dateTime(o.requestedDeliveryAt))}</span>`:''}</div></div></div><p>${esc(o.id)} · ${o.items.length} article(s)<br>Créée par ${esc(o.createdByName||'—')}</p><div class="actions">${o.status==='DRAFT'&&CTX.capabilities.createPurchases?`<button class="btn" data-action="SUBMIT" data-id="${o.id}">Validation</button>`:''}${['DRAFT','PENDING_APPROVAL'].includes(o.status)&&CTX.capabilities.approvePurchases?`<button class="btn good" data-action="APPROVE" data-id="${o.id}">Approuver</button>`:''}${o.status==='APPROVED'&&CTX.capabilities.approvePurchases?`<button class="btn primary" data-action="SEND" data-id="${o.id}">Marquer envoyée</button>`:''}${['APPROVED','SENT','PARTIAL'].includes(o.status)&&CTX.capabilities.createPurchases?`<button class="btn good" data-receive="${o.id}">Réception</button>`:''}${!['RECEIVED','CANCELLED'].includes(o.status)?`<button class="btn danger" data-action="CANCEL" data-id="${o.id}">Annuler</button>`:''}</div><details><summary>Articles</summary><div class="small-list">${o.items.map(i=>`<div class="small-row">${esc(i.name)} · ${i.quantity} ${esc(i.unit)} · ${money(i.unitPrice,o.currency)} / u${Number(i.receivedQuantity||0)?` · reçu ${i.receivedQuantity}`:''}</div>`).join('')}</div></details></article>`).join(''):'<div class="empty">Aucune commande.</div>'}
function syncCurrency(){const s=SUPPLIERS.find(x=>x.id===oSupplier.value);if(s)oCurrency.value=s.defaultCurrency||'CHF'}
function normalizeSupplierName(v=''){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ')}
function applyOrderPrefill(){const q=new URLSearchParams(location.search);const id=q.get('supplier')||'',name=q.get('supplierName')||'';if(id&&SUPPLIERS.some(s=>s.id===id))oSupplier.value=id;else if(name){const w=normalizeSupplierName(name),m=SUPPLIERS.find(s=>normalizeSupplierName(s.name)===w);if(m)oSupplier.value=m.id;else notice(`Fournisseur « ${name} » non enregistré dans Achats.`,'error')}syncCurrency();if(q.get('new')==='1'&&CTX?.capabilities?.createPurchases){itemRows.innerHTML='';addOrderItemRow({name:q.get('product')||'',quantity:q.get('quantity')||'',unit:q.get('unit')||'unité',unitPrice:q.get('unitPrice')||'',inventoryItemId:q.get('inventoryItemId')||''});oNotes.value=q.get('source')==='ECONOMAT'?'Créée depuis l’Économat':'';orderModal.classList.add('open')}}
async function load(){const[a,b]=await Promise.all([api('/api/ops/purchase-orders'),api('/api/ops/suppliers')]);ORDERS=a.orders||[];SUPPLIERS=(b.suppliers||[]).filter(s=>s.active);oSupplier.innerHTML=SUPPLIERS.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');applyOrderPrefill();render()}
async function init(){wireNav();if(noSession())return showAuthWall();try{CTX=await api('/api/ops/context');if(!CTX.capabilities.viewPurchases)return showAuthWall('Votre rôle ne permet pas l’accès aux commandes fournisseurs.');who.textContent=`${CTX.self.name} · ${CTX.self.role||'Staff'}`;if(CTX.capabilities.createPurchases){heroAction.innerHTML='<button class="btn primary" id="newOrder">＋ Nouvelle commande</button>';newOrder.onclick=()=>{orderModal.classList.add('open');if(!itemRows.children.length)addOrderItemRow()}}await load()}catch(e){showAuthWall(e.message)}}
async function createOrder(){const items=[...document.querySelectorAll('#itemRows .small-row')].map(r=>{const g=k=>r.querySelector(`[data-i="${k}"]`).value;return{name:g('name'),quantity:Number(g('quantity')),unit:g('unit'),unitPrice:Number(g('unitPrice')||0),inventoryItemId:String(r.dataset.inventoryItemId||'')}}).filter(i=>i.name&&i.quantity>0);try{await api('/api/ops/purchase-orders',{method:'POST',body:JSON.stringify({supplierId:oSupplier.value,currency:oCurrency.value,requestedDeliveryAt:oDelivery.value||null,notes:oNotes.value,items,submitForApproval:oSubmit.value==='1',createReceptionTask:oTask.checked})});orderModal.classList.remove('open');notice('Commande créée.');await load()}catch(e){notice(e.message,'error')}}
async function receiveOrder(o){const received={};for(const item of o.items){const v=prompt(`Quantité reçue — ${item.name}\\nCommandé : ${item.quantity} ${item.unit}`,String(item.receivedQuantity||item.quantity));if(v===null)return;received[item.itemId]=Number(v)}await api(`/api/ops/purchase-orders/${encodeURIComponent(o.id)}`,{method:'PUT',body:JSON.stringify({action:'RECEIVE',received})})}
search.oninput=render;statusFilter.onchange=render;oSupplier.onchange=syncCurrency;document.getElementById('addItemBtn').onclick=()=>addOrderItemRow();orderClose.onclick=orderCancel.onclick=()=>orderModal.classList.remove('open');orderSave.onclick=createOrder;orderGrid.addEventListener('click',async e=>{const a=e.target.closest('[data-action]'),r=e.target.closest('[data-receive]');try{if(a){await api(`/api/ops/purchase-orders/${encodeURIComponent(a.dataset.id)}`,{method:'PUT',body:JSON.stringify({action:a.dataset.action})});await load()}else if(r){const o=ORDERS.find(x=>x.id===r.dataset.receive);if(o){await receiveOrder(o);await load()}}}catch(err){notice(err.message,'error')}});init();
</script></body></html>
