<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFFFFF">
    <title>iCHEF OS - Pad Serveur sécurisé</title>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           1. THÈME GLOBAL (BLANC STRICT / TEXTE NOIR / POLICES GÉANTES)
           ========================================================= */
        :root { --bg: #FFFFFF; --panel: #F4F4F6; --border: rgba(0,0,0,0.15); --border-strong: rgba(0,0,0,0.3); --text-main: #000000; --text-muted: #555555; --gold: #000000; --alert: #D9534F; }
        html, body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        
        * { font-size: 60px; line-height: 1.2; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; font-weight: 900; }
        
        /* =========================================================
           2. BARRES DE MENUS ET HEADER
           ========================================================= */
        header, .pad-fiscal-banner, #service-tools-bar, #archi-btn-bar { background-color: #E5E5E5; border-bottom: 4px solid #CCC; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px; min-height: 120px; }
        .header-left { display: flex; align-items: center; gap: 30px; font-weight: 900; }
        
        .dock-btn, .folder-btn, .btn-mini, .room-tab { min-height: 120px; padding: 20px 40px; border: 6px solid #000; border-radius: 20px; background: #FFF; color: #000; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 20px; text-align: center; }
        .dock-icon { font-size: 80px; }
        .dock-btn:active, .btn-mini:active { transform: scale(0.95); background: #E0E0E0; }
        
        #service-tools-bar { display: flex; gap: 20px; padding: 20px; overflow-x: auto; }
        #btn-rush-toggle { display: none !important; } /* Inutile avec l'entonnoir */
        #room-tabs-container { display: none; } /* Affiché uniquement en mode Archi */

        /* =========================================================
           3. PAVÉ NUMÉRIQUE GÉANT (PIN CODE)
           ========================================================= */
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #FFF; z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #login-screen h1 { font-size: 100px; margin-bottom: 20px; color: #000; }
        .pin-display { font-size: 100px; letter-spacing: 40px; margin-bottom: 50px; color: #000; }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 250px); gap: 40px; }
        .pin-btn { width: 250px; height: 250px; font-size: 80px; font-weight: 900; border: 8px solid #000; border-radius: 50%; background: #FFF; color: #000; cursor: pointer; }
        .pin-btn[onclick*="submitPin"] { background: #000; color: #FFF; }
        .pin-btn[onclick="clearPin()"] { color: #D9534F; border-color: #D9534F; }

        @media (max-width: 1200px) {
            .pin-pad { grid-template-columns: repeat(3, 1fr); width: 90%; max-width: 600px; gap: 20px; }
            .pin-btn { width: 100%; height: auto; aspect-ratio: 1/1; font-size: 60px; border-width: 6px; }
        }

        /* =========================================================
           4. MOTEUR ENTONNOIR (DRILL-DOWN) - MODE SERVICE
           ========================================================= */
        .dd-wrapper { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 40px; box-sizing: border-box; background: #FFF; overflow-y: auto; }
        .dd-header { display: flex; align-items: center; gap: 40px; border-bottom: 8px solid #000; padding-bottom: 30px; margin-bottom: 40px; flex-shrink: 0; }
        .dd-header-actions { display: flex; gap: 20px; }
        .dd-title { font-size: 70px; font-weight: 900; text-transform: uppercase; color: #000; }
        
        /* Boutons de Navigation */
        .dd-back { background: #000; color: #FFF; font-size: 50px; font-weight: 900; padding: 20px 50px; border: none; border-radius: 20px; cursor: pointer; }
        .dd-back:active { transform: scale(0.95); background: #333; }
        .dd-home { background: #555; color: #FFF; font-size: 50px; font-weight: 900; padding: 20px 50px; border: none; border-radius: 20px; cursor: pointer; }
        .dd-home:active { transform: scale(0.95); background: #444; }

        .dd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 40px; }
        
        .dd-card { min-height: 350px; border: 10px solid #000; border-radius: 30px; background: #F4F4F6; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; padding: 30px; text-align: center; }
        .dd-card:active { transform: scale(0.96); background: #E0E0E0; }
        .dd-name { font-size: 70px; font-weight: 900; color: #000; }
        .dd-status { font-size: 50px; font-weight: 900; margin-top: 20px; color: #555; text-transform: uppercase; }
        .dd-chrono { font-size: 60px; font-weight: 900; margin-top: 20px; }
        
        /* Couleurs des statuts */
        .dd-card.active { border-color: #3498db; } .dd-card.active .dd-status { color: #3498db; }
        .dd-card.late { border-color: #e056fd; } .dd-card.late .dd-status { color: #e056fd; }
        .dd-card.warning { border-color: #9b59b6; } .dd-card.warning .dd-status { color: #9b59b6; }
        .dd-card.ready { border-color: #10b981; } .dd-card.ready .dd-status { color: #10b981; }
        .dd-card.reserved { border-color: #ff69b4; } .dd-card.reserved .dd-status { color: #ff69b4; }
        .dd-card.alert { border-color: #D9534F; background: rgba(217,83,79,0.1); } .dd-card.alert .dd-status { color: #D9534F; }

        /* =========================================================
           5. MODE ARCHITECTURE (L'ANCIEN PLAN DESSINABLE)
           ========================================================= */
        .floor-plan { position: relative; width: 3000px; height: 2000px; background: #FFF; transition: 0.3s; }
        .zone-wrapper { position: absolute; border: 8px solid #000; border-radius: 20px; background: transparent; }
        .zone-obj { width: 100%; height: 100%; background: rgba(240,240,240,0.5); display: flex; align-items: flex-start; justify-content: center; }
        .zone-badge { position: absolute; top: -40px; left: 20px; font-size: 50px; font-weight: 900; background: #FFF; border: 6px solid #000; padding: 10px 20px; color: #000;}
        .table-wrapper { position: absolute; touch-action: none; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .table-obj { width: 100%; height: 100%; border: 8px solid #000; border-radius: 20px; background: #F4F4F6; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 900; cursor: pointer; color: #000;}
        .chair { display: none; } /* On cache les chaises */
        .zone-resizer, .table-resizer { position: absolute; bottom: -15px; right: -15px; width: 40px; height: 40px; background: #000; border-radius: 50%; display: none; cursor: se-resize; }
        body.edit-mode .zone-resizer, body.edit-mode .table-resizer { display: block; }
        body.edit-mode .table-obj { border-style: dashed; }

        /* =========================================================
           6. TIROIR DE COMMANDE & MENUS (INTERFACE PRISE DE COMMANDE)
           ========================================================= */
        .drawer { position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: #FFF; z-index: 10000; display: none; flex-direction: column; }
        .drawer.open { display: flex; }
        .drawer-body { display: flex; flex: 1; overflow: hidden; height: 100%; }
        .menu-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 40px; overflow-y: auto; align-content: start; }
        .btn-item { position: relative; background: #F4F4F6; border: 6px solid #000; color: #000; padding: 30px; border-radius: 20px; font-weight: 900; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; text-align: center; cursor: pointer; }
        .btn-item .price { font-size: 60px; color: #000; }
        .ticket-view { flex: 0 0 40%; background: #F4F4F6; border-left: 8px solid #000; padding: 40px; display: flex; flex-direction: column; overflow-y: auto;}
        .ticket-item-row { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 4px solid #CCC; }
        .ticket-total { font-size: 80px; font-weight: 900; margin-top: 30px; border-top: 8px solid #000; padding-top: 30px; text-align: right; color: #000;}
        .pay-btn { background: #FFF; border: 8px solid #000; color: #000; padding: 30px; border-radius: 20px; font-weight: 900; width: 100%; margin-top: 20px; cursor: pointer; text-transform: uppercase; }
        .pay-btn:active { background: #E0E0E0; transform: scale(0.98); }
        .pay-btn.cancel { border-color: #D9534F; color: #D9534F; }
        
        .item-delete-btn, .item-error-btn { background: #D9534F; color: #FFF; border: none; padding: 20px; font-weight: 900; cursor: pointer; border-radius: 12px; }

        /* =========================================================
           7. MODALES (PAIEMENT, ERREURS, ARCHI)
           ========================================================= */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.95); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal > div { background: #F4F4F6; padding: 60px; border-radius: 30px; border: 10px solid #000; max-width: 90%; max-height: 90vh; overflow-y: auto;}
        .edit-input, select { font-size: 50px; padding: 20px; border: 4px solid #000; border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 20px; }
        
        .global-rush-alert { display: none; background: rgba(217,83,79,0.2); color: #D9534F; text-align: center; padding: 20px; font-weight: 900; text-transform: uppercase; border-bottom: 6px solid #D9534F; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <!-- ECRAN DE CONNEXION -->
    <div id="login-screen">
        <h1>SALLE</h1>
        <div style="font-size: 50px; font-weight: 900; margin-bottom: 50px;">Code d'accès</div>
        <div id="pin-display" class="pin-display"></div>
        <div id="error-msg" style="display:none; color:#D9534F; font-size:40px; margin-bottom:20px;"></div>
        <div class="pin-pad">
            <button class="pin-btn" onclick="appendPin(1)">1</button><button class="pin-btn" onclick="appendPin(2)">2</button><button class="pin-btn" onclick="appendPin(3)">3</button>
            <button class="pin-btn" onclick="appendPin(4)">4</button><button class="pin-btn" onclick="appendPin(5)">5</button><button class="pin-btn" onclick="appendPin(6)">6</button>
            <button class="pin-btn" onclick="appendPin(7)">7</button><button class="pin-btn" onclick="appendPin(8)">8</button><button class="pin-btn" onclick="appendPin(9)">9</button>
            <button class="pin-btn" onclick="clearPin()">C</button>
            <button class="pin-btn" onclick="appendPin(0)">0</button>
            <button class="pin-btn" onclick="submitPin()">OK</button>
        </div>
    </div>

    <!-- ALERTE GLOBALE -->
    <div id="global-rush-alert" class="global-rush-alert">
        🔥 CUISINE CRITIQUE - SUSPENDEZ L'ENVOI DES PLATS CHAUDS
    </div>

    <!-- EN-TÊTE PRINCIPAL -->
    <header>
        <div class="header-left">
            <div>PAD SERVEUR</div>
            <div id="user-badge" style="color:#555;">Utilisateur: Aucun</div>
            <div id="empire-clock">00:00</div>
        </div>
    </header>

    <!-- BARRE D'OUTILS -->
    <div id="service-tools-bar">
        <div id="room-tabs-container" style="display:none; gap:20px;"></div>
        <button class="dock-btn" onclick="openQuickOrder()">📝 COMMANDE</button>
        <button class="dock-btn" onclick="addExtraClient()">👥 CLIENT +</button>
        <button class="dock-btn" onclick="addExtraTable()">➕ TABLE +</button>
        <button class="dock-btn" onclick="window.location.href='anti-rush.html?tenantID=' + appTenantID">🤖 ANTI-RUSH</button>
        <button class="dock-btn" onclick="logout()">🔒 QUITTER</button>
        <button class="dock-btn admin" style="display:none;" onclick="unlockArchiMode()">🏗️ ARCHITECTURE</button>
    </div>

    <!-- ZONE PRINCIPALE (PLAN OU ENTONNOIR) -->
    <div class="floor-plan-wrapper" id="main-wrapper">
        <div id="floor-plan"></div>
    </div>

    <!-- TIROIR DE COMMANDE -->
    <div id="order-drawer" class="drawer">
        <div class="drawer-body">
            <div style="flex:1; display:flex; flex-direction:column; border-right: 8px solid #000;">
                <div id="dynamic-categories-container" style="padding:20px; display:flex; gap:20px; overflow-x:auto; border-bottom:8px solid #000;"></div>
                <div id="seat-bar-container" style="padding:20px; display:flex; gap:20px; border-bottom:4px solid #CCC;"></div>
                <div id="menu-grid" class="menu-grid"></div>
            </div>
            <div class="ticket-view">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:8px solid #000; padding-bottom:20px; margin-bottom:20px;">
                    <h2 id="ticket-table-name" style="margin:0; font-size:60px;">TABLE --</h2>
                    <button class="pay-btn" style="width:auto; margin:0;" onclick="closeOrder()">✕ FERMER</button>
                </div>
                <div id="ticket-list" style="flex:1; overflow-y:auto;"></div>
                <div>
                    <div id="ticket-total-price" class="ticket-total">0.00 €</div>
                    <button id="btn-send-kds" class="pay-btn" style="background:#000; color:#FFF;" onclick="processOrderDispatch()">👨‍🍳 ENVOYER CUISINE</button>
                    <button class="pay-btn" onclick="openPaymentModal()">🧾 ENCAISSER</button>
                    <div style="display:flex; gap:20px;">
                        <button class="pay-btn" style="flex:1;" onclick="executeSaveTableState()">💾 ATTENTE</button>
                        <button class="pay-btn cancel" style="flex:1;" onclick="closeOrder()">🗑️ ANNULER</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PAIEMENT -->
    <div id="payment-modal" class="modal">
        <div style="width: 800px;">
            <h2 id="pay-modal-title" style="font-size:70px; text-align:center; border-bottom:8px solid #000; padding-bottom:30px;">TABLE X</h2>
            <div style="display:flex; justify-content:space-between; font-size:60px; font-weight:900; margin:40px 0;">
                <span>Total:</span> <span id="pay-modal-total">0.00 €</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:80px; font-weight:900; margin:40px 0; color:#000;">
                <span>Reste:</span> <span id="pay-remaining">0.00 €</span>
            </div>
            <input type="number" id="pay-amount-input" class="edit-input" placeholder="Montant">
            <div class="pay-methods" style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <button class="pay-btn" onclick="processPartialPayment('CB')">💳 CB</button>
                <button class="pay-btn" onclick="processPartialPayment('ESPÈCES')">💶 ESPÈCES</button>
            </div>
            <button id="btn-close-table" class="pay-btn" style="display:none; background:#10b981; color:#000;" onclick="finalizeTablePayment()">✅ CLÔTURER LA TABLE</button>
            <button class="pay-btn cancel" onclick="closePaymentModal()">❌ FERMER</button>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL DU PAD -->
    <script>
        // --- VARIABLES GLOBALES ---
        const appUrlParams = new URLSearchParams(window.location.search);
        let appTenantID = appUrlParams.get('tenantID') || localStorage.getItem('ichef_tenant_id');
        const APP_SERVER_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:10000" : "https://tableau-system.onrender.com";
        
        let activeOrders = {}; 
        let currentTableId = null; 
        let currentTicket = []; 
        let isArchiMode = false;
        let isDraggingTable = false; 
        let currentSeat = 0; 
        let currentCategory = 'MenuJour'; 
        let currentCourseDefault = 2;
        let unifiedMenu = {};
        let unifiedCategories = [];
        let rooms = ['Salle Principale'];
        let tables = [];
        let zones = [];
        let currentUser = null;
        let currentPin = "";
        let loginInProgress = false;
        let currentTableTotal = 0;
        let currentPayRemaining = 0;
        let paymentsDone = [];
        let isKitchenInRush = false;

        // --- AUTHENTIFICATION ---
        function appendPin(n) { if (currentPin.length < 12) { currentPin += n; document.getElementById('pin-display').innerText = '•'.repeat(currentPin.length); } }
        function clearPin() { currentPin = ''; document.getElementById('pin-display').innerText = ''; }
        
        async function submitPin() {
            if (loginInProgress || !currentPin) return;
            loginInProgress = true;
            try {
                const response = await fetch(`${APP_SERVER_URL}/api/verify-pin`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenantID: appTenantID, pin: currentPin })
                });
                const data = await response.json().catch(() => ({}));
                if (data.success) {
                    currentUser = { name: data.role === 'master' ? 'Directeur' : 'Serveur', role: (data.role === 'master' || data.role === 'manager') ? 'Manager' : 'Serveur' };
                    document.getElementById('user-badge').innerText = `Badge: ${currentUser.name}`;
                    document.getElementById('login-screen').style.display = 'none';
                    document.querySelectorAll('.admin').forEach(e => e.style.display = currentUser.role === 'Manager' ? 'flex' : 'none');
                    connectEmpireH24();
                } else {
                    alert('Code PIN incorrect');
                }
            } catch (e) { alert('Erreur serveur'); }
            clearPin();
            loginInProgress = false;
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-screen').style.display = 'flex';
            closeOrder();
        }

        // --- SYNCHRONISATION ---
        function connectEmpireH24() {
            setInterval(() => { document.getElementById('empire-clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}); }, 1000);
            syncData();
            setInterval(syncData, 3000);
        }

        async function syncData() {
            if (isArchiMode) return; 
            try {
                const response = await fetch(`${APP_SERVER_URL}/get-current-state?tenantID=${appTenantID}`);
                const state = await response.json();
                if (state && state.activeOrders) {
                    let nO = state.activeOrders;
                    
                    if (nO['ARCHITECTURE']) {
                        let archi = nO['ARCHITECTURE'].data || nO['ARCHITECTURE'];
                        if (archi.rooms) rooms = archi.rooms;
                        if (archi.tables) tables = archi.tables;
                        if (archi.zones) zones = archi.zones;
                    }

                    // Fusion du menu
                    let catC = nO['CATEGORIES_CUISINE']?.data || [];
                    let catB = nO['CATEGORIES_BAR']?.data || [];
                    unifiedCategories = [...catC, ...catB];
                    unifiedMenu = { ...(nO['MENU_MASTER']?.data || {}), ...(nO['MENU_MASTER_BAR']?.data || {}) };

                    activeOrders = nO;
                }
            } catch(e) {}
        }

        // --- MOTEUR DE NAVIGATION EN ENTONNOIR (DRILL-DOWN) ET ARCHI ---
        let ddLevel = 'ROOMS';
        let ddRoom = null;
        let ddZone = null;

        function renderFloor() {
            let wrapper = document.getElementById('main-wrapper');
            let floor = document.getElementById('floor-plan');
            if (!floor) return;

            // SI ARCHITECTURE : Affichage X/Y
            if (isArchiMode || isDraggingTable) {
                document.getElementById('room-tabs-container').style.display = 'flex';
                floor.className = 'floor-plan';
                floor.innerHTML = '';
                
                // Dessin des zones
                zones.filter(z => z.room === currentRoom).forEach(z => {
                    let zw = document.createElement('div'); wrapper.className = 'zone-wrapper';
                    zw.style.left = (z.l||0)+'px'; zw.style.top = (z.t||0)+'px'; zw.style.width = (z.w||400)+'px'; zw.style.height = (z.h||300)+'px';
                    zw.innerHTML = `<div class="zone-obj"><span class="zone-badge">${z.label}</span></div>`;
                    floor.appendChild(zw);
                });

                // Dessin des tables
                tables.filter(t => t.room === currentRoom).forEach(t => {
                    let tw = document.createElement('div'); tw.className = 'table-wrapper';
                    tw.style.left = (t.l||0)+'px'; tw.style.top = (t.t||0)+'px'; tw.style.width = (t.w||80)+'px'; tw.style.height = (t.h||120)+'px';
                    tw.innerHTML = `<div class="table-obj">TABLE<br>${t.label}</div>`;
                    floor.appendChild(tw);
                });
                return;
            }

            // --- MODE SERVICE : ENTONNOIR ---
            document.getElementById('room-tabs-container').style.display = 'none';
            floor.className = 'dd-wrapper';
            floor.innerHTML = '';

            let header = document.createElement('div'); header.className = 'dd-header';
            let grid = document.createElement('div'); grid.className = 'dd-grid';

            if (ddLevel === 'ROOMS') {
                header.innerHTML = `<div class="dd-title">🏢 CHOIX DE LA SALLE</div>`;
                rooms.forEach(r => {
                    let btn = document.createElement('div'); btn.className = 'dd-card';
                    btn.innerHTML = `<div class="dd-name">🚪 ${r}</div>`;
                    btn.onclick = () => { ddLevel = 'ZONES'; ddRoom = r; currentRoom = r; renderFloor(); };
                    grid.appendChild(btn);
                });
            } 
            else if (ddLevel === 'ZONES') {
                header.innerHTML = `
                    <div class="dd-header-actions">
                        <button class="dd-back" onclick="ddLevel='ROOMS'; renderFloor();">🔙 RETOUR</button>
                    </div>
                    <div class="dd-title">SALLE : ${ddRoom}</div>
                `;
                zones.filter(z => z.room === ddRoom).forEach(z => {
                    let btn = document.createElement('div'); btn.className = 'dd-card';
                    btn.style.borderColor = z.color || '#000';
                    btn.innerHTML = `<div class="dd-name" style="color:${z.color||'#000'}">🔲 ${z.label}</div>`;
                    btn.onclick = () => { ddLevel = 'TABLES'; ddZone = z.id; renderFloor(); };
                    grid.appendChild(btn);
                });
                let btnHz = document.createElement('div'); btnHz.className = 'dd-card'; btnHz.style.borderColor = '#888';
                btnHz.innerHTML = `<div class="dd-name" style="color:#888;">🍽️ AUTRES TABLES</div>`;
                btnHz.onclick = () => { ddLevel = 'TABLES'; ddZone = 'HORS_ZONE'; renderFloor(); };
                grid.appendChild(btnHz);
            }
            else if (ddLevel === 'TABLES') {
                let zObj = zones.find(z => z.id === ddZone);
                header.innerHTML = `
                    <div class="dd-header-actions">
                        <button class="dd-back" onclick="ddLevel='ZONES'; renderFloor();">🔙 RETOUR</button>
                        <button class="dd-home" onclick="ddLevel='ROOMS'; renderFloor();">🏠 DÉBUT</button>
                    </div>
                    <div class="dd-title">${zObj ? zObj.label : 'AUTRES TABLES'}</div>
                `;
                
                let tTables = tables.filter(t => {
                    if (t.room !== ddRoom) return false;
                    let cY = (t.t || 0) + ((t.h || 120)/2), cX = (t.l || 0) + ((t.w || 80)/2);
                    let inZ = zones.find(z => z.room === ddRoom && cX >= (z.l||0) && cX <= (z.l||0)+(z.w||400) && cY >= (z.t||0) && cY <= (z.t||0)+(z.h||300));
                    return ddZone === 'HORS_ZONE' ? !inZ : (inZ && inZ.id === ddZone);
                });

                tTables.forEach(t => {
                    let orderKey = Object.keys(activeOrders).find(k => k.toLowerCase() === t.label.toLowerCase());
                    let oData = orderKey ? activeOrders[orderKey] : null;
                    let btn = document.createElement('div'); btn.className = 'dd-card';
                    let sText = '<div class="dd-status">LIBRE</div>', cText = '';

                    if (oData && oData.alerteRouge) {
                        btn.classList.add('alert'); sText = '<div class="dd-status" style="color:#D9534F;">⚠️ ALERTE</div>';
                    } else if (oData && oData.items && oData.items.length > 0) {
                        let maxDelay = 0, isReady = oData.status === 'PRÊT' || oData.items.every(i => i.done);
                        oData.items.forEach(i => {
                            if (i.isSent && !i.served && i.itemId) {
                                let d = (Date.now() - parseInt(i.itemId)) / 60000;
                                if (d > maxDelay) maxDelay = d;
                            }
                        });
                        if (isReady) { btn.classList.add('ready'); sText = '<div class="dd-status" style="color:#10b981;">✅ PRÊT</div>'; }
                        else if (maxDelay >= 25) { btn.classList.add('late'); sText = '<div class="dd-status">OCCUPÉE</div>'; cText = `<div class="dd-chrono" style="color:#e056fd;">⏱ ${Math.floor(maxDelay)} min</div>`; }
                        else if (maxDelay >= 15) { btn.classList.add('warning'); sText = '<div class="dd-status">OCCUPÉE</div>'; cText = `<div class="dd-chrono" style="color:#9b59b6;">⏱ ${Math.floor(maxDelay)} min</div>`; }
                        else if (maxDelay >= 1) { btn.classList.add('active'); sText = '<div class="dd-status">OCCUPÉE</div>'; cText = `<div class="dd-chrono" style="color:#3498db;">⏱ ${Math.floor(maxDelay)} min</div>`; }
                        else { btn.classList.add('active'); sText = '<div class="dd-status">OCCUPÉE</div>'; }
                    } else if (oData && oData.status === 'reserved') {
                        btn.classList.add('reserved');
                        sText = `<div class="dd-status">RÉSERVÉE</div>`;
                    }

                    btn.innerHTML = `<div class="dd-name">TABLE ${t.label}</div>${sText}${cText}`;
                    btn.onclick = () => openOrder(orderKey || t.label);
                    grid.appendChild(btn);
                });
                if (tTables.length === 0) grid.innerHTML = `<div style="font-size:50px; color:#888;">Aucune table configurée ici.</div>`;
            }

            floor.appendChild(header);
            floor.appendChild(grid);
        }

        // Rafraîchissement automatique pour le chrono
        setInterval(() => { if (!isArchiMode) renderFloor(); }, 2000);

        // --- COMMANDES ET MENUS ---
        function openOrder(tableLabel) {
            currentTableId = tableLabel;
            document.getElementById('ticket-table-name').innerText = "TABLE " + tableLabel;
            
            if (activeOrders[tableLabel] && activeOrders[tableLabel].items) {
                currentTicket = JSON.parse(JSON.stringify(activeOrders[tableLabel].items));
            } else {
                currentTicket = [];
            }
            
            document.getElementById('order-drawer').classList.add('open');
            renderDynamicCategories();
            renderMenu(unifiedCategories[0]?.id || 'MenuJour');
            renderTicket();
        }

        function closeOrder() {
            document.getElementById('order-drawer').classList.remove('open');
            currentTableId = null;
        }

        function renderDynamicCategories() {
            const container = document.getElementById('dynamic-categories-container');
            container.innerHTML = unifiedCategories.map(c => 
                `<button class="btn-mini ${currentCategory === c.id ? 'gold' : ''}" onclick="renderMenu('${c.id}')">${c.label}</button>`
            ).join('');
        }

        function renderMenu(catId) {
            currentCategory = catId;
            renderDynamicCategories();
            let items = unifiedMenu[catId] || [];
            let html = items.map(item => `
                <div class="btn-item" onclick="addToTicket('${item.name.replace(/'/g,"\\'")}', ${item.price})">
                    <span>${item.name}</span>
                    <span class="price">${parseFloat(item.price).toFixed(2)} €</span>
                </div>
            `).join('');
            document.getElementById('menu-grid').innerHTML = html || '<div style="font-size:50px; padding:40px;">Catégorie vide</div>';
        }

        function addToTicket(name, price) {
            let existing = currentTicket.find(i => i.n === name && !i.isSent);
            if(existing) existing.qty = (existing.qty || 1) + 1;
            else currentTicket.push({ id: Date.now(), itemId: Date.now(), n: name, p: price, qty: 1, isSent: false, done: false, served: false });
            renderTicket();
        }

        function renderTicket() {
            let total = 0;
            let html = currentTicket.map((i, idx) => {
                total += (i.p * (i.qty || 1));
                let status = !i.isSent ? '<span style="color:#3498db;">NOUVEAU</span>' : (i.done ? '<span style="color:#10b981;">PRÊT</span>' : '<span style="color:#e056fd;">ATTENTE</span>');
                return `
                <div class="ticket-item-row">
                    <div>
                        <div style="font-size:50px; font-weight:900;">${i.qty||1}x ${i.n}</div>
                        <div style="font-size:40px; margin-top:10px;">${status}</div>
                    </div>
                    <div style="font-size:60px; font-weight:900;">${(i.p * (i.qty || 1)).toFixed(2)} €</div>
                </div>`;
            }).join('');
            
            document.getElementById('ticket-list').innerHTML = html;
            document.getElementById('ticket-total-price').innerText = total.toFixed(2) + ' €';
            currentTableTotal = total;
            document.getElementById('btn-send-kds').style.display = currentTicket.some(i => !i.isSent) ? 'block' : 'none';
        }

        async function processOrderDispatch() {
            currentTicket.forEach(i => {
                if(!i.isSent) { i.isSent = true; i.itemId = Date.now(); }
            });
            renderTicket();
            await executeSaveTableState();
            alert("✅ Commande envoyée en cuisine !");
        }

        async function executeSaveTableState() {
            if(currentTableId) {
                await fetch(`${APP_SERVER_URL}/update-order?tenantID=${appTenantID}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tableId: currentTableId, order: { items: currentTicket, status: 'pending' } })
                });
            }
            closeOrder();
            renderFloor();
        }

        // --- PAIEMENT ---
        function openPaymentModal() {
            if(currentTicket.length === 0) return alert("Table vide.");
            currentPayRemaining = currentTableTotal;
            paymentsDone = [];
            document.getElementById('pay-modal-title').innerText = "TABLE " + currentTableId;
            document.getElementById('pay-modal-total').innerText = currentTableTotal.toFixed(2) + " €";
            document.getElementById('pay-remaining').innerText = currentPayRemaining.toFixed(2) + " €";
            document.getElementById('pay-amount-input').value = currentPayRemaining.toFixed(2);
            document.getElementById('payment-modal').classList.add('open');
            document.querySelector('.pay-methods').style.display = 'grid';
            document.getElementById('btn-close-table').style.display = 'none';
        }
        function closePaymentModal() { document.getElementById('payment-modal').classList.remove('open'); }

        function processPartialPayment(method) {
            let amt = parseFloat(document.getElementById('pay-amount-input').value);
            if(isNaN(amt) || amt <= 0) return;
            paymentsDone.push({ method, amount: amt });
            currentPayRemaining -= amt;
            if(currentPayRemaining <= 0) {
                currentPayRemaining = 0;
                document.querySelector('.pay-methods').style.display = 'none';
                document.getElementById('btn-close-table').style.display = 'block';
            }
            document.getElementById('pay-remaining').innerText = currentPayRemaining.toFixed(2) + " €";
            document.getElementById('pay-amount-input').value = currentPayRemaining.toFixed(2);
        }

        async function finalizeTablePayment() {
            await fetch(`${APP_SERVER_URL}/update-order?tenantID=${appTenantID}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tableId: currentTableId, order: null }) // Supprime la commande après paiement
            });
            alert("✅ Table clôturée !");
            closePaymentModal();
            closeOrder();
            renderFloor();
        }

        // --- OUTILS ET ARCHI ---
        function openQuickOrder() { openOrder("W" + Math.floor(Math.random() * 1000)); }
        function unlockArchiMode() { isArchiMode = !isArchiMode; document.body.classList.toggle('edit-mode', isArchiMode); renderFloor(); }
        function addExtraTable() { alert("Fonction disponible dans l'administration."); }
        function addExtraClient() { alert("Ajoutez une note de couverts dans la commande."); }

    </script>
</body>
</html>
