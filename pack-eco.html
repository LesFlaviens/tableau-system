<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFFFFF">
    <title>iCHEF OS - Pad Serveur sécurisé</title>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800;900&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           1. THÈME GLOBAL BLANC & POLICES MASSIVES
           ========================================================= */
        :root { --bg: #FFFFFF; --panel: #F4F4F6; --border: #CCCCCC; --text-main: #000000; --gold: #C5A059; --alert: #D9534F; }
        html, body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        * { box-sizing: border-box; }
        
        /* =========================================================
           2. BARRE DE MENU SUPÉRIEURE (EXACTEMENT COMME CAPTURE 1)
           ========================================================= */
        #service-tools-bar { 
            display: flex; align-items: center; justify-content: flex-start; gap: 15px; 
            padding: 20px; background: #E5E5E5; border-bottom: 4px solid #CCC; 
            overflow-x: auto; white-space: nowrap; scrollbar-width: none; flex-shrink: 0;
        }
        #service-tools-bar::-webkit-scrollbar { display: none; }

        .dock-btn, .folder-btn, .room-tab, .btn-mini-alert { 
            min-height: 80px; padding: 15px 30px; border: 4px solid #000; border-radius: 12px; 
            background: #FFF; color: #000; font-size: 28px; font-weight: 900; 
            text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 15px; 
        }
        .dock-btn:active, .folder-btn:active, .room-tab:active { transform: scale(0.95); background: #E0E0E0; }
        .dock-icon { font-size: 40px; }

        /* Couleurs spécifiques demandées dans la capture */
        .room-tab.active { border-color: var(--gold); color: var(--gold); background: rgba(197, 160, 89, 0.1); }
        .btn-mini-alert { border-color: var(--alert); color: var(--alert); background: rgba(217, 83, 79, 0.1); }
        .dock-btn.primary { border-color: var(--gold); color: var(--gold); }
        .dock-btn.rush { border-color: var(--alert); color: var(--alert); }
        .reservation-count-badge { background: var(--gold); color: #000; border-radius: 50%; padding: 5px 15px; font-size: 26px; margin-left: 10px; }
        .service-dock-folders { margin-left: auto; }

        /* =========================================================
           3. MENU OUTILS FLOTTANT (EXACTEMENT COMME CAPTURE 2)
           ========================================================= */
        .quick-folder-panel {
            position: fixed; top: 125px; right: 20px; width: 500px; display: none; flex-direction: column;
            background: #FFF; border: 6px solid #000; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); z-index: 10000; overflow: hidden;
        }
        .quick-folder-panel.open { display: flex; }
        .quick-folder-title { padding: 25px; color: var(--gold); font-size: 26px; font-weight: 900; border-bottom: 4px solid #CCC; text-transform: uppercase; text-align: center; }
        .quick-folder-section-title { padding: 15px 25px; color: var(--gold); font-size: 22px; font-weight: 900; background: #F9F9F9; text-transform: uppercase; border-bottom: 2px solid #EEE;}
        
        .quick-folder-panel button {
            width: 100%; min-height: 80px; display: flex; align-items: center; padding: 20px 25px; border: 0;
            border-bottom: 2px solid #EEE; background: transparent; color: #000; 
            font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 900; text-align: left; cursor: pointer; text-transform: uppercase; gap: 15px;
        }
        .quick-folder-panel button:last-child { border-bottom: 0; }
        .quick-folder-panel button:hover { background: #F0F0F0; }

        /* =========================================================
           4. LE PAVÉ NUMÉRIQUE GÉANT (PIN)
           ========================================================= */
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #FFF; z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #login-screen h1 { font-size: 100px; color: #000; }
        .pin-display { font-size: 100px; letter-spacing: 40px; margin-bottom: 50px; color: #000; }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 250px); gap: 40px; }
        .pin-btn { width: 250px; height: 250px; font-size: 80px; font-weight: 900; border: 8px solid #000; border-radius: 50%; background: #FFF; color: #000; cursor: pointer; }
        .pin-btn[onclick*="submitPin"] { background: #000; color: #FFF; }
        .pin-btn[onclick="clearPin()"] { color: var(--alert); border-color: var(--alert); }

        /* =========================================================
           5. NAVIGATION EN ENTONNOIR (ZÉRO CHEVAUCHEMENT)
           ========================================================= */
        .dd-wrapper { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 40px; background: #FFF; overflow-y: auto; }
        .dd-header { display: flex; align-items: center; gap: 40px; border-bottom: 8px solid #000; padding-bottom: 30px; margin-bottom: 40px; flex-shrink: 0; }
        .dd-header-actions { display: flex; gap: 20px; }
        .dd-title { font-size: 70px; font-weight: 900; color: #000; text-transform: uppercase; }
        
        .dd-back, .dd-home { background: #000; color: #FFF; font-size: 50px; font-weight: 900; padding: 20px 40px; border: none; border-radius: 20px; cursor: pointer; text-transform: uppercase; }
        .dd-back:active, .dd-home:active { transform: scale(0.95); background: #333; }
        .dd-home { background: #555; }

        .dd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 40px; }
        .dd-card { min-height: 350px; border: 10px solid #000; border-radius: 30px; background: #F4F4F6; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; padding: 30px; text-align: center; }
        .dd-card:active { transform: scale(0.96); background: #E0E0E0; }
        
        .dd-name { font-size: 70px; font-weight: 900; color: #000; }
        .dd-status { font-size: 50px; font-weight: 900; margin-top: 20px; color: #555; text-transform: uppercase; }
        .dd-chrono { font-size: 60px; font-weight: 900; margin-top: 20px; }

        /* Couleurs des tables */
        .dd-card.active { border-color: #3498db; } .dd-card.active .dd-status { color: #3498db; }
        .dd-card.late { border-color: #e056fd; } .dd-card.late .dd-status { color: #e056fd; }
        .dd-card.warning { border-color: #9b59b6; } .dd-card.warning .dd-status { color: #9b59b6; }
        .dd-card.ready { border-color: #10b981; } .dd-card.ready .dd-status { color: #10b981; }
        .dd-card.reserved { border-color: #ff69b4; } .dd-card.reserved .dd-status { color: #ff69b4; }
        .dd-card.alert { border-color: var(--alert); background: rgba(217,83,79,0.1); } .dd-card.alert .dd-status { color: var(--alert); }

        /* =========================================================
           6. TIROIR DE COMMANDE
           ========================================================= */
        .drawer { position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: #FFF; z-index: 10000; display: none; flex-direction: column; }
        .drawer.open { display: flex; }
        .drawer-body { display: flex; flex: 1; overflow: hidden; height: 100%; }
        .menu-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 40px; overflow-y: auto; align-content: start; }
        .btn-item { background: #F4F4F6; border: 6px solid #000; padding: 30px; border-radius: 20px; font-weight: 900; display: flex; flex-direction: column; align-items: center; gap: 15px; font-size: 40px; text-align: center; cursor: pointer; color: #000;}
        .btn-item .price { font-size: 50px; color: #000; }
        .ticket-view { flex: 0 0 40%; background: #F4F4F6; border-left: 8px solid #000; padding: 40px; display: flex; flex-direction: column; overflow-y: auto;}
        .ticket-item-row { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 4px solid #CCC; }
        .ticket-total { font-size: 80px; font-weight: 900; margin-top: 30px; border-top: 8px solid #000; padding-top: 30px; text-align: right; color: #000;}
        .pay-btn { background: #FFF; border: 8px solid #000; color: #000; padding: 30px; border-radius: 20px; font-weight: 900; font-size:40px; width: 100%; margin-top: 20px; cursor: pointer; text-transform: uppercase; }
        .pay-btn:active { transform: scale(0.98); background: #E0E0E0; }
        
        /* ANCIEN PLAN ARCHITECTURE CACHÉ PAR DÉFAUT */
        .floor-plan { display: none; position: relative; width: 3000px; height: 2000px; background: #FFF; }
        body.edit-mode .floor-plan { display: block; }
        body.edit-mode .dd-wrapper { display: none; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <!-- SECURITE ET BOOTSTRAP -->
    <script>
        const appTenantID = new URLSearchParams(window.location.search).get('tenantID') || localStorage.getItem('ichef_tenant_id');
        const APP_SERVER_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:10000" : "https://tableau-system.onrender.com";
        window.ICHEF_SECURITY = { deviceId: localStorage.getItem('ichef_device_id') || ('dev_' + Math.random().toString(36).substr(2, 9)) };
        localStorage.setItem('ichef_device_id', window.ICHEF_SECURITY.deviceId);
        
        (async function enforceSecurity() {
            try {
                const res = await fetch(`${APP_SERVER_URL}/api/security/bootstrap`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenantID: appTenantID, deviceId: window.ICHEF_SECURITY.deviceId, page: 'pad' })
                });
                const data = await res.json();
                if (!res.ok || !data.success) { alert('Non autorisé.'); window.location.replace('connexionpartenaire.html'); }
            } catch (e) { console.error('Erreur bootstrap'); }
        })();
    </script>

    <!-- ÉCRAN DE CONNEXION (PIN) -->
    <div id="login-screen">
        <h1 style="font-size: 120px; letter-spacing: 10px;">SALLE</h1>
        <div style="font-size: 50px; font-weight: 900; margin-bottom: 50px; color:#555;">Saisissez votre accès</div>
        <div id="pin-display" class="pin-display"></div>
        <div id="error-msg" style="display:none; color:#D9534F; font-size:50px; font-weight:900; margin-bottom:30px;"></div>
        <div class="pin-pad">
            <button class="pin-btn" onclick="appendPin(1)">1</button><button class="pin-btn" onclick="appendPin(2)">2</button><button class="pin-btn" onclick="appendPin(3)">3</button>
            <button class="pin-btn" onclick="appendPin(4)">4</button><button class="pin-btn" onclick="appendPin(5)">5</button><button class="pin-btn" onclick="appendPin(6)">6</button>
            <button class="pin-btn" onclick="appendPin(7)">7</button><button class="pin-btn" onclick="appendPin(8)">8</button><button class="pin-btn" onclick="appendPin(9)">9</button>
            <button class="pin-btn" onclick="clearPin()">C</button>
            <button class="pin-btn" onclick="appendPin(0)">0</button>
            <button class="pin-btn" onclick="submitPin()">OK</button>
        </div>
    </div>

    <!-- BARRE DU HAUT EXACTE CAPTURE 1 -->
    <div id="service-tools-bar">
        <div class="room-tab active" onclick="goDD('ROOMS')">SALLE PRINCIPALE</div>
        
        <button class="btn-mini-alert">🧠 ANTI-RUSH <span id="rush-level-display">0</span>/5</button>

        <button class="dock-btn primary" onclick="openOrder('W'+Math.floor(Math.random()*1000))"><span class="dock-icon">📝</span> COMMANDE</button>
        <button class="dock-btn" onclick="alert('Ajoutez le nb de couverts dans le ticket.')"><span class="dock-icon">👥</span> CLIENT +</button>
        <button class="dock-btn" onclick="alert('Passez en mode Archi pour créer une table.')"><span class="dock-icon">➕</span> TABLE +</button>
        <button class="dock-btn rush" onclick="goDD('ROOMS')"><span class="dock-icon">⚡</span> VUE RUSH</button>
        <button class="dock-btn" onclick="window.location.href='anti-rush.html?tenantID=' + appTenantID"><span class="dock-icon">🤖</span> ANTI-RUSH</button>
        <button class="dock-btn" onclick="alert('Module de Réservation')"><span class="dock-icon">📅</span> RÉSA <span class="reservation-count-badge">0</span></button>

        <div class="service-dock-folders">
            <button class="folder-btn" onclick="toggleOutilsMenu(event)">☰ OUTILS <span class="folder-caret">▾</span></button>
        </div>
    </div>

    <!-- MENU OUTILS EXACT CAPTURE 2 -->
    <div id="folder-outils" class="quick-folder-panel">
        <div class="quick-folder-title">OUTILS COMPLETS iCHEF</div>
        <div class="quick-folder-section-title">SERVICE</div>
        <button onclick="toggleFullscreen()"><span style="font-size:35px;">⛶</span> KIOSQUE / PLEIN ÉCRAN</button>
        <button onclick="alert('Historique Financier')"><span style="font-size:35px;">📜</span> HISTORIQUE</button>
        <button onclick="alert('Dashboard Direction')"><span style="font-size:35px;">👁️</span> DASHBOARD</button>
        <button onclick="toggleArchiMode()"><span style="font-size:35px;">🏗️</span> ARCHITECTURE</button>
        <button style="color:var(--alert)" onclick="toggleArchiMode()"><span style="font-size:35px;">❌</span> QUITTER ARCHITECTURE</button>
        <button onclick="alert('Réglages Fiscaux')"><span style="font-size:35px;">▦</span> MODULES FICAL</button>
        <button style="color:var(--gold)" onclick="logout()"><span style="font-size:35px;">🔒</span> QUITTER</button>
        <button style="color:#a855f7" onclick="window.location.href='administration.html?tenantID=' + appTenantID"><span style="font-size:35px;">🔙</span> RETOUR ADMINISTRATION</button>
    </div>

    <!-- ZONE PRINCIPALE (ENTONNOIR) -->
    <div class="floor-plan-wrapper" id="main-wrapper">
        <!-- L'entonnoir sera généré ici -->
        <div id="floor-plan" class="floor-plan"></div> <!-- Vieux plan caché -->
    </div>

    <!-- TIROIR DE COMMANDE -->
    <div id="order-drawer" class="drawer">
        <div class="drawer-body">
            <div style="flex:1; display:flex; flex-direction:column; border-right: 8px solid #000;">
                <div id="dynamic-categories-container" style="padding:20px; display:flex; gap:20px; overflow-x:auto; border-bottom:8px solid #000;"></div>
                <div id="menu-grid" class="menu-grid"></div>
            </div>
            <div class="ticket-view">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:8px solid #000; padding-bottom:20px; margin-bottom:20px;">
                    <h2 id="ticket-table-name" style="margin:0; font-size:60px;">TABLE --</h2>
                    <button class="pay-btn" style="width:auto; margin:0;" onclick="closeOrder()">✕ FERMER</button>
                </div>
                <div id="ticket-list" style="flex:1; overflow-y:auto;"></div>
                <div>
                    <div id="ticket-total-price" class="ticket-total">0.00 €</div>
                    <button id="btn-send-kds" class="pay-btn" style="background:#000; color:#FFF;" onclick="processOrderDispatch()">👨‍🍳 ENVOYER CUISINE</button>
                    <button class="pay-btn" onclick="alert('Système d\'encaissement')">🧾 ENCAISSER</button>
                    <div style="display:flex; gap:20px;">
                        <button class="pay-btn" style="flex:1;" onclick="executeSaveTableState()">💾 ATTENTE</button>
                        <button class="pay-btn cancel" style="flex:1;" onclick="closeOrder()">🗑️ ANNULER</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeOrders = {}; let currentTableId = null; let currentTicket = []; 
        let isArchiMode = false; let unifiedMenu = {}; let unifiedCategories = [];
        let rooms = ['Salle Principale']; let tables = []; let zones = [];
        let currentPin = ""; let loginInProgress = false;
        
        // --- NAVIGATION ENTONNOIR ---
        window.ddLevel = 'ROOMS';
        window.ddRoom = null;
        window.ddZone = null;

        function goDD(level, param) {
            window.ddLevel = level;
            if (level === 'ROOMS') { window.ddRoom = null; window.ddZone = null; }
            if (level === 'ZONES') { window.ddRoom = param; window.ddZone = null; }
            if (level === 'TABLES') { window.ddZone = param; }
            renderDrillDown();
        }

        // --- AUTHENTIFICATION ---
        function appendPin(n) { if (currentPin.length < 12) { currentPin += n; document.getElementById('pin-display').innerText = '•'.repeat(currentPin.length); } }
        function clearPin() { currentPin = ''; document.getElementById('pin-display').innerText = ''; document.getElementById('error-msg').style.display = 'none'; }
        
        async function submitPin() {
            if (loginInProgress || !currentPin) return;
            loginInProgress = true;
            try {
                const response = await fetch(`${APP_SERVER_URL}/api/verify-pin`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenantID: appTenantID, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('login-screen').style.display = 'none';
                    syncData(); setInterval(syncData, 3000);
                } else {
                    document.getElementById('error-msg').innerText = '❌ Code PIN incorrect';
                    document.getElementById('error-msg').style.display = 'block';
                    clearPin();
                }
            } catch (e) { 
                document.getElementById('error-msg').innerText = '❌ Erreur Serveur';
                document.getElementById('error-msg').style.display = 'block';
                clearPin();
            }
            loginInProgress = false;
        }

        function logout() { document.getElementById('login-screen').style.display = 'flex'; closeOrder(); clearPin(); closeOutilsMenu(); }

        // --- SYNCHRONISATION SERVEUR ---
        async function syncData() {
            if (isArchiMode) return; 
            try {
                const res = await fetch(`${APP_SERVER_URL}/get-current-state?tenantID=${appTenantID}`);
                const state = await res.json();
                if (state && state.activeOrders) {
                    let nO = state.activeOrders;
                    if (nO['ARCHITECTURE']) {
                        let archi = nO['ARCHITECTURE'].data || nO['ARCHITECTURE'];
                        if (archi.rooms) rooms = archi.rooms;
                        if (archi.tables) tables = archi.tables;
                        if (archi.zones) zones = archi.zones;
                    }
                    if (nO['SETTINGS_MASTER'] && nO['SETTINGS_MASTER'].data) {
                        document.getElementById('rush-level-display').innerText = nO['SETTINGS_MASTER'].data.rushLevel || 0;
                    }
                    unifiedCategories = [...(nO['CATEGORIES_CUISINE']?.data || []), ...(nO['CATEGORIES_BAR']?.data || [])];
                    unifiedMenu = { ...(nO['MENU_MASTER']?.data || {}), ...(nO['MENU_MASTER_BAR']?.data || {}) };
                    activeOrders = nO;
                    renderDrillDown();
                }
            } catch(e) {}
        }

        // --- MOTEUR ENTONNOIR (RENDU VISUEL) ---
        function renderDrillDown() {
            if (isArchiMode) return; // Si Archi, l'entonnoir s'arrête
            
            let wrapper = document.getElementById('main-wrapper');
            let ddUI = document.getElementById('dd-ui-engine');
            if (!ddUI) {
                ddUI = document.createElement('div');
                ddUI.id = 'dd-ui-engine';
                ddUI.className = 'dd-wrapper';
                wrapper.appendChild(ddUI);
            }
            
            let html = '';

            // ÉCRAN 1 : SALLES
            if (window.ddLevel === 'ROOMS') {
                html += `<div class="dd-header"><div class="dd-title">🏢 RESTAURANT > SALLES</div></div><div class="dd-grid">`;
                rooms.forEach(r => {
                    html += `<div class="dd-card" onclick="goDD('ZONES', '${r}')"><div class="dd-name">🚪 ${r}</div></div>`;
                });
                html += `</div>`;
            } 
            // ÉCRAN 2 : ZONES
            else if (window.ddLevel === 'ZONES') {
                html += `
                    <div class="dd-header">
                        <div class="dd-header-actions"><button class="dd-back" onclick="goDD('ROOMS')">🔙 RETOUR</button></div>
                        <div class="dd-title">SALLE : ${window.ddRoom}</div>
                    </div><div class="dd-grid">`;
                zones.filter(z => z.room === window.ddRoom).forEach(z => {
                    html += `<div class="dd-card" style="border-color:${z.color||'#000'};" onclick="goDD('TABLES', '${z.id}')"><div class="dd-name" style="color:${z.color||'#000'}">🔲 ${z.label}</div></div>`;
                });
                html += `<div class="dd-card" style="border-color:#888;" onclick="goDD('TABLES', 'HORS_ZONE')"><div class="dd-name" style="color:#888">🍽️ AUTRES TABLES</div></div></div>`;
            } 
            // ÉCRAN 3 : TABLES (AVEC RETOUR + DÉBUT ET CHRONOS)
            else if (window.ddLevel === 'TABLES') {
                let zObj = zones.find(z => z.id === window.ddZone);
                let zName = zObj ? zObj.label : 'AUTRES TABLES';
                html += `
                    <div class="dd-header">
                        <div class="dd-header-actions">
                            <button class="dd-back" onclick="goDD('ZONES', '${window.ddRoom}')">🔙 RETOUR</button>
                            <button class="dd-home" onclick="goDD('ROOMS')">🏠 DÉBUT</button>
                        </div>
                        <div class="dd-title">${zName} > TABLES</div>
                    </div><div class="dd-grid">`;

                let tTables = tables.filter(t => {
                    if (t.room !== window.ddRoom) return false;
                    let cY = (t.t || 0) + ((t.h || 120)/2), cX = (t.l || 0) + ((t.w || 80)/2);
                    let inZ = zones.find(z => z.room === window.ddRoom && cX >= (z.l||0) && cX <= (z.l||0)+(z.w||400) && cY >= (z.t||0) && cY <= (z.t||0)+(z.h||300));
                    return window.ddZone === 'HORS_ZONE' ? !inZ : (inZ && inZ.id === window.ddZone);
                });

                tTables.forEach(t => {
                    let orderKey = Object.keys(activeOrders).find(k => k.toLowerCase() === t.label.toLowerCase());
                    let oData = orderKey ? activeOrders[orderKey] : null;
                    let sClass = '', sText = '<div class="dd-status">LIBRE</div>', cText = '';

                    if (oData && oData.alerteRouge) {
                        sClass = 'alert'; sText = '<div class="dd-status" style="color:#D9534F;">⚠️ ALERTE</div>';
                    } else if (oData && oData.items && oData.items.length > 0) {
                        let maxDelay = 0, isReady = oData.status === 'PRÊT' || oData.items.every(i => i.done);
                        oData.items.forEach(i => {
                            if (i.isSent && !i.served && i.itemId) {
                                let d = (Date.now() - parseInt(i.itemId)) / 60000;
                                if (d > maxDelay) maxDelay = d;
                            }
                        });
                        if (isReady) { sClass = 'ready'; sText = '<div class="dd-status" style="color:#10b981;">✅ PRÊT</div>'; } 
                        else if (maxDelay >= 25) { sClass = 'late'; sText = '<div class="dd-status">OCCUPÉE</div>'; cText = `<div class="dd-chrono" style="color:#e056fd;">⏱ ${Math.floor(maxDelay)} min</div>`; } 
                        else if (maxDelay >= 15) { sClass = 'warning'; sText = '<div class="dd-status">OCCUPÉE</div>'; cText = `<div class="dd-chrono" style="color:#9b59b6;">⏱ ${Math.floor(maxDelay)} min</div>`; } 
                        else if (maxDelay >= 1) { sClass = 'active'; sText = '<div class="dd-status">OCCUPÉE</div>'; cText = `<div class="dd-chrono" style="color:#3498db;">⏱ ${Math.floor(maxDelay)} min</div>`; } 
                        else { sClass = 'active'; sText = '<div class="dd-status">OCCUPÉE</div>'; }
                    } else if (oData && oData.status === 'reserved') {
                        sClass = 'reserved'; 
                        let cName = oData.clientName ? oData.clientName.substring(0,10) : '';
                        sText = `<div class="dd-status">RÉSERVÉE<br><span style="font-size:35px;color:#555;text-transform:none;">${oData.time||''} ${cName}</span></div>`;
                    }

                    html += `<div class="dd-card ${sClass}" onclick="openOrder('${orderKey||t.label}')"><div class="dd-name">TABLE ${t.label}</div>${sText}${cText}</div>`;
                });

                if (tTables.length === 0) html += `<div style="font-size:50px; color:#888; grid-column:1/-1;">Aucune table configurée dans cette zone.</div>`;
                html += `</div>`;
            }
            ddUI.innerHTML = html;
        }

        // Rafraîchissement automatique du chrono de l'entonnoir (chaque seconde)
        setInterval(() => { if (!isArchiMode) renderDrillDown(); }, 1000);

        // --- COMMANDES ET MENU ---
        function openOrder(tableLabel) {
            currentTableId = tableLabel;
            document.getElementById('ticket-table-name').innerText = "TABLE " + tableLabel;
            if (activeOrders[tableLabel] && activeOrders[tableLabel].items) currentTicket = JSON.parse(JSON.stringify(activeOrders[tableLabel].items));
            else currentTicket = [];
            
            document.getElementById('order-drawer').classList.add('open');
            let catContainer = document.getElementById('dynamic-categories-container');
            catContainer.innerHTML = unifiedCategories.map(c => `<button class="pay-btn" style="width:auto; margin:0;" onclick="renderMenu('${c.id}')">${c.label}</button>`).join('');
            renderMenu(unifiedCategories[0]?.id || 'MenuJour');
            renderTicket();
        }

        function closeOrder() { document.getElementById('order-drawer').classList.remove('open'); currentTableId = null; }

        function renderMenu(catId) {
            let items = unifiedMenu[catId] || [];
            let html = items.map(item => `
                <div class="btn-item" onclick="addToTicket('${item.name.replace(/'/g,"\\'")}', ${item.price})">
                    <span>${item.name}</span><span class="price">${parseFloat(item.price).toFixed(2)} €</span>
                </div>
            `).join('');
            document.getElementById('menu-grid').innerHTML = html || '<div style="font-size:50px; padding:40px;">Catégorie vide</div>';
        }

        function addToTicket(name, price) {
            let existing = currentTicket.find(i => i.n === name && !i.isSent);
            if(existing) existing.qty = (existing.qty || 1) + 1;
            else currentTicket.push({ id: Date.now(), itemId: Date.now(), n: name, p: price, qty: 1, isSent: false, done: false, served: false });
            renderTicket();
        }

        function renderTicket() {
            let total = 0;
            let html = currentTicket.map((i, idx) => {
                total += (i.p * (i.qty || 1));
                let status = !i.isSent ? '<span style="color:#3498db;">NOUVEAU</span>' : (i.done ? '<span style="color:#10b981;">PRÊT</span>' : '<span style="color:#e056fd;">ATTENTE</span>');
                return `<div class="ticket-item-row"><div><div style="font-size:50px; font-weight:900;">${i.qty||1}x ${i.n}</div><div style="font-size:40px; margin-top:10px;">${status}</div></div><div style="font-size:60px; font-weight:900;">${(i.p * (i.qty || 1)).toFixed(2)} €</div></div>`;
            }).join('');
            
            document.getElementById('ticket-list').innerHTML = html;
            document.getElementById('ticket-total-price').innerText = total.toFixed(2) + ' €';
            document.getElementById('btn-send-kds').style.display = currentTicket.some(i => !i.isSent) ? 'block' : 'none';
        }

        async function processOrderDispatch() {
            currentTicket.forEach(i => { if(!i.isSent) { i.isSent = true; i.itemId = Date.now(); } });
            renderTicket();
            await executeSaveTableState();
            alert("✅ Commande envoyée en cuisine !");
        }

        async function executeSaveTableState() {
            if(currentTableId) {
                await fetch(`${APP_SERVER_URL}/update-order?tenantID=${appTenantID}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tableId: currentTableId, order: { items: currentTicket, status: 'pending' } })
                });
            }
            closeOrder(); renderDrillDown();
        }

        // --- MENU OUTILS FLOTTANT ---
        function toggleOutilsMenu(e) {
            if(e) e.stopPropagation();
            document.getElementById('folder-outils').classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#folder-outils') && !e.target.closest('.folder-btn')) {
                document.getElementById('folder-outils').classList.remove('open');
            }
        });

        // --- PLEIN ÉCRAN ---
        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) { elem.requestFullscreen().catch(()=>{}); } 
            else { document.exitFullscreen().catch(()=>{}); }
            document.getElementById('folder-outils').classList.remove('open');
        }

        // --- MODE ARCHITECTURE ---
        function toggleArchiMode() { 
            isArchiMode = !isArchiMode; 
            document.body.classList.toggle('edit-mode', isArchiMode); 
            
            let fp = document.getElementById('floor-plan');
            let ddUI = document.getElementById('dd-ui-engine');
            
            if(isArchiMode) {
                if(ddUI) ddUI.style.display = 'none';
                fp.style.display = 'block';
                alert("Mode Édition Actif : L'ancienne carte s'affiche pour vous permettre de modifier la géométrie.");
            } else {
                if(ddUI) ddUI.style.display = 'flex';
                fp.style.display = 'none';
                goDD('ROOMS');
            }
            document.getElementById('folder-outils').classList.remove('open');
        }

    </script>
</body>
</html>
