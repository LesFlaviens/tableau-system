    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- ============================================================== -->
    <!-- 🛡️ SCRIPT 1 : SÉCURITÉ & RÉSEAU -->
    <!-- ============================================================== -->
    <script>
    "use strict";

    const ICHEF_ALLOWED_HOSTS = new Set(["os.ichef.ch", "localhost", "127.0.0.1"]);
    if (!ICHEF_ALLOWED_HOSTS.has(window.location.hostname)) {
        document.documentElement.innerHTML = "<h1 style='color:red;text-align:center;margin-top:20%;font-family:sans-serif'>🛑 ACCÈS NON AUTORISÉ</h1>";
        throw new Error("Hôte non autorisé");
    }

    document.addEventListener('contextmenu', event => event.preventDefault());

    function getOrCreateDeviceId() {
        const key = 'ichef_device_id';
        let deviceId = localStorage.getItem(key);
        if (!deviceId) {
            const bytes = new Uint8Array(24);
            crypto.getRandomValues(bytes);
            deviceId = 'dev_' + Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
            localStorage.setItem(key, deviceId);
        }
        return deviceId;
    }

    window.ICHEF_SECURITY = {
        deviceId: getOrCreateDeviceId(),
        sessionToken: null,
        csrfToken: null,
        user: null,
        permissions: new Set(),
        authenticatedAt: null,
        lastActivityAt: Date.now()
    };

    (async function enforceSecurity() {
        const params = new URLSearchParams(window.location.search);
        const urlTenantID = params.get('tenantID');
        const storedTenantID = localStorage.getItem('ichef_tenant_id');

        if (urlTenantID && !/^[A-Za-z0-9_-]{2,80}$/.test(urlTenantID)) {
            throw new Error('tenantID invalide');
        }
        if (urlTenantID && urlTenantID !== storedTenantID) {
            localStorage.removeItem('EMPIRE_GLOBAL_SYNC');
            localStorage.setItem('ichef_tenant_id', urlTenantID);
        }

        const tenantID = urlTenantID || storedTenantID;
        if (!tenantID) {
            window.location.replace('connexionpartenaire.html');
            return;
        }

        const SERVER_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:10000'
            : 'https://tableau-system.onrender.com';

        try {
            const response = await fetch(`${SERVER_URL}/api/security/bootstrap`, {
                method: 'POST',
                credentials: 'include',
                cache: 'no-store',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'iCHEF-PWA' },
                body: JSON.stringify({ tenantID, deviceId: window.ICHEF_SECURITY.deviceId, page: location.pathname.split('/').pop() || 'index.html' })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) {
                alert(data.error || 'Terminal non autorisé.');
                window.location.replace('connexionpartenaire.html');
                return;
            }
            window.ICHEF_SECURITY.csrfToken = data.csrfToken || null;
        } catch (error) {
            console.error('Initialisation sécurité impossible', error);
        }
    })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800;900&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000000; --panel: #0A0A0A; --border: rgba(250, 240, 230, 0.15); --border-strong: rgba(250, 240, 230, 0.3);
            --text-main: #FAF0E6; --text-muted: #8A857D; --gold: #C5A059; --gold-dim: rgba(197, 160, 89, 0.08);
            --accent: #C5A059; --accent-dim: rgba(197, 160, 89, 0.08); --alert: #D9534F; --alert-dim: rgba(217, 83, 79, 0.08);
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent;}
        h1, h2, h3 { font-family: 'Playfair Display', serif; font-weight: 600; letter-spacing: 1px; margin:0; }

        /* =========================================================
           BARRE DE SERVICE (MATCH EXACT IMAGE_BD42DB)
           ========================================================= */
        .service-dock {
            position: relative; z-index: 300; min-height: 58px; display: flex; align-items: center; justify-content: flex-start; gap: 8px;
            padding: 7px 14px; background: #050505; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .service-dock::-webkit-scrollbar { display: none; }

        .room-tabs-inline { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
        .room-tab { min-height: 42px; border: 1px solid var(--border); background: var(--panel); color: var(--text-muted); border-radius: 6px; padding: 7px 12px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.7px; cursor: pointer; transition: 0.15s ease; text-transform: uppercase; display: flex; align-items: center;}
        .room-tab.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

        .btn-mini-alert { min-height: 42px; border: 1px solid #ef4444; background: rgba(239,68,68,0.1); color: #ef4444; border-radius: 6px; padding: 7px 12px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.7px; display: flex; align-items: center; cursor: pointer;}

        .service-dock-primary, .service-dock-folders { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
        .service-dock-folders { margin-left: auto; }

        .dock-btn, .folder-btn { min-height: 42px; border: 1px solid var(--border); background: var(--panel); color: var(--text-main); border-radius: 6px; padding: 7px 12px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.7px; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: 0.15s ease; }
        .dock-btn:hover, .folder-btn:hover, .dock-btn:active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
        .dock-btn.primary { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
        .dock-btn.rush { border-color: rgba(239,68,68,0.55); color: #ef4444; }
        .dock-icon { font-size: 1rem; }
        
        .reservation-count-badge { min-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--gold); color: #000; font-size: 0.6rem; font-weight: 900; margin-left: 5px;}

        /* =========================================================
           MENU OUTILS (MATCH EXACT IMAGE_BD4281)
           ========================================================= */
        .quick-folder-panel {
            position: absolute; top: 65px; right: 14px; width: 280px; display: none; padding: 0;
            background: rgba(8,8,8,0.98); border: 1px solid var(--border-strong); border-radius: 8px;
            box-shadow: 0 14px 35px rgba(0,0,0,0.72); backdrop-filter: blur(12px); z-index: 1000;
        }
        .quick-folder-panel.open { display: block; }
        .quick-folder-title { padding: 15px; color: var(--gold); font-size: 0.7rem; font-weight: 900; letter-spacing: 1px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        .quick-folder-section-title { padding: 10px 15px; color: var(--gold); font-size: 0.6rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        
        .quick-folder-panel button {
            width: 100%; min-height: 48px; display: flex; align-items: center; padding: 10px 15px; border: 0;
            border-bottom: 1px solid rgba(255,255,255,0.05); background: transparent; color: #FFF; 
            font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 800; text-align: left; cursor: pointer; text-transform: uppercase;
        }
        .quick-folder-panel button:last-child { border-bottom: 0; }
        .quick-folder-panel button:hover { background: var(--gold-dim); color: var(--gold); }

        /* =========================================================
           ARCHI & TABLES (RANGEMENT SANS CHEVAUCHEMENT)
           ========================================================= */
        .floor-plan-wrapper { flex: 1; overflow: auto; background: var(--bg); position: relative; -webkit-overflow-scrolling: touch; }
        .floor-plan { position: relative; width: 100%; height: 100%; }

        /* MOTEUR DE GRILLE (Rush Mode Forcé) */
        body.rush-mode .floor-plan { display: flex; flex-wrap: wrap; gap: 15px; align-content: flex-start; padding: 25px; height: auto; min-height: 100%; box-sizing: border-box; }
        body.rush-mode .zone-wrapper { position: relative !important; left: 0 !important; top: 0 !important; width: 100% !important; height: auto !important; min-height: 140px !important; display: flex !important; flex-wrap: wrap !important; gap: 15px !important; padding: 60px 20px 20px 20px !important; border: 2px dashed #10b981 !important; border-radius: 12px !important; background-color: rgba(16, 185, 129, 0.05) !important; margin-bottom: 15px !important; }
        body.rush-mode .zone-wrapper > div.zone-obj { display: none !important; } /* Cache le vieux style de zone */
        
        body.rush-mode .table-wrapper { position: relative !important; left: 0 !important; top: 0 !important; width: 120px !important; height: 120px !important; margin: 0 !important; }
        body.rush-mode .chair { display: none !important; }
        body.rush-mode .table-obj { border-radius: 8px !important; clip-path: none !important; font-size: 1.2rem !important; border: 1px solid var(--border-strong) !important; box-shadow: none !important; }
        body.rush-mode .shape-losange, body.rush-mode .shape-triangle { background: var(--panel) !important; padding: 0 !important; clip-path: none !important; }
        body.rush-mode .shape-losange > .table-content, body.rush-mode .shape-triangle > .table-content { clip-path: none !important; background: transparent !important; }

        /* Couleurs de statut des tables */
        .table-obj { width: 100%; height: 100%; background: var(--panel); display: flex; justify-content: center; align-items: center; color: var(--text-main); font-weight: 600; cursor: pointer; transition: 0.2s; box-sizing: border-box; text-align: center; }
        .table-obj:active { transform: scale(0.95); }
        .status-reserved .table-obj { border-color: #ff69b4 !important; color: #ff69b4 !important; }
        .status-active .table-obj { border-color: #3498db !important; color: #3498db !important; }
        .status-warning .table-obj { border-color: #9b59b6 !important; color: #9b59b6 !important; }
        .status-late .table-obj { border-color: #e056fd !important; color: #e056fd !important; }
        .status-ready-bar .table-obj { border-color: #38bdf8 !important; color: #38bdf8 !important; }
        .status-alert .table-obj { border-color: var(--alert) !important; color: var(--alert) !important; box-shadow: inset 0 0 10px rgba(217,83,79,0.3) !important; }

        /* =========================================================
           LOGIN / PIN CODE
           ========================================================= */
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-display { font-size: 2.5rem; letter-spacing: 20px; margin-bottom: 20px; color: var(--gold); min-height: 50px; font-weight: bold; }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 80px); gap: 20px; }
        .pin-btn { background: transparent; border: 1px solid var(--gold); color: var(--text-main); font-size: 1.5rem; width: 80px; height: 80px; border-radius: 50%; cursor: pointer; }
        .pin-btn:active { background: var(--gold-dim); transform: scale(0.95); }

        /* TIROIR COMMANDE CACHÉ PAR DÉFAUT */
        .drawer { position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: none; flex-direction: column; }
        .drawer.open { display: flex; }
    </style>
</head>

    <!-- ============================================================== -->
    <!-- 🧠 CERVEAU GLOBAL ET LOGIQUE DE SYNCHRONISATION -->
    <!-- ============================================================== -->
    <script>
        const APP_SERVER_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:10000" : "https://tableau-system.onrender.com";
        const appTenantID = new URLSearchParams(window.location.search).get('tenantID') || localStorage.getItem('ichef_tenant_id');

        let activeOrders = {}; 
        let isArchiMode = false;
        let isRushMode = true; // Force la Grille par défaut pour éviter les chevauchements
        let rooms = ['Salle Principale'];
        let tables = [];
        let zones = [];
        let currentRoom = 'Salle Principale';
        let currentPin = "";
        let loginInProgress = false;

        // --- AUTHENTIFICATION ---
        function appendPin(n) { if (currentPin.length < 12) { currentPin += n; document.getElementById('pin-display').innerText = '•'.repeat(currentPin.length); } }
        function clearPin() { currentPin = ''; document.getElementById('pin-display').innerText = ''; document.getElementById('error-msg').style.display='none';}
        
        async function submitPin() {
            if (loginInProgress || !currentPin) return;
            loginInProgress = true;
            try {
                const response = await fetch(`${APP_SERVER_URL}/api/verify-pin`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenantID: appTenantID, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.body.classList.add('rush-mode'); // S'assure que la grille est active
                    syncData();
                    setInterval(syncData, 3000); // Polling toutes les 3s
                } else {
                    document.getElementById('error-msg').innerText = '❌ Code PIN incorrect';
                    document.getElementById('error-msg').style.display = 'block';
                    clearPin();
                }
            } catch (e) { 
                document.getElementById('error-msg').innerText = '❌ Erreur connexion serveur';
                document.getElementById('error-msg').style.display = 'block';
                clearPin();
            }
            loginInProgress = false;
        }

        function logout() { document.getElementById('login-screen').style.display = 'flex'; clearPin(); closeOutilsMenu(); }

        // --- INTERFACE ---
        function toggleOutilsMenu() {
            const panel = document.getElementById('folder-outils');
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
            } else {
                panel.classList.add('open');
            }
        }
        function closeOutilsMenu() { document.getElementById('folder-outils').classList.remove('open'); }
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#folder-outils') && !e.target.closest('.folder-btn')) closeOutilsMenu();
        });

        function toggleArchiMode() {
            isArchiMode = !isArchiMode;
            if (isArchiMode) {
                isRushMode = false;
                document.body.classList.remove('rush-mode');
                document.body.classList.add('edit-mode');
                alert("Mode Architecture : Vous pouvez déplacer les tables librement.");
            } else {
                isRushMode = true;
                document.body.classList.add('rush-mode');
                document.body.classList.remove('edit-mode');
            }
            closeOutilsMenu();
            renderFloor();
        }

        function toggleRushMode() {
            if (isArchiMode) return alert("Désactivez d'abord le mode Architecture.");
            isRushMode = !isRushMode;
            document.body.classList.toggle('rush-mode', isRushMode);
            renderFloor();
        }

        // --- SYNCHRONISATION SERVEUR ---
        async function syncData() {
            if (isArchiMode) return; // Ne pas perturber pendant l'édition
            try {
                const response = await fetch(`${APP_SERVER_URL}/get-current-state?tenantID=${appTenantID}`);
                const state = await response.json();
                if (state && state.activeOrders) {
                    let nO = state.activeOrders;
                    
                    if (nO['SETTINGS_MASTER'] && nO['SETTINGS_MASTER'].data) {
                        let settings = nO['SETTINGS_MASTER'].data;
                        let rushLvl = settings.rushLevel || 0;
                        document.getElementById('rush-level-display').innerText = rushLvl;
                    }

                    if (nO['ARCHITECTURE']) {
                        let archi = nO['ARCHITECTURE'].data || nO['ARCHITECTURE'];
                        if (archi.rooms) rooms = archi.rooms;
                        if (archi.tables) tables = archi.tables;
                        if (archi.zones) zones = archi.zones;
                    }

                    activeOrders = nO;
                    renderFloor();
                }
            } catch(e) { console.warn("Erreur Sync", e); }
        }

        // --- MOTEUR D'AFFICHAGE DES TABLES (SANS CHEVAUCHEMENT) ---
        function renderFloor() {
            let floor = document.getElementById('floor-plan');
            if (!floor) return;
            floor.innerHTML = '';

            let tablesInRoom = tables.filter(t => t.room === currentRoom);

            // MODE SERVICE (GRILLE / RUSH MODE FORCÉ)
            if (isRushMode && !isArchiMode) {
                // Créer un conteneur pour chaque zone
                let zoneContainers = {};
                zones.filter(z => z.room === currentRoom).forEach(z => {
                    let wrapper = document.createElement('div');
                    wrapper.className = 'zone-wrapper';
                    
                    let title = document.createElement('div');
                    title.innerHTML = `<span style="color:${z.color || '#10b981'}; font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;">🔲 ${z.label}</span>`;
                    wrapper.appendChild(title);
                    
                    zoneContainers[z.id] = wrapper;
                    floor.appendChild(wrapper);
                });

                // Conteneur pour les tables sans zone
                let unassignedWrapper = document.createElement('div');
                unassignedWrapper.className = 'zone-wrapper';
                unassignedWrapper.style.borderColor = '#888';
                unassignedWrapper.innerHTML = `<div><span style="color:#888; font-size: 1.1rem; font-weight: 800;">🍽️ AUTRES TABLES</span></div>`;

                // Placer les tables dans leurs zones
                tablesInRoom.forEach(t => {
                    let orderKey = Object.keys(activeOrders).find(k => k.toLowerCase() === t.label.toLowerCase());
                    let orderData = orderKey ? activeOrders[orderKey] : null;

                    let tw = document.createElement('div');
                    tw.className = 'table-wrapper';
                    
                    let statusClass = '';
                    let contentHtml = `<span style="font-size:1.2rem;">${t.label}</span>`;

                    if (orderData && orderData.items && orderData.items.length > 0) {
                        statusClass = 'status-active';
                        contentHtml += `<br><span style="font-size:0.7rem; color:#3498db; margin-top:5px;">OCCUPÉE</span>`;
                    } else if (orderData && orderData.status === 'reserved') {
                        statusClass = 'status-reserved';
                        contentHtml += `<br><span style="font-size:0.7rem; color:#ff69b4; margin-top:5px;">RÉSERVÉE</span>`;
                    }

                    tw.classList.add(statusClass);
                    tw.innerHTML = `<div class="table-obj shape-${t.shape || 'rect'}"><div class="table-content">${contentHtml}</div></div>`;
                    tw.onclick = () => alert("Ouvrir la table " + t.label);

                    // Détection mathématique de la zone (si le centre de la table est dans le rectangle de la zone)
                    let tableCenterY = (t.t || 0) + ((t.h || 120) / 2);
                    let tableCenterX = (t.l || 0) + ((t.w || 80) / 2);
                    
                    let activeZone = zones.find(z => 
                        z.room === currentRoom &&
                        tableCenterX >= (z.l || 0) && tableCenterX <= ((z.l || 0) + (z.w || 400)) &&
                        tableCenterY >= (z.t || 0) && tableCenterY <= ((z.t || 0) + (z.h || 300))
                    );

                    if (activeZone && zoneContainers[activeZone.id]) {
                        zoneContainers[activeZone.id].appendChild(tw);
                    } else {
                        unassignedWrapper.appendChild(tw);
                    }
                });

                if (unassignedWrapper.children.length > 1) { // S'il y a plus que le titre
                    floor.appendChild(unassignedWrapper);
                }
            } 
            // MODE ARCHITECTURE (COORDONNÉES ABSOLUES)
            else {
                zones.filter(z => z.room === currentRoom).forEach(z => {
                    let zw = document.createElement('div'); zw.className = 'zone-wrapper';
                    zw.style.left = (z.l||0)+'px'; zw.style.top = (z.t||0)+'px'; zw.style.width = (z.w||400)+'px'; zw.style.height = (z.h||300)+'px';
                    zw.innerHTML = `<div class="zone-obj"><span class="zone-badge" style="color:${z.color||'#3498db'}">${z.label}</span></div>`;
                    floor.appendChild(zw);
                });

                tablesInRoom.forEach(t => {
                    let tw = document.createElement('div'); tw.className = 'table-wrapper';
                    tw.style.left = (t.l||0)+'px'; tw.style.top = (t.t||0)+'px'; tw.style.width = (t.w||80)+'px'; tw.style.height = (t.h||120)+'px';
                    tw.innerHTML = `<div class="table-obj shape-${t.shape || 'rect'}"><div class="table-content">${t.label}</div></div>`;
                    floor.appendChild(tw);
                });
            }
        }
    </script>
</body>
</html>
