<style id="ichef-mobile-touch-stable-v1">
@media (max-width:600px){

  #mobile-exact-service,
  #mobile-exact-grid,
  #mobile-exact-room,
  .mobile-exact-table,
  #order-drawer,
  #order-drawer button,
  #order-drawer [role="button"],
  #order-drawer .btn-item,
  #order-drawer .menu-tab,
  .modal.open,
  .modal.open button,
  .pin-pad,
  .pin-btn {
    pointer-events:auto !important;
  }

  .mobile-exact-table,
  #mobile-exact-room,
  #order-drawer button,
  #order-drawer [role="button"],
  #order-drawer .btn-item,
  #order-drawer .menu-tab,
  .modal.open button,
  .pin-btn {
    touch-action:manipulation !important;
    -webkit-tap-highlight-color:transparent !important;
  }

  /* Le contenu intérieur ne bloque jamais
     le toucher du bouton table */
  .mobile-exact-table > * {
    pointer-events:none !important;
  }

  /* Une fenêtre invisible ne bloque pas
     les boutons situés dessous */
  .mobile-overlay:not(.show),
  .modal:not(.open) {
    pointer-events:none !important;
  }
}
</style>
