
<!-- iCHEF RH V254 · Correctif contraste : assistance planning uniquement. -->
<style id="ichef-rh-v254-assistant-dark-controls-contrast">
/* Corrige les cases sombres sans modifier leurs actions, les API ou les données RH. */
/* Pastille de synchronisation noire/vert foncé : libellé blanc. */
html body #ia-predictions-modal #v113-state,
html body #ia-predictions-modal #v113-state.ready,
html body #ia-predictions-modal .v113-state.ready {
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
  opacity:1 !important;
  text-shadow:none !important;
}

html body #ia-predictions-modal #v131-planning-tools-btn .v131-tools-icon,

  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
  fill:currentColor !important;
  opacity:1 !important;
}
/* Boutons de navigation sélectionnés : fond noir = texte / sous-titre blancs. */
html body #ia-predictions-modal #v153-assistant-toolbar :is(#v153-nav-planning,#v153-nav-proposal,#v134-emergency-btn,#v131-planning-tools-btn).active,

  background:#111820 !important;
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
  border-color:#111820 !important;
}
html body #ia-predictions-modal #v153-assistant-toolbar :is(#v153-nav-planning,#v153-nav-proposal,#v134-emergency-btn,#v131-planning-tools-btn).active :is(strong,small,span,b,i,svg),

  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
  fill:currentColor !important;
