<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>iCHEF OS — Espace Partenaire</title>
<meta name="ichef-build" content="V57.2-STAFF-SECURE">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#030303;
    --panel:rgba(5,5,5,.79);
    --panel-strong:rgba(9,9,9,.95);
    --gold:#d7ad5c;
    --gold-light:#f0cf8b;
    --gold-border:rgba(215,173,92,.66);
    --gold-soft:rgba(215,173,92,.14);
    --text:#f4f2ee;
    --muted:#858585;
    --muted-2:#6f6f6f;
    --green:#22d993;
    --red:#ff7474;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
}

html{
    background:#030303;
}

body{
    min-height:100svh;
    overflow-x:hidden;
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.02) 0%,
            rgba(0,0,0,.03) 19%,
            rgba(0,0,0,.10) 33%,
            rgba(0,0,0,.46) 54%,
            rgba(0,0,0,.90) 78%,
            #030303 100%
        ),
        url("ChatGPT Image 20 sept. 2026, 14_24_41.png")
        center top / 100% auto no-repeat,
        #030303;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   PORTE D'ENTRÉE OFFICIELLE iCHEF
   ========================================================= */

.ichef-entry{
    min-height:100svh;
    padding:
        max(28px,env(safe-area-inset-top))
        22px
        max(42px,env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

.entry-brand{
    width:min(900px,94vw);
    text-align:center;
    position:relative;
    z-index:5;
}

.entry-logo{
    display:block;
    width:min(325px,38vw);
    max-height:120px;
    height:auto;
    margin:0 auto 15px;
    object-fit:contain;
    object-position:center;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.48));
}

.entry-gold-line{
    width:min(470px,55vw);
    height:1px;
    margin:0 auto 17px;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(215,173,92,.22) 10%,
            rgba(240,207,139,.90) 50%,
            rgba(215,173,92,.22) 90%,
            transparent 100%
        );
    box-shadow:0 0 15px rgba(215,173,92,.22);
}

.entry-brand h1{
    margin:0;
    color:var(--gold-light);
    font-size:clamp(23px,2.15vw,35px);
    line-height:1.2;
    font-weight:500;
    letter-spacing:clamp(8px,.92vw,15px);
    text-transform:uppercase;
}

.entry-brand p{
    margin:14px 0 0;
    color:#878787;
    font-size:clamp(7px,.64vw,11px);
    font-weight:600;
    letter-spacing:clamp(3px,.46vw,7px);
    text-transform:uppercase;
    line-height:1.55;
}

.login-stage{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:112px;
    position:relative;
    z-index:8;
}

.login-card{
    width:min(720px,92vw);
    padding:31px 36px 24px;
    border:1px solid var(--gold-border);
    border-radius:24px;
    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(215,173,92,.10),
            transparent 35%
        ),
        rgba(4,4,4,.79);
    backdrop-filter:blur(13px);
    -webkit-backdrop-filter:blur(13px);
    box-shadow:
        0 32px 90px rgba(0,0,0,.58),
        inset 0 1px 0 rgba(255,255,255,.025);
}

.form-group{
    margin-bottom:19px;
}

.form-label{
    display:flex;
    align-items:center;
    gap:13px;
    margin:0 6px 11px;
    color:#eeeae4;
    font-size:13px;
    line-height:1;
    font-weight:700;
    letter-spacing:1.5px;
}

.label-icon{
    width:22px;
    height:22px;
    display:grid;
    place-items:center;
    flex:0 0 22px;
    color:var(--gold);
}

.label-icon svg{
    width:22px;
    height:22px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.field-wrap{
    position:relative;
}

.entry-field{
    width:100%;
    height:62px;
    padding:0 20px;
    border:1px solid rgba(215,173,92,.53);
    border-radius:14px;
    outline:none;
    background:rgba(18,18,18,.92);
    color:#f6f4ef;
    font-size:17px;
    font-weight:400;
    letter-spacing:.2px;
    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.entry-field::placeholder{
    color:#737373;
}

.entry-field:focus{
    border-color:var(--gold-light);
    background:#121212;
    box-shadow:
        0 0 0 3px rgba(215,173,92,.07),
        0 0 24px rgba(215,173,92,.05);
}

#pinCode{
    padding-right:60px;
}

.pin-toggle{
    position:absolute;
    top:50%;
    right:13px;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border:0;
    border-radius:10px;
    background:transparent;
    color:#8f8f8f;
    display:grid;
    place-items:center;
}

.pin-toggle:hover{
    color:var(--gold-light);
    background:rgba(255,255,255,.025);
}

.pin-toggle svg{
    width:21px;
    height:21px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.login-button{
    width:100%;
    height:64px;
    margin-top:2px;
    border:0;
    border-radius:14px;
    background:#f1f0ed;
    color:#090909;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    padding:0 24px 0 72px;
    box-shadow:
        0 12px 34px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.70);
    transition:
        transform .16s ease,
        background .16s ease,
        opacity .16s ease;
}

.login-button:hover:not(:disabled){
    transform:translateY(-2px);
    background:#fff;
}

.login-button:active:not(:disabled){
    transform:translateY(0) scale(.994);
}

.login-button:disabled{
    cursor:wait;
    opacity:.62;
}

.login-button-label{
    justify-self:center;
    font-size:13px;
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;
}

.login-arrow{
    font-size:32px;
    line-height:1;
    font-weight:300;
    margin-top:-2px;
}

.login-loader{
    display:none;
    justify-self:center;
    width:21px;
    height:21px;
    border:3px solid rgba(0,0,0,.16);
    border-top-color:#111;
    border-radius:50%;
    animation:spin .78s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.login-error{
    min-height:21px;
    margin:13px 5px 0;
    text-align:center;
    color:var(--red);
    font-size:12px;
    font-weight:600;
    line-height:1.4;
}

.server-state{
    min-height:22px;
    margin-top:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:9px;
    font-weight:800;
    letter-spacing:2.1px;
    text-transform:uppercase;
    color:#929292;
}

.server-dot{
    width:11px;
    height:11px;
    flex:0 0 11px;
    border-radius:50%;
    background:#8b8b8b;
    box-shadow:none;
    transition:.2s;
}

.server-state.ok .server-dot{
    background:var(--green);
    box-shadow:0 0 14px rgba(34,217,147,.48);
}

.server-state.ok .server-text strong{
    color:var(--green);
}

.server-state.waiting .server-dot{
    background:#d8a33b;
    box-shadow:0 0 12px rgba(216,163,59,.35);
}

.server-state.error .server-dot{
    background:#ff6262;
    box-shadow:0 0 12px rgba(255,98,98,.30);
}

.page-base-line{
    position:absolute;
    left:0;
    right:0;
    bottom:max(0px,env(safe-area-inset-bottom));
    height:1px;
    background:rgba(215,173,92,.14);
    pointer-events:none;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width:900px){
    body{
        background-size:auto 38vh;
        background-position:center top;
    }

    .ichef-entry{
        padding-left:12px;
        padding-right:12px;
    }

    .entry-logo{
        width:min(270px,64vw);
        max-height:94px;
        margin-bottom:10px;
    }

    .entry-gold-line{
        width:min(390px,70vw);
        margin-bottom:13px;
    }

    .entry-brand h1{
        font-size:19px;
        letter-spacing:5px;
    }

    .entry-brand p{
        font-size:7px;
        letter-spacing:2.1px;
        line-height:1.6;
    }

    .login-stage{
        margin-top:106px;
    }

    .login-card{
        width:min(560px,96vw);
        padding:23px 18px 18px;
        border-radius:18px;
    }

    .form-label{
        font-size:11px;
        gap:10px;
    }

    .entry-field{
        height:55px;
        border-radius:12px;
        font-size:15px;
    }

    .login-button{
        height:57px;
        border-radius:12px;
        padding-left:54px;
        padding-right:18px;
    }

    .login-button-label{
        font-size:11px;
        letter-spacing:3px;
    }
}

@media (max-height:820px) and (min-width:901px){
    .ichef-entry{
        padding-top:13px;
    }

    .entry-logo{
        width:min(280px,31vw);
        max-height:92px;
        margin-bottom:7px;
    }

    .entry-gold-line{
        margin-bottom:11px;
    }

    .entry-brand h1{
        font-size:26px;
    }

    .entry-brand p{
        margin-top:9px;
    }

    .login-stage{
        margin-top:72px;
    }

    .login-card{
        width:min(670px,84vw);
        padding:22px 31px 17px;
    }

    .form-group{
        margin-bottom:14px;
    }

    .form-label{
        margin-bottom:8px;
    }

    .entry-field{
        height:53px;
    }

    .login-button{
        height:55px;
    }

    .login-error{
        margin-top:8px;
    }
}
</style>
</head>

<body>

<main class="ichef-entry">

    <header class="entry-brand" aria-label="iCHEF Operating System">
        <img
            class="entry-logo"
            src="Gemini_Generated_Image_q748ueq748ueq748-Photoroom (1) (1) (1).png"
            alt="iCHEF Operating System">

        <div class="entry-gold-line" aria-hidden="true"></div>

        <h1>ESPACE PARTENAIRE</h1>

        <p>CONNEXION SÉCURISÉE À VOTRE ENVIRONNEMENT iCHEF</p>
    </header>

    <section class="login-stage" aria-label="Connexion iCHEF">

        <form class="login-card" id="ichefLoginForm" novalidate>

            <div class="form-group">
                <label class="form-label" for="tenantID">
                    <span class="label-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 21V4h10v17"></path>
                            <path d="M15 9h4v12"></path>
                            <path d="M8 8h4M8 12h4M8 16h4"></path>
                        </svg>
                    </span>
                    Identifiant établissement
                </label>

                <div class="field-wrap">
                    <input
                        class="entry-field"
                        id="tenantID"
                        name="tenantID"
                        type="text"
                        autocomplete="username"
                        autocorrect="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        maxlength="64"
                        placeholder="Votre identifiant"
                        aria-describedby="loginError">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="pinCode">
                    <span class="label-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                        </svg>
                    </span>
                    Code d’accès / PIN
                </label>

                <div class="field-wrap">
                    <input
                        class="entry-field"
                        id="pinCode"
                        name="pinCode"
                        type="password"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        minlength="4"
                        maxlength="12"
                        autocomplete="current-password"
                        placeholder="Votre code d’accès"
                        aria-describedby="loginError">

                    <button
                        class="pin-toggle"
                        id="pinToggle"
                        type="button"
                        aria-label="Afficher le code PIN"
                        title="Afficher / masquer le code PIN">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"></path>
                            <circle cx="12" cy="12" r="2.4"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button
                class="login-button"
                id="loginButton"
                type="submit">
                <span
                    class="login-button-label"
                    id="loginButtonLabel">
                    SE CONNECTER
                </span>

                <span
                    class="login-loader"
                    id="loginLoader"
                    aria-hidden="true">
                </span>

                <span
                    class="login-arrow"
                    id="loginArrow"
                    aria-hidden="true">
                    →
                </span>
            </button>

            <div
                class="login-error"
                id="loginError"
                role="alert"
                aria-live="polite">
            </div>

            <div
                class="server-state waiting"
                id="serverState"
                aria-live="polite">
                <span class="server-dot" aria-hidden="true"></span>
                <span class="server-text">
                    iCHEF · <strong>VÉRIFICATION SERVEUR</strong>
                </span>
            </div>

        </form>

    </section>

    <div class="page-base-line" aria-hidden="true"></div>

</main>

<script>
"use strict";

/* =========================================================
   iCHEF OS — PORTE D'ENTRÉE OFFICIELLE
   Un seul point d'entrée pour Direction, Chefs et Staff.
   ========================================================= */

const SERVER_URL =
    ["localhost","127.0.0.1"].includes(location.hostname) ||
    location.protocol === "file:"
        ? "http://localhost:10000"
        : "https://tableau-system.onrender.com";

const loginForm = document.getElementById("ichefLoginForm");
const tenantField = document.getElementById("tenantID");
const pinField = document.getElementById("pinCode");
const pinToggle = document.getElementById("pinToggle");
const loginButton = document.getElementById("loginButton");
const loginButtonLabel = document.getElementById("loginButtonLabel");
const loginLoader = document.getElementById("loginLoader");
const loginArrow = document.getElementById("loginArrow");
const loginError = document.getElementById("loginError");
const serverState = document.getElementById("serverState");

let serverOnline = false;
let loginBusy = false;

function normalizeRole(value){
    return String(value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[\s-]+/g,"_");
}

function getDeviceId(){
    let deviceId = localStorage.getItem("ichef_device_id");

    if(!deviceId){
        if(crypto.randomUUID){
            deviceId = crypto.randomUUID();
        }else{
            const bytes = new Uint8Array(24);
            crypto.getRandomValues(bytes);
            deviceId =
                "dev_" +
                Array.from(
                    bytes,
                    b => b.toString(16).padStart(2,"0")
                ).join("");
        }

        localStorage.setItem(
            "ichef_device_id",
            deviceId
        );
    }

    return deviceId;
}

function targetForRole(role){
    const r = normalizeRole(role);

    const management = new Set([
        "master",
        "admin",
        "manager",
        "direction",
        "gerant",
        "gerant_general",
        "directeur",
        "directrice"
    ]);

    if(management.has(r)){
        return "admin.html";
    }

    const specialRoutes = {
        cuisine:"chef.html",
        chef:"chef.html",
        chef_cuisine:"chef.html",
        patisserie:"chef-patissier.html",
        chef_patissier:"chef-patissier.html",
        bar:"pass-bar.html",
        barman:"pass-bar.html",
        pass_bar:"pass-bar.html",
        chef_bar:"chef-bar.html",
        bar_manager:"chef-bar.html"
    };

    if(specialRoutes[r]){
        return specialRoutes[r];
    }

    /* IMPORTANT :
       "role" dans iCHEF peut être un intitulé libre
       (serveur, cuisinier, runner, réception, etc.).
       Tout PIN collaborateur valide qui n'est pas Direction
       arrive donc sur son espace personnel staff. */
    return "portail-staff.html";
}

function setBusy(value){
    loginBusy = Boolean(value);

    loginButton.disabled = loginBusy;
    tenantField.disabled = loginBusy;
    pinField.disabled = loginBusy;
    pinToggle.disabled = loginBusy;

    loginButtonLabel.style.display =
        loginBusy ? "none" : "inline";

    loginLoader.style.display =
        loginBusy ? "block" : "none";

    loginArrow.style.visibility =
        loginBusy ? "hidden" : "visible";
}

function setServerState(type, text){
    serverState.className =
        "server-state " + type;

    serverState.querySelector(".server-text").innerHTML =
        `iCHEF · <strong>${text}</strong>`;
}

function clearStoredAuth(){
    localStorage.removeItem("ichef_master_pin");
    localStorage.removeItem("pin");

    sessionStorage.removeItem("ichef_auth_token");
    sessionStorage.removeItem("ichef_access_token");
    sessionStorage.removeItem("ichef_csrf_token");
    sessionStorage.removeItem("ichef_session_hint");
    sessionStorage.removeItem("ichef_user_role");
    sessionStorage.removeItem("ichef_staff_profile");
    sessionStorage.removeItem("ichef_authenticated_at");
}

async function probeServer(){
    const controller = new AbortController();
    const timeout = setTimeout(
        () => controller.abort(),
        7000
    );

    try{
        const response = await fetch(
            `${SERVER_URL}/healthz?_t=${Date.now()}`,
            {
                method:"GET",
                cache:"no-store",
                credentials:"omit",
                signal:controller.signal
            }
        );

        let data = {};
        try{
            data = await response.json();
        }catch(_){}

        const mongoReady =
            data.mongoReadyState === undefined ||
            Number(data.mongoReadyState) === 1;

        serverOnline =
            response.ok &&
            mongoReady;

        if(serverOnline){
            setServerState(
                "ok",
                "SERVEUR OK"
            );
        }else{
            setServerState(
                "waiting",
                "SERVEUR EN DÉMARRAGE"
            );
        }

    }catch(_){
        serverOnline = false;
        setServerState(
            "error",
            "SERVEUR INJOIGNABLE"
        );
    }finally{
        clearTimeout(timeout);
    }
}

function buildStaffProfile(data){
    const source =
        data.staff ||
        data.employee ||
        data.user ||
        {};

    const fullStaffName =
        String(
            source.name ||
            data.staffName ||
            ""
        ).trim();

    const nameParts =
        fullStaffName
            .split(/\s+/)
            .filter(Boolean);

    return {
        id:String(
            data.staffId ||
            data.employeeId ||
            data.userId ||
            source.id ||
            source._id ||
            ""
        ),

        firstName:String(
            data.firstName ||
            data.prenom ||
            source.firstName ||
            source.prenom ||
            source.firstname ||
            nameParts[0] ||
            ""
        ),

        lastName:String(
            data.lastName ||
            data.nom ||
            source.lastName ||
            source.nom ||
            source.lastname ||
            nameParts.slice(1).join(" ") ||
            ""
        ),

        role:normalizeRole(
            data.role ||
            source.role
        ),

        department:String(
            data.department ||
            data.service ||
            source.department ||
            source.service ||
            ""
        ),

        position:String(
            data.position ||
            data.poste ||
            source.position ||
            source.poste ||
            ""
        ),

        location:String(
            data.location ||
            data.zone ||
            source.location ||
            source.zone ||
            ""
        )
    };
}

async function verifyPinRequest(payload){
    const headers = {
        "Content-Type":"application/json",
        "Accept":"application/json",
        "X-iCHEF-Device":payload.deviceId,
        "X-iCHEF-Tenant":payload.tenantID
    };

    const request = credentials =>
        fetch(
            `${SERVER_URL}/api/verify-pin`,
            {
                method:"POST",
                credentials,
                cache:"no-store",
                headers,
                body:JSON.stringify(payload)
            }
        );

    /* Render / cookies tiers :
       on essaie sans cookie puis compatibilité session cookie. */
    let response = null;

    try{
        response = await request("omit");
    }catch(_){
        response = null;
    }

    if(
        !response ||
        response.status === 401 ||
        response.status === 403
    ){
        response = await request("include");
    }

    return response;
}

async function attemptLogin(event){
    event?.preventDefault();

    if(loginBusy){
        return;
    }

    const tenantID =
        tenantField.value
            .trim()
            .toUpperCase();

    const pin =
        pinField.value
            .replace(/\D/g,"")
            .slice(0,12);

    loginError.textContent = "";

    if(
        !/^[A-Z0-9_-]{2,80}$/.test(tenantID)
    ){
        loginError.textContent =
            "Identifiant établissement invalide.";

        tenantField.focus();
        return;
    }

    if(
        !/^\d{4,12}$/.test(pin)
    ){
        loginError.textContent =
            "Votre code PIN doit contenir entre 4 et 12 chiffres.";

        pinField.value = "";
        pinField.focus();
        return;
    }

    setBusy(true);

    try{
        clearStoredAuth();

        setServerState(
            "waiting",
            "VÉRIFICATION"
        );

        const response =
            await verifyPinRequest({
                tenantID,
                pin,
                deviceId:getDeviceId(),
                terminal:"PORTAIL",
                module:"PORTAIL",
                source:"connexionpartenaire.html"
            });

        let data = {};

        try{
            data = await response.json();
        }catch(_){}

        if(
            !response.ok ||
            data.success !== true
        ){
            throw new Error(
                data.error ||
                data.message ||
                "Identifiant ou code PIN refusé."
            );
        }

        const safeTenantID =
            String(
                data.safeTenantID ||
                tenantID
            )
            .trim()
            .toUpperCase();

        const target =
            targetForRole(
                data.role ||
                data.user?.role
            );

        if(!target){
            throw new Error(
                "Votre rôle iCHEF n'a pas encore de portail attribué."
            );
        }

        /* Tenant */
        localStorage.setItem(
            "ichef_tenant_id",
            safeTenantID
        );

        /* Rôle */
        const normalizedRole =
            normalizeRole(
                data.role ||
                data.user?.role
            );

        sessionStorage.setItem(
            "ichef_user_role",
            normalizedRole
        );

        /* Jetons éventuels du backend */
        const accessToken =
            data.accessToken ||
            data.token ||
            null;

        if(
            typeof accessToken === "string" &&
            accessToken.length >= 20
        ){
            sessionStorage.setItem(
                "ichef_auth_token",
                accessToken
            );

            sessionStorage.setItem(
                "ichef_access_token",
                accessToken
            );
        }

        if(data.csrfToken){
            sessionStorage.setItem(
                "ichef_csrf_token",
                data.csrfToken
            );
        }

        if(data.sessionId){
            sessionStorage.setItem(
                "ichef_session_hint",
                data.sessionId
            );
        }

        /* Profil personnel staff / utilisateur.
           Le PIN n'est jamais stocké. */
        const profile =
            buildStaffProfile(data);

        const isStaffTarget =
            target === "portail-staff.html";

        if(
            isStaffTarget &&
            (
                !accessToken ||
                typeof accessToken !== "string" ||
                accessToken.length < 20 ||
                !profile.id
            )
        ){
            throw new Error(
                "Session staff sécurisée non reçue par le serveur. Déployez le server V57.2 puis reconnectez-vous."
            );
        }

        sessionStorage.setItem(
            "ichef_staff_profile",
            JSON.stringify(profile)
        );

        sessionStorage.setItem(
            "ichef_authenticated_at",
            String(Date.now())
        );

        pinField.value = "";

        setServerState(
            "ok",
            "ACCÈS AUTORISÉ"
        );

        location.replace(
            `${target}?tenantID=${encodeURIComponent(safeTenantID)}`
        );

    }catch(error){
        const message =
            error?.message === "Failed to fetch"
                ? "Serveur iCHEF injoignable. Réessayez dans quelques instants."
                : (
                    error?.message ||
                    "Connexion refusée."
                );

        loginError.textContent = message;

        pinField.value = "";
        pinField.focus();

        await probeServer();

    }finally{
        setBusy(false);
    }
}

pinToggle.addEventListener(
    "click",
    () => {
        const visible =
            pinField.type === "text";

        pinField.type =
            visible
                ? "password"
                : "text";

        pinToggle.setAttribute(
            "aria-label",
            visible
                ? "Afficher le code PIN"
                : "Masquer le code PIN"
        );

        pinField.focus();
    }
);

tenantField.addEventListener(
    "input",
    () => {
        tenantField.value =
            tenantField.value
                .toUpperCase()
                .replace(/[^A-Z0-9_-]/g,"")
                .slice(0,80);
    }
);

pinField.addEventListener(
    "input",
    () => {
        pinField.value =
            pinField.value
                .replace(/\D/g,"")
                .slice(0,12);
    }
);

loginForm.addEventListener(
    "submit",
    attemptLogin
);

window.addEventListener(
    "DOMContentLoaded",
    async () => {
        const requestedTenantID =
            new URLSearchParams(
                location.search
            ).get("tenantID");

        const savedTenantID =
            localStorage.getItem(
                "ichef_tenant_id"
            );

        const initialTenant =
            requestedTenantID ||
            savedTenantID ||
            "";

        if(
            /^[A-Za-z0-9_-]{2,80}$/.test(
                initialTenant
            )
        ){
            tenantField.value =
                initialTenant.toUpperCase();
        }

        await probeServer();

        if(tenantField.value){
            pinField.focus();
        }else{
            tenantField.focus();
        }
    },
    {once:true}
);
</script>

</body>
</html>
