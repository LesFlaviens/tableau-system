<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iCHEF OS — Offres</title>
<meta name="theme-color" content="#050505">
<style>
:root{
  --bg:#050505;
  --black:#050505;
  --panel:#090909;
  --panel2:#0d0d0d;
  --white:#f7f7f5;
  --muted:#aaa;
  --muted2:#777;
  --gold:#d8ad50;
  --gold-soft:#f0d89a;
  --line:rgba(255,255,255,.14);
  --gold-line:rgba(216,173,80,.62);
  --green:#43d68c;
  --r:15px;
  --shadow:0 26px 80px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.45;
  overflow-x:hidden;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1180px,92%);margin-inline:auto}

/* ---------- NAV ---------- */
header{
  position:absolute;
  inset:0 0 auto 0;
  z-index:30;
  height:67px;
}
.nav{
  height:67px;
  display:grid;
  grid-template-columns:180px 1fr auto;
  align-items:center;
  gap:18px;
}
.brand-crop{
  width:140px;
  height:50px;
  object-fit:cover;
  object-position:left top;
  display:block;
}
.links{
  display:flex;
  justify-content:center;
  gap:26px;
  font-size:10px;
  color:#e0e0e0;
}
.links a:hover{color:#fff}
.nav-actions{display:flex;align-items:center;gap:20px}
.lang{font-size:10px;color:#d6d6d6}
.btn{
  min-height:44px;
  padding:0 22px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.28);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#090909;
  color:#fff;
  font-size:10px;
  font-weight:850;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:background .18s,border-color .18s,transform .18s;
}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.6)}
.btn-white{
  background:#f7f7f5;
  color:#050505;
  border-color:#fff;
  box-shadow:0 10px 26px rgba(255,255,255,.06);
}
.btn-white:hover{background:#fff}
.btn-ghost{background:rgba(7,7,7,.68)}
