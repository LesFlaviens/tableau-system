<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>iCHEF OS — Téléphone · Tables → Commande → Résumé/Caisse</title>
<style>
:root{
  --bg:#050607;--panel:#0b0e0f;--panel2:#111516;--line:#293033;--line2:#3a4346;
  --text:#fff;--muted:#aab2b5;--gold:#e2b84e;--green:#46d66b;--orange:#ff9a4f;
  --red:#ff6262;--purple:#aa8cff;--blue:#63b8ff;--shadow:0 18px 55px rgba(0,0,0,.58);
  --safe-top:max(8px,env(safe-area-inset-top));--safe-bottom:max(8px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body.sun{--bg:#fff;--panel:#fff;--panel2:#f5f5f5;--line:#111;--line2:#000;--text:#000;--muted:#222;--shadow:none}
body.night{--bg:#000;--panel:#020202;--panel2:#060606;--line:#202020;--line2:#333;--text:#eee;--muted:#888;--gold:#d0a93f}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.icon{font-size:18px;line-height:1}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.good{color:var(--green)}
.warn{color:var(--orange)}
.bad{color:var(--red)}

/* LOGIN */
#login{
  position:fixed;inset:0;z-index:10000;background:#050607;display:flex;align-items:center;justify-content:center;
  padding:22px;
}
.login-card{width:min(390px,100%);text-align:center}
.logo{font-weight:950;letter-spacing:8px;font-size:34px;margin-bottom:6px}.logo span{color:var(--gold)}
.login-sub{color:#92999b;font-size:13px;margin-bottom:22px}
.tenant-box{display:none;margin-bottom:12px}
.tenant-box.show{display:block}
.tenant-box input{width:100%;height:48px;border:1px solid #333;border-radius:12px;background:#0d1011;color:#fff;padding:0 14px;outline:none}
.pin-dots{height:32px;display:flex;gap:9px;align-items:center;justify-content:center;margin-bottom:18px}
.pin-dots i{width:11px;height:11px;border-radius:50%;border:1px solid #666;background:transparent}
.pin-dots i.on{background:var(--gold);border-color:var(--gold)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pin-pad button{height:58px;border:1px solid #303638;border-radius:14px;background:#0c0f10;color:#fff;font-size:20px;font-weight:850}
.pin-pad button:active{transform:scale(.97);border-color:var(--gold)}
.pin-pad .secondary{font-size:12px;color:#a4abad}.login-msg{height:24px;margin-top:12px;color:var(--red);font-size:12px;font-weight:700}

/* APP */
#app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
#statusbar{
  height:46px;padding-top:var(--safe-top);flex:0 0 calc(46px + var(--safe-top));display:grid;grid-template-columns:1.2fr .8fr .8fr .9fr .8fr;
  background:#07090a;border-bottom:1px solid rgba(226,184,78,.42);z-index:30
}
body.sun #statusbar{background:#fff;border-bottom:2px solid #111}
.status-cell{min-width:0;border-right:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
body.sun .status-cell{border-color:#ccc}
.status-cell:last-child{border-right:none}.status-label{font-size:7px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:850}.status-value{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#rooms{height:42px;flex:0 0 42px;display:flex;gap:7px;align-items:center;overflow-x:auto;padding:5px 8px;border-bottom:1px solid var(--line);scrollbar-width:none;background:var(--panel)}
#rooms::-webkit-scrollbar{display:none}.room-btn{flex:0 0 auto;height:31px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}.room-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(226,184,78,.08)}
#service{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 8px 82px;background:var(--bg)}
#tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;align-content:start}
.table-card{position:relative;min-height:94px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--text);padding:7px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.table-card:active{transform:scale(.985)}.table-card .num{font-size:22px;font-weight:950;letter-spacing:.3px}.table-card .meta{font-size:8px;color:var(--muted);font-weight:800;white-space:nowrap}.table-card .time{font-size:9px;color:var(--muted);font-weight:900}.table-card .badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:10px;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:950}.table-card.empty{opacity:.86}.table-card.active{border-color:var(--gold)}.table-card.ready{border-color:var(--green);box-shadow:inset 0 0 0 1px rgba(70,214,107,.15)}.table-card.wait{border-color:var(--orange)}.table-card.late{border-color:var(--red)}.table-card.reserved{border-color:var(--purple)}.table-card.payment{border-color:#c7ccd0}.table-card.alert{animation:pulse 1.1s infinite;border-color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,98,98,.13)}}
.empty-state{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:30px 15px;text-align:center;color:var(--muted);font-size:12px}

/* BOTTOM TOOLS */
#tools{position:fixed;left:7px;right:7px;bottom:var(--safe-bottom);z-index:45;height:64px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px;border:1px solid rgba(226,184,78,.38);border-radius:15px;background:#07090a;box-shadow:var(--shadow)}
body.sun #tools{background:#fff;border-color:#111}
.tool{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;font-size:7.5px;font-weight:900;text-transform:uppercase;letter-spacing:.15px}.tool .icon{font-size:17px}.tool .tiny{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:6.5px}.tool.rush0,.tool.rush1{border-color:var(--green);color:var(--green)}.tool.rush2,.tool.rush3{border-color:var(--gold);color:var(--gold)}.tool.rush4{border-color:var(--orange);color:var(--orange)}.tool.rush5{border-color:var(--red);color:var(--red)}

/* SHEETS */
.sheet{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;padding:10px;padding-bottom:var(--safe-bottom)}.sheet.open{display:flex}.sheet-card{width:min(560px,100%);max-height:84dvh;border:1px solid var(--line2);border-radius:18px 18px 12px 12px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}.sheet-head{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}.sheet-title{flex:1;min-width:0;font-size:14px;font-weight:950;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close-btn{width:38px;height:38px;border:1px solid var(--line2);border-radius:50%;background:var(--panel2);color:var(--text);font-size:20px}.sheet-body{padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.action-btn{min-height:58px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--text);font-size:11px;font-weight:900;padding:8px}.action-btn.gold{border-color:var(--gold);color:var(--gold)}.action-btn.green{border-color:var(--green);color:var(--green)}.action-btn.orange{border-color:var(--orange);color:var(--orange)}.action-btn.red{border-color:var(--red);color:var(--red)}.action-btn.purple{border-color:var(--purple);color:var(--purple)}.big-state{border:1px solid var(--line2);border-radius:14px;background:var(--panel2);padding:15px;text-align:center;margin-bottom:9px}.big-state .big{font-size:24px;font-weight:950}.big-state .small{font-size:10px;color:var(--muted);margin-top:4px}.list{display:flex;flex-direction:column;gap:7px}.list-row{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:9px;display:flex;align-items:center;gap:8px}.list-row .grow{flex:1;min-width:0}.list-row .title{font-size:11px;font-weight:900}.list-row .sub{font-size:8px;color:var(--muted);margin-top:2px}.mini-btn{height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--text);font-size:9px;font-weight:900}.field{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);padding:9px;outline:none}.field:focus{border-color:var(--gold)}

/* ORDER DRAWER */
#order{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;flex-direction:column}.order-open #order{display:flex}.order-open #tools{display:none}
.order-head{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:7px;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--panel)}.order-name{flex:1;min-width:0;font-size:15px;font-weight:950;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-btn{height:38px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);color:var(--text);font-size:9px;font-weight:900}.head-btn.close{width:38px;padding:0;font-size:18px}
.order-info{height:44px;flex:0 0 44px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--panel)}.info-chip{border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:9px;font-weight:900}.info-chip button{width:28px;height:27px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--text);font-weight:950}
.order-main{flex:1;min-height:0;display:grid;grid-template-rows:42% 58%;overflow:hidden}.menu-side{min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}.categories{height:42px;flex:0 0 42px;display:flex;gap:5px;overflow-x:auto;padding:5px 7px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat-btn{height:31px;flex:0 0 auto;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);font-size:9px;font-weight:900}.cat-btn.active{border-color:var(--gold);color:var(--gold)}.menu-products{flex:1;min-height:0;overflow-y:auto;padding:6px 7px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start}.product{min-height:63px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:6px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:left}.product:active{border-color:var(--gold)}.product .pname{font-size:9px;font-weight:900;line-height:1.15}.product .price{font-size:10px;font-weight:950;color:var(--gold)}.product.sold{opacity:.35;pointer-events:none}
.ticket-side{min-height:0;display:flex;flex-direction:column;background:var(--panel)}.ticket-actions{height:43px;flex:0 0 43px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px 7px;border-bottom:1px solid var(--line)}.ticket-actions button{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);font-size:8px;font-weight:900}.ticket-items{flex:1;min-height:0;overflow-y:auto;padding:5px 7px}.ticket-row{border-bottom:1px solid var(--line);padding:7px 2px;display:grid;grid-template-columns:1fr auto;gap:7px}.ticket-left{min-width:0}.ticket-name{font-size:10px;font-weight:900}.ticket-meta{font-size:7.5px;color:var(--muted);margin-top:2px}.ticket-right{text-align:right}.ticket-price{font-size:10px;font-weight:950;color:var(--gold)}.qtybar{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}.qtybar button{width:25px;height:24px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--text);font-size:12px;font-weight:950}.guest-tag{display:inline-block;margin-left:5px;padding:1px 5px;border:1px solid var(--purple);border-radius:8px;color:var(--purple);font-size:7px}.line-state{display:inline-block;margin-left:5px;font-size:7px;font-weight:950}.line-state.ready{color:var(--green)}.line-state.sent{color:var(--gold)}
.ticket-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:7px}.ticket-total{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:950}.ticket-total strong{font-size:18px;color:var(--gold)}.send-btn{width:100%;height:45px;border:1px solid var(--green);border-radius:10px;background:rgba(70,214,107,.08);color:var(--green);font-size:11px;font-weight:950;letter-spacing:.3px}

/* TOAST / ALERT */
#toast{position:fixed;left:50%;bottom:90px;z-index:20000;transform:translate(-50%,12px);max-width:88vw;padding:9px 13px;border:1px solid var(--line2);border-radius:10px;background:#0b0e0f;color:#fff;font-size:10px;font-weight:850;opacity:0;pointer-events:none;transition:.18s}.toast-show #toast{opacity:1;transform:translate(-50%,0)}
#server-alert{position:fixed;top:calc(52px + var(--safe-top));left:8px;right:8px;z-index:500;display:none;border:1px solid var(--red);border-radius:11px;background:#1a0909;color:#fff;padding:9px 10px;font-size:10px;font-weight:850;box-shadow:var(--shadow)}#server-alert.show{display:block}

/* PLAN */
.plan-wrap{position:relative;width:100%;height:52dvh;min-height:330px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}.plan-canvas{position:absolute;inset:0;transform-origin:0 0}.plan-table{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);font-size:9px;font-weight:950}.plan-zone{position:absolute;border:1px dashed var(--blue);border-radius:10px;background:rgba(99,184,255,.05);color:var(--blue);font-size:8px;font-weight:900;padding:4px;overflow:hidden}

@media (orientation:landscape){#tables{grid-template-columns:repeat(6,minmax(0,1fr))}.table-card{min-height:76px}.order-main{grid-template-columns:53% 47%;grid-template-rows:1fr}.menu-side{border-bottom:none;border-right:1px solid var(--line)}.menu-products{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:720px){#app,#order{max-width:720px;left:50%;right:auto;width:720px;transform:translateX(-50%)}#tools{max-width:706px;left:50%;right:auto;width:706px;transform:translateX(-50%)}#server-alert{max-width:690px;left:50%;right:auto;width:690px;transform:translateX(-50%)}}

/* ===== iCHEF TELEPHONE V2 : 3 ECRANS ===== */
.order-head{height:64px;flex:0 0 64px;padding:8px 10px;gap:8px}
.order-name{font-size:19px;font-weight:950}
.head-btn{min-width:48px;height:48px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:950}
.head-btn.close{width:48px;height:48px;font-size:24px}
.order-info{height:56px;flex:0 0 56px;padding:6px 8px;gap:7px}
.info-chip{min-height:43px;border-radius:11px;font-size:12px;font-weight:950}
.info-chip button{width:36px;height:35px;border-radius:9px;font-size:18px}
.categories{height:56px;flex:0 0 56px;gap:7px;padding:6px 8px}
.cat-btn{height:43px;padding:0 16px;border-radius:11px;font-size:11px;font-weight:950}
.cat-btn.active{border-width:2px}
.menu-products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px;padding:8px}
.product{min-height:96px;border-radius:14px;padding:11px;border-width:1.5px}
.product .pname{font-size:14px;line-height:1.18;font-weight:950}
.product .price{font-size:16px;margin-top:7px}
.product:active{transform:scale(.975);border-color:var(--gold);background:rgba(226,184,78,.08)}
.ticket-actions{height:62px;flex:0 0 62px;gap:6px;padding:6px 7px}
.ticket-actions button{min-height:49px;border-radius:10px;font-size:9px;font-weight:950;line-height:1.12}
.ticket-actions button:nth-child(1){border-color:var(--purple);color:var(--purple)}
.ticket-actions button:nth-child(2){border-color:var(--blue);color:var(--blue)}
.ticket-actions button:nth-child(3){border-color:var(--orange);color:var(--orange)}
.ticket-actions button:nth-child(4){border-color:var(--gold);color:var(--gold)}
.ticket-row{min-height:68px;padding:10px 3px}
.ticket-name{font-size:13px}.ticket-meta{font-size:9px;line-height:1.35}
.ticket-price{font-size:14px}.qtybar{gap:6px;margin-top:6px}
.qtybar button{width:38px;height:36px;border-radius:9px;font-size:19px}
.ticket-total{font-size:15px}.ticket-total strong{font-size:23px}
.send-btn{height:58px;border-width:2px;border-radius:13px;font-size:14px;font-weight:950}
.cooking-tag{display:inline-flex;align-items:center;margin-left:5px;padding:2px 6px;border:1px solid var(--blue);border-radius:8px;color:var(--blue);font-size:7px;font-weight:950}

/* ECRAN 3 */
#summary{position:fixed;inset:0;z-index:1500;display:none;flex-direction:column;background:#f4f1eb;color:#0b0d0e}
body.summary-open #summary{display:flex}
body.summary-open #order,body.summary-open #tools{display:none!important}
.summary-head{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #d8d2c7;background:#f7f4ef}
.summary-table{flex:1;min-width:0;font-size:25px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-close{height:44px;padding:0 12px;border:0;background:transparent;color:#111;font-size:14px;font-weight:900}
.summary-zone{margin:10px 8px 8px;min-height:52px;border:2px solid #9b8f00;border-radius:11px;background:#f6f1db;color:#7b7500;display:flex;align-items:center;justify-content:center;padding:8px 10px;text-align:center;font-size:13px;font-weight:950}
.summary-note{margin:0 8px 8px;min-height:46px;border:1px solid #d9d3c8;border-radius:10px;background:#fffdfa;color:#555;padding:10px 12px;font-size:11px}
.summary-content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 8px 10px}
.summary-group{margin-bottom:9px;border:1px solid #d5cfc4;border-radius:12px;overflow:hidden;background:#fff}
.summary-group-title{min-height:38px;display:flex;align-items:center;padding:7px 10px;background:#111516;color:#fff;font-size:12px;font-weight:950}
.summary-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 10px;border-top:1px solid #ece6dc}
.summary-item-name{font-size:12px;font-weight:900}.summary-item-meta{margin-top:3px;color:#67615b;font-size:9px;line-height:1.3}
.summary-item-price{color:#7b5a00;font-size:12px;font-weight:950;white-space:nowrap}
.summary-fiscal{margin:0 8px 8px;border:1px solid #2a3032;border-radius:12px;background:#07090a;color:#fff;padding:10px}
.summary-fiscal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.summary-fiscal-title{color:var(--gold);font-size:11px;font-weight:950}.summary-fiscal-status{font-size:8px;color:#b4bbbd}
.summary-tax-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:3px 0;border-top:1px solid #252a2c;font-size:9px}
.summary-tax-row strong{color:var(--gold)}
.summary-bottom{flex:0 0 auto;padding:8px;border-top:1px solid #232729;background:#07090a;color:#fff}
.summary-total{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 2px 8px}
.summary-total span{font-size:12px;font-weight:900;color:#b1b7b9}.summary-total strong{color:var(--gold);font-size:30px;font-weight:950}
.summary-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.summary-actions button{min-height:48px;border:1px solid #444b4e;border-radius:10px;background:#111516;color:#fff;font-size:10px;font-weight:950}
.summary-actions .kitchen{border-color:var(--green);color:var(--green)}
.summary-cash{width:100%;height:66px;border:0;border-radius:12px;background:linear-gradient(180deg,#e7b331,#ca8e12);color:#fff;font-size:22px;font-weight:950;letter-spacing:2px}
.fiscal-warning{margin-top:7px;color:#8f979a;font-size:7px;line-height:1.25}
.sheet-card{max-height:88dvh}.action-btn{min-height:68px;font-size:12px}.field{font-size:13px}
@media (orientation:landscape){.menu-products{grid-template-columns:repeat(3,minmax(0,1fr))!important}.product{min-height:82px}}

</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="logo">i<span>CHEF</span></div>
    <div class="login-sub">TÉLÉPHONE · CONNEXION SÉCURISÉE</div>

<script>
(function(){
"use strict";

/* =========================================================
   iCHEF TÉLÉPHONE V2 — 3 ÉCRANS · SYMBIOSE SERVEUR
   - aucun moteur PAD/desktop
   - un seul état local
   - un seul Socket.IO
   - server.js = source de vérité
   ========================================================= */

const APP_SERVER_URL=(location.hostname==="localhost"||location.hostname==="127.0.0.1")?"http://localhost:10000":"https://tableau-system.onrender.com";
const $=id=>document.getElementById(id);
const clone=v=>{try{return structuredClone(v)}catch(_){return JSON.parse(JSON.stringify(v))}};
const unwrap=v=>v&&Object.prototype.hasOwnProperty.call(v,"data")?v.data:v;
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const text=v=>String(v??"").trim();
const now=()=>Date.now();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const uid=()=>"m_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);

const STORAGE={
  get(k,d=null){try{const v=localStorage.getItem(k);return v===null?d:v}catch(_){return d}},
  set(k,v){try{localStorage.setItem(k,String(v))}catch(_){}}
};

const STATE={
  tenantID:new URLSearchParams(location.search).get("tenantID")||STORAGE.get("ichef_tenant_id","")||"",
  deviceId:STORAGE.get("ichef_device_id","")||("dev_"+cryptoId()),
  pin:"",role:"",plan:"",specialite:"",authenticated:false,
  connected:false,socket:null,socketLoading:null,lastServerAt:0,syncing:false,
  activeOrders:{},architecture:{rooms:["Salle Principale"],tables:[],zones:[]},
  rooms:["Salle Principale"],tables:[],zones:[],room:"Salle Principale",
  menu:[],categories:[],category:"TOUT",reservations:[],settings:{},
  currentTable:null,currentOrder:null,currentScreen:"tables",display:STORAGE.get("ichef_phone_display","auto")||"auto",
  renderPending:false,loginPin:"",lastAlertSignature:"",lastWriteAt:0
};
STORAGE.set("ichef_device_id",STATE.deviceId);
if(STATE.tenantID)STORAGE.set("ichef_tenant_id",STATE.tenantID);

function cryptoId(){
  try{const b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,"0")).join("")}catch(_){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
}

function toast(message,bad=false){
  const el=$("toast");el.textContent=message;el.style.borderColor=bad?"var(--red)":"var(--line2)";document.body.classList.add("toast-show");clearTimeout(toast.t);toast.t=setTimeout(()=>document.body.classList.remove("toast-show"),1800);
}

function money(v){
  const cur=text(STATE.settings.currency||STATE.settings.devise||"EUR").toUpperCase();
  try{return new Intl.NumberFormat("fr-FR",{style:"currency",currency:cur==="CHF"?"CHF":"EUR"}).format(num(v))}catch(_){return num(v).toFixed(2)+(cur==="CHF"?" CHF":" €")}
}

function duration(ts){
  if(!ts)return"00:00";const d=Math.max(0,now()-Number(ts));const m=Math.floor(d/60000),s=Math.floor((d%60000)/1000);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* ---------------- AUTH ---------------- */
function renderPin(){
  const box=$("pinDots");box.innerHTML="";for(let i=0;i<6;i++){const d=document.createElement("i");if(i<STATE.loginPin.length)d.className="on";box.appendChild(d)}
}
function loginMessage(m=""){ $("loginMsg").textContent=m }
async function verifyPin(){
  if(!STATE.tenantID){STATE.tenantID=text($("tenantInput").value);if(!STATE.tenantID){loginMessage("Identifiant établissement requis");return}STORAGE.set("ichef_tenant_id",STATE.tenantID)}
  if(STATE.loginPin.length<4){loginMessage("Code incomplet");return}
  loginMessage("Connexion…");
  try{
    const r=await fetch(APP_SERVER_URL+"/api/verify-pin",{method:"POST",cache:"no-store",credentials:"omit",headers:{"Content-Type":"application/json"},body:JSON.stringify({tenantID:STATE.tenantID,pin:STATE.loginPin,deviceId:STATE.deviceId})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.success)throw new Error(j.message||"Code refusé");
    STATE.pin=STATE.loginPin;STATE.role=j.role||"";STATE.plan=j.plan||"";STATE.specialite=j.specialite||"";STATE.authenticated=true;
    $("login").classList.add("hidden");$("app").classList.remove("hidden");$("tools").classList.remove("hidden");
    loginMessage("");await bootApp();
  }catch(e){STATE.loginPin="";renderPin();loginMessage(e.message||"Connexion impossible")}
}
$("pinPad").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.pin!==undefined){if(STATE.loginPin.length<6)STATE.loginPin+=b.dataset.pin;renderPin();if(STATE.loginPin.length>=4)clearTimeout(verifyPin.t);verifyPin.t=setTimeout(()=>{if(STATE.loginPin.length>=4)verifyPin()},260)}
  if(b.dataset.act==="clear"){STATE.loginPin="";renderPin();loginMessage("")}
  if(b.dataset.act==="back"){STATE.loginPin=STATE.loginPin.slice(0,-1);renderPin();loginMessage("")}
});
if(!STATE.tenantID)$("tenantBox").classList.add("show");renderPin();

/* ---------------- SERVER API ---------------- */
async function getState(){
  const r=await fetch(APP_SERVER_URL+"/get-current-state?tenantID="+encodeURIComponent(STATE.tenantID)+"&_t="+Date.now(),{cache:"no-store",credentials:"omit"});
  if(!r.ok)throw new Error("Lecture serveur "+r.status);return r.json();
}
async function updateServer(key,data,auditReason="Mise à jour téléphone"){
  if(!STATE.authenticated)throw new Error("Session non authentifiée");
  const body={tableId:key,order:data,pin:STATE.pin};
  const r=await fetch(APP_SERVER_URL+"/update-order?tenantID="+encodeURIComponent(STATE.tenantID),{method:"POST",cache:"no-store",credentials:"omit",headers:{"Content-Type":"application/json","X-iCHEF-Device":STATE.deviceId,"X-iCHEF-Terminal":"TELEPHONE"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||("Écriture serveur "+r.status));return j;
}
async function optimisticWrite(key,data,reason){
  const had=Object.prototype.hasOwnProperty.call(STATE.activeOrders,key),old=had?clone(STATE.activeOrders[key]):undefined;
  if(data===null)delete STATE.activeOrders[key];else STATE.activeOrders[key]=clone(data);
  applyDerived();scheduleRender();STATE.lastWriteAt=now();
  try{await updateServer(key,data,reason);return true}catch(e){if(had)STATE.activeOrders[key]=old;else delete STATE.activeOrders[key];applyDerived();scheduleRender();toast("Non enregistré : "+e.message,true);return false}
}

/* ---------------- REALTIME ---------------- */
function setConnection(label,kind="warn"){
  $("stLink").textContent=label;$("stLink").className="status-value "+(kind==="good"?"good":kind==="bad"?"bad":"warn");
}
function loadSocket(){
  if(window.io)return Promise.resolve(window.io);if(STATE.socketLoading)return STATE.socketLoading;
  STATE.socketLoading=new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.socket.io/4.7.2/socket.io.min.js";s.async=true;s.onload=()=>resolve(window.io);s.onerror=()=>reject(new Error("Socket.IO indisponible"));document.head.appendChild(s)});return STATE.socketLoading;
}
async function connectSocket(){
  try{await loadSocket();if(STATE.socket)return;
    const socket=window.io(APP_SERVER_URL,{transports:["websocket","polling"],upgrade:true,reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:350,reconnectionDelayMax:2500,timeout:4500});STATE.socket=socket;
    socket.on("connect",()=>{STATE.connected=true;setConnection("TEMPS RÉEL","good");socket.emit("joinTenant",String(STATE.tenantID));if(!STATE.lastServerAt||now()-STATE.lastServerAt>5000)syncFull("reconnect")});
    socket.on("updateState",s=>{STATE.connected=true;STATE.lastServerAt=now();setConnection("TEMPS RÉEL","good");applyServerState(s,"socket")});
    socket.on("disconnect",()=>{STATE.connected=false;setConnection(navigator.onLine?"RECONNEXION":"HORS LIGNE",navigator.onLine?"warn":"bad")});
    socket.on("connect_error",()=>{STATE.connected=false;setConnection(navigator.onLine?"SYNCHRO":"HORS LIGNE",navigator.onLine?"warn":"bad")});
  }catch(_){setConnection("SYNCHRO","warn")}
}
async function syncFull(reason="manual"){
  if(STATE.syncing||!navigator.onLine)return;STATE.syncing=true;
  try{const s=await getState();STATE.lastServerAt=now();applyServerState(s,reason);if(!STATE.connected)setConnection("SYNCHRO","good")}catch(e){setConnection("HORS LIGNE","bad");toast("Serveur inaccessible",true)}finally{STATE.syncing=false}
}
function applyServerState(serverState,source){
  if(!serverState||typeof serverState!=="object")return;STATE.activeOrders=serverState.activeOrders&&typeof serverState.activeOrders==="object"?serverState.activeOrders:{};if(serverState.sasConfig)STATE.sasConfig=serverState.sasConfig;applyDerived();scheduleRender();checkGlobalAlert();
}
window.addEventListener("online",()=>{setConnection("RECONNEXION","warn");connectSocket();syncFull("online")},{passive:true});
window.addEventListener("offline",()=>{STATE.connected=false;setConnection("HORS LIGNE","bad")},{passive:true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&STATE.authenticated){connectSocket();if(!STATE.lastServerAt||now()-STATE.lastServerAt>10000)syncFull("visible")}});

/* ---------------- DATA NORMALIZATION ---------------- */
function normalizeArchitecture(){
  const raw=unwrap(STATE.activeOrders.ARCHITECTURE)||{};const rooms=Array.isArray(raw.rooms)&&raw.rooms.length?raw.rooms.map(text).filter(Boolean):["Salle Principale"];const tables=Array.isArray(raw.tables)?raw.tables.filter(Boolean).map(t=>({...t,label:text(t.label||t.name||t.id),room:text(t.room||rooms[0])})).filter(t=>t.label):[];const zones=Array.isArray(raw.zones)?raw.zones.filter(Boolean).map(z=>({...z,label:text(z.label||z.name||z.id),room:text(z.room||rooms[0])})):[];STATE.architecture={rooms,tables,zones};STATE.rooms=rooms;STATE.tables=tables;STATE.zones=zones;if(!STATE.rooms.includes(STATE.room))STATE.room=STATE.rooms[0];
}
function productFrom(p,cat="Menu",key=""){
  if(p==null)return null;if(typeof p==="string")return{id:key||p,name:p,price:0,category:cat,available:true};
  const name=text(p.name||p.nom||p.label||p.title||key);if(!name)return null;const price=num(p.price??p.prix??p.priceTTC??p.prixTTC??p.tarif??p.ttc);const category=text(p.category||p.categorie||p.cat||cat)||"Menu";const available=!(p.available===false||p.disponible===false||p.soldOut===true||p.epuise===true||p.stock===0);return{id:text(p.id||p.productId||p.code||key||name),name,price,category,available,course:text(p.course||p.sequence||p.service||"PLATS"),raw:p};
}
function flattenMenu(raw,label){
  raw=unwrap(raw);const out=[];if(!raw)return out;if(Array.isArray(raw)){raw.forEach((p,i)=>{const x=productFrom(p,label,String(i));if(x)out.push(x)});return out}
  if(typeof raw==="object"){Object.entries(raw).forEach(([k,v])=>{if(Array.isArray(v))v.forEach((p,i)=>{const x=productFrom(p,k,k+"_"+i);if(x)out.push(x)});else if(v&&typeof v==="object"&&!Array.isArray(v)){if(v.name||v.nom||v.label||v.price!==undefined||v.prix!==undefined){const x=productFrom(v,label,k);if(x)out.push(x)}else Object.entries(v).forEach(([k2,p])=>{const x=productFrom(p,k,k2);if(x)out.push(x)})}})}return out;
}
function normalizeMenu(){
  const all=[...flattenMenu(STATE.activeOrders.MENU_MASTER,"Cuisine"),...flattenMenu(STATE.activeOrders.MENU_MASTER_BAR,"Bar"),...flattenMenu(STATE.activeOrders.MENU_MASTER_PATISSERIE,"Pâtisserie")];const map=new Map();all.forEach(p=>map.set(p.id+"|"+p.name,p));STATE.menu=[...map.values()];STATE.categories=["TOUT",...new Set(STATE.menu.map(p=>p.category).filter(Boolean))];if(!STATE.categories.includes(STATE.category))STATE.category="TOUT";
}
function normalizeReservations(){const r=unwrap(STATE.activeOrders.RESERVATIONS_MASTER);STATE.reservations=Array.isArray(r)?r:[]}
function applyDerived(){STATE.settings=unwrap(STATE.activeOrders.SETTINGS_MASTER)||{};normalizeArchitecture();normalizeMenu();normalizeReservations();if(STATE.currentTable)STATE.currentOrder=getOrder(STATE.currentTable)}

/* ---------------- ORDERS ---------------- */
const SYSTEM_KEYS=new Set(["ARCHITECTURE","SETTINGS_MASTER","RESERVATIONS_MASTER","MENU_MASTER","MENU_MASTER_BAR","MENU_MASTER_PATISSERIE","STAFF_ACCESS","LOYALTY_MASTER","TIMESHEETS_MASTER","ALERTS_MASTER","FINANCIAL_HISTORY","AUDIT_MASTER"]);
function isRealOrder(k,o){return!SYSTEM_KEYS.has(k)&&!String(k).startsWith("FISCAL_")&&!String(k).startsWith("FINANCIAL_CANCEL_")&&o&&typeof o==="object"&&Array.isArray(o.items)}
function getOrder(table){const o=STATE.activeOrders[table];return isRealOrder(table,o)?o:null}
function orderCreated(o){if(!o)return 0;let t=Number(o.createdAt||o.openedAt||o.date||0);if(!t&&Array.isArray(o.items)&&o.items.length)t=Math.min(...o.items.map(i=>Number(i.itemId||i.createdAt||i.sentAt||Date.now())).filter(Number.isFinite));return t||0}
function lineReady(i){return !!(i&&(i.done===true||i.ready===true||i.isReady===true||i.readyAt||String(i.status||i.productionStatus||"").toLowerCase()==="ready"))}
function lineServed(i){return !!(i&&(i.served===true||i.isServed===true||i.servedAt||String(i.status||"").toLowerCase()==="served"))}
function lineFired(i){return !!(i&&(i.fired===true||i.sent===true||i.sentAt))}
function tableStats(table){
  const o=getOrder(table);const res=findReservation(table);if(!o){return{status:res?"reserved":"empty",pax:num(res?.pax||res?.covers||0),ready:0,age:0,total:0}}
  const items=o.items||[];const ready=items.filter(i=>lineReady(i)&&!lineServed(i)).reduce((s,i)=>s+Math.max(1,num(i.qty||i.quantity||1)),0);const waiting=items.some(i=>lineFired(i)&&!lineReady(i));const age=orderCreated(o);let status="active";if(o.alerteRouge||o.alert)status="alert";else if(String(o.status||"").toLowerCase().includes("payment"))status="payment";else if(ready)status="ready";else if(waiting&&age&&now()-age>25*60000)status="late";else if(waiting)status="wait";return{status,pax:num(o.pax||o.covers||0),ready,age,total:orderTotal(o)}
}
function orderTotal(o){return(o?.items||[]).reduce((s,i)=>s+num(i.price??i.prix)*Math.max(1,num(i.qty||i.quantity||1)),0)}
function ensureOrder(table){let o=getOrder(table);if(o)return clone(o);const t=STATE.tables.find(x=>x.label===table);return{tableId:table,status:"open",pax:num(t?.pax||2)||2,createdAt:Date.now(),updatedAt:Date.now(),items:[],source:"TELEPHONE"}}
function lineKey(i){return text(i.lineId||i.uuid||i.itemId||i.id||i.name)}
async function saveCurrent(order,reason){order.updatedAt=Date.now();STATE.currentOrder=clone(order);return optimisticWrite(STATE.currentTable,order,reason)}

function addProduct(product){
  if(!STATE.currentTable)return;
  const o=ensureOrder(STATE.currentTable),raw=product.raw||{};
  const same=o.items.find(i=>!lineFired(i)&&text(i.productId||i.id)===product.id&&text(i.guest||"")===""&&!text(i.cooking));
  if(same)same.qty=Math.max(1,num(same.qty||1))+1;
  else o.items.push({
    lineId:uid(),itemId:Date.now(),productId:product.id,name:product.name,price:product.price,qty:1,
    category:product.category,course:product.course||"PLATS",fired:false,done:false,served:false,
    guest:null,cooking:"",vatRate:raw.vatRate??raw.tva??raw.taxRate??null,taxCode:raw.taxCode??raw.tvaCode??null,
    source:"TELEPHONE"
  });
  saveCurrent(o,"Ajout article téléphone");
}
function mutateLine(key,action){const o=ensureOrder(STATE.currentTable),i=o.items.find(x=>lineKey(x)===key);if(!i)return;if(action==="plus")i.qty=Math.max(1,num(i.qty||1))+1;if(action==="minus"){i.qty=Math.max(0,num(i.qty||1)-1);if(i.qty<=0)o.items=o.items.filter(x=>x!==i)}if(action==="delete")o.items=o.items.filter(x=>x!==i);saveCurrent(o,"Modification article téléphone")}
async function sendKitchen(){
  if(!STATE.currentTable)return;const o=ensureOrder(STATE.currentTable);let changed=0;o.items.forEach(i=>{if(!lineFired(i)){i.fired=true;i.sentAt=Date.now();i.status="sent";changed++}});if(!changed){toast("Rien de nouveau à envoyer");return}o.status="sent";await saveCurrent(o,"Envoi commande cuisine");toast("👨‍🍳 Commande envoyée")
}
function setPax(delta){if(!STATE.currentTable)return;const o=ensureOrder(STATE.currentTable);o.pax=Math.max(1,num(o.pax||2)+delta);saveCurrent(o,"Modification couverts")}

/* ---------------- RESERVATIONS ---------------- */
function findReservation(table){const today=new Date().toISOString().slice(0,10);return STATE.reservations.find(r=>{const t=text(r.tableId||r.table||r.tableLabel||r.numeroTable);const d=text(r.date||r.day||"").slice(0,10);const status=text(r.status||"").toLowerCase();return t===table&&(!d||d===today)&&!status.includes("cancel")})||null}

/* ---------------- RUSH ---------------- */
function rushSnapshot(){
  let active=0,waiting=0,ready=0,oldest=0,kitchen=0,bar=0;Object.entries(STATE.activeOrders).forEach(([k,o])=>{if(!isRealOrder(k,o))return;active++;const age=orderCreated(o);if(age&&(!oldest||age<oldest))oldest=age;(o.items||[]).forEach(i=>{const q=Math.max(1,num(i.qty||i.quantity||1));if(lineReady(i)&&!lineServed(i))ready+=q;else if(lineFired(i))waiting+=q;const c=(text(i.category)+" "+text(i.course)).toLowerCase();if(c.includes("bar")||c.includes("boisson")||c.includes("drink"))bar+=q;else kitchen+=q})});const ageMin=oldest?Math.floor((now()-oldest)/60000):0;let score=active*.18+waiting*.12+ready*.08+(ageMin>12?1:0)+(ageMin>20?1:0)+(ageMin>30?1:0);const level=Math.max(0,Math.min(5,Math.floor(score)));const labels=["CALME","CALME","ATTENTION","SOUTENU","RUSH","TRÈS RUSH"];const total=Math.max(1,kitchen+bar);return{level,label:labels[level],active,waiting,ready,ageMin,kitchen:Math.round(kitchen/total*100),bar:Math.round(bar/total*100)}}

function autoDisplay(){if(STATE.display!=="auto")return;const h=new Date().getHours();document.body.classList.toggle("night",h>=22||h<6);document.body.classList.remove("sun")}

async function kitchenMessage(type,detail=""){

}
function readyCount(){let n=0;Object.entries(STATE.activeOrders).forEach(([k,o])=>{if(!isRealOrder(k,o))return;(o.items||[]).forEach(i=>{if(lineReady(i)&&!lineServed(i))n+=Math.max(1,num(i.qty||i.quantity||1))})});return n}

/* ---------------- FISCAL FR / CH ---------------- */
function fiscalProfile(){
  const s=STATE.settings||{};
  let country=text(s.fiscalCountry||s.countryCode||s.country||s.pays||"").toUpperCase();
  const currency=text(s.currency||s.devise||"").toUpperCase();
  if(!country){if(currency==="CHF")country="CH";else if(currency==="EUR")country="FR"}
  if(country!=="FR"&&country!=="CH")country="UNSET";
  return {country,currency:country==="CH"?"CHF":country==="FR"?"EUR":(currency||"EUR"),label:country==="FR"?"FRANCE":country==="CH"?"SUISSE":"À CONFIGURER"};
}
function normalizeTaxRate(value){let rate=Number(value);if(!Number.isFinite(rate))return null;if(rate>0&&rate<1)rate*=100;return Math.round(rate*100)/100}
function itemVatRate(item){
  const explicit=normalizeTaxRate(item.vatRate??item.tva??item.taxRate??item.tauxTVA);
  if(explicit!==null)return explicit;
  const profile=fiscalProfile(),label=(text(item.name)+" "+text(item.category)+" "+text(item.course)).toLowerCase();
  if(profile.country==="FR"){if(/alcool|vin\b|bi[eè]re|champagne|cocktail|spiritueux/.test(label))return 20;return 10}
  if(profile.country==="CH")return 8.1;
  return 0;
}
function fiscalBreakdown(order){
  const groups=new Map();let grossTotal=0;
  (order?.items||[]).forEach(item=>{
    const qty=Math.max(1,num(item.qty||item.quantity||1)),gross=num(item.price??item.prix)*qty,rate=itemVatRate(item);
    const net=rate>0?gross/(1+rate/100):gross,tax=gross-net;grossTotal+=gross;
    const key=String(rate),row=groups.get(key)||{rate,gross:0,net:0,tax:0};
    row.gross+=gross;row.net+=net;row.tax+=tax;groups.set(key,row);
  });
  return {profile:fiscalProfile(),gross:grossTotal,rows:[...groups.values()].sort((a,b)=>a.rate-b.rate)};
}
async function fiscalEvent(type,payload={}){
  const ref="FISCAL_EVENT_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  return optimisticWrite(ref,{data:{ref,type,tenantID:STATE.tenantID,terminal:"TELEPHONE",deviceId:STATE.deviceId,tableId:STATE.currentTable,country:fiscalProfile().country,createdAt:new Date().toISOString(),payload}},"Journal fiscal téléphone");
}

/* ---------------- RESUME EXACT ---------------- */
function summaryGroups(order){
  const map=new Map();
  (order?.items||[]).forEach(item=>{const guest=text(item.guest)||"Non attribué";if(!map.has(guest))map.set(guest,[]);map.get(guest).push(item)});
  return [...map.entries()];
}
function renderSummary(){
  if(!STATE.currentTable)return;
  const order=STATE.currentOrder||getOrder(STATE.currentTable)||ensureOrder(STATE.currentTable);STATE.currentOrder=order;
  const table=STATE.tables.find(t=>t.label===STATE.currentTable),zone=getZone(table),fiscal=fiscalBreakdown(order);
  $("summaryTable").textContent=`TABLE ${STATE.currentTable} · ${num(order.pax||2)||2} couverts`;
  $("summaryZone").textContent=`🍹 ZONE ${text(zone?.label||"SALLE").toUpperCase()}`;
  $("summaryNote").textContent=text(order.note||order.observation)?`📝 ${text(order.note||order.observation)}`:"Ajouter une observation depuis la prise de commande";
  $("summaryTotal").textContent=money(orderTotal(order));
  const groups=summaryGroups(order);
  $("summaryContent").innerHTML=groups.length?groups.map(([guest,items])=>`
    <section class="summary-group"><div class="summary-group-title">👤 ${esc(guest)}</div>
      ${items.map(item=>{const qty=Math.max(1,num(item.qty||item.quantity||1));const meta=[`x${qty}`,text(item.cooking)?`Cuisson : ${text(item.cooking)}`:"",lineReady(item)?"PRÊT":lineFired(item)?"EN CUISINE":"À ENVOYER"].filter(Boolean).join(" · ");return `
        <div class="summary-item"><div><div class="summary-item-name">${esc(item.name||"Article")}</div><div class="summary-item-meta">${esc(meta)}</div></div><div class="summary-item-price">${money(num(item.price??item.prix)*qty)}</div></div>`}).join("")}
    </section>`).join(""):'<div class="empty-state">En attente de saisie…</div>';

  const p=fiscal.profile;
  $("summaryFiscal").innerHTML=`
    <div class="summary-fiscal-top"><div class="summary-fiscal-title">🧾 PROFIL FISCAL · ${esc(p.label)}</div><div class="summary-fiscal-status">${p.country==="UNSET"?"CONFIGURATION REQUISE":"SYNCHRONISÉ SERVEUR"}</div></div>
    ${fiscal.rows.map(row=>`<div class="summary-tax-row"><span>TVA ${row.rate.toFixed(2).replace(".",",")} %</span><span>TVA ${money(row.tax)}</span><strong>TTC ${money(row.gross)}</strong></div>`).join("")||'<div class="summary-tax-row"><span>Aucune ligne fiscale</span><span></span><strong>—</strong></div>'}
    <div class="fiscal-warning">Les taux article du serveur sont prioritaires. Le profil de secours est prévu pour FR/CH. La conformité fiscale officielle dépend aussi du backend, de l’archivage et des procédures de l’établissement.</div>`;
}
async function recordPayment(method){
  if(!STATE.currentTable)return false;
  const o=ensureOrder(STATE.currentTable),fiscal=fiscalBreakdown(o),total=orderTotal(o);
  o.status="payment";
  o.paymentDraft={total,method,status:method?"recorded":"pending",at:Date.now(),source:"TELEPHONE",fiscalCountry:fiscal.profile.country,fiscalRows:fiscal.rows.map(r=>({rate:r.rate,gross:r.gross,net:r.net,tax:r.tax}))};
  const ok=await saveCurrent(o,method?"Paiement téléphone enregistré":"Paiement en attente");
  if(ok){await fiscalEvent("PAYMENT",{method:method||null,total,fiscalCountry:fiscal.profile.country,rows:o.paymentDraft.fiscalRows});toast(method?`Paiement ${method} enregistré`:"Paiement en attente")}
  return ok;
}

/* ---------------- EVENTS ---------------- */
$("rooms").addEventListener("click",e=>{const b=e.target.closest("[data-room]");if(!b)return;STATE.room=b.dataset.room;scheduleRender()});
$("tables").addEventListener("click",e=>{const b=e.target.closest("[data-table]");if(b)openOrder(b.dataset.table)});
$("categories").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;STATE.category=b.dataset.cat;renderCategories();renderProducts()});
$("products").addEventListener("click",e=>{const b=e.target.closest("[data-product]");if(!b)return;const p=STATE.menu.find(x=>x.id===b.dataset.product&&x.name===b.dataset.pname)||STATE.menu.find(x=>x.id===b.dataset.product);if(p)addProduct(p)});
$("ticket").addEventListener("click",e=>{const b=e.target.closest("[data-line]");if(b)mutateLine(b.dataset.line,b.dataset.act)});
$("btnCloseOrder").onclick=closeOrder;
$("paxMinus").onclick=()=>setPax(-1);$("paxPlus").onclick=()=>setPax(1);
$("btnSend").onclick=sendKitchen;$("btnKitchenOrder").onclick=openKitchen;$("btnOrderMore").onclick=openOrderMore;
$("btnWhoOrder").onclick=openWho;$("btnCooking").onclick=openCooking;$("btnRushOrder").onclick=openRush;$("btnSummary").onclick=openSummary;
$("summaryClose").onclick=closeSummary;$("summaryModify").onclick=closeSummary;
$("summaryKitchen").onclick=async()=>{await sendKitchen();renderSummary()};
$("summaryCash").onclick=openPayment;
$("toolRush").onclick=openRush;$("toolWho").onclick=openWho;$("toolDisplay").onclick=openDisplay;$("toolKitchen").onclick=openKitchen;$("toolMore").onclick=openMore;

/* ---------------- BOOT ---------------- */
async function bootApp(){
  applyDisplay(STATE.display);autoDisplay();setConnection(navigator.onLine?"CONNEXION":"HORS LIGNE",navigator.onLine?"warn":"bad");
  await Promise.allSettled([syncFull("initial"),connectSocket()]);
  setInterval(()=>{renderStatus();if(STATE.currentTable){$("orderAge").textContent=duration(orderCreated(STATE.currentOrder)||Date.now())}updateToolBadges();autoDisplay()},1000);
  setInterval(()=>{if(!document.hidden&&!STATE.connected&&navigator.onLine)syncFull("fallback")},12000);
}

})();
</script>
</body>
