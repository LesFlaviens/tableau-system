<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>iCHEF TÉLÉPHONE — CONNEXION CORRIGÉE</title>
<style>
:root{
  --bg:#050607;--panel:#0b0e0f;--panel2:#111516;--line:#293033;--line2:#3a4346;
  --text:#fff;--muted:#aab2b5;--gold:#e2b84e;--green:#46d66b;--orange:#ff9a4f;
  --red:#ff6262;--purple:#aa8cff;--blue:#63b8ff;--shadow:0 18px 55px rgba(0,0,0,.58);
  --safe-top:max(8px,env(safe-area-inset-top));--safe-bottom:max(8px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body.sun{--bg:#fff;--panel:#fff;--panel2:#f5f5f5;--line:#111;--line2:#000;--text:#000;--muted:#222;--shadow:none}
body.night{--bg:#000;--panel:#020202;--panel2:#060606;--line:#202020;--line2:#333;--text:#eee;--muted:#888;--gold:#d0a93f}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.icon{font-size:18px;line-height:1}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.good{color:var(--green)}
.warn{color:var(--orange)}
.bad{color:var(--red)}

/* LOGIN */
#login{
  position:fixed;inset:0;z-index:10000;background:#050607;display:flex;align-items:center;justify-content:center;
  padding:22px;
}
.login-card{width:min(390px,100%);text-align:center}
.logo{font-weight:950;letter-spacing:8px;font-size:34px;margin-bottom:6px}.logo span{color:var(--gold)}
.login-sub{color:#92999b;font-size:13px;margin-bottom:22px}
.tenant-box{display:none;margin-bottom:12px}
.tenant-box.show{display:block}
.tenant-box input{width:100%;height:48px;border:1px solid #333;border-radius:12px;background:#0d1011;color:#fff;padding:0 14px;outline:none}
.pin-dots{height:32px;display:flex;gap:9px;align-items:center;justify-content:center;margin-bottom:18px}
.pin-dots i{width:11px;height:11px;border-radius:50%;border:1px solid #666;background:transparent}
.pin-dots i.on{background:var(--gold);border-color:var(--gold)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pin-pad button{height:58px;border:1px solid #303638;border-radius:14px;background:#0c0f10;color:#fff;font-size:20px;font-weight:850}
.pin-pad button:active{transform:scale(.97);border-color:var(--gold)}
.pin-pad .secondary{font-size:12px;color:#a4abad}.login-msg{height:24px;margin-top:12px;color:var(--red);font-size:12px;font-weight:700}

/* APP */
#app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
#statusbar{
  height:46px;padding-top:var(--safe-top);flex:0 0 calc(46px + var(--safe-top));display:grid;grid-template-columns:1.2fr .8fr .8fr .9fr .8fr;
  background:#07090a;border-bottom:1px solid rgba(226,184,78,.42);z-index:30
}
body.sun #statusbar{background:#fff;border-bottom:2px solid #111}
.status-cell{min-width:0;border-right:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
body.sun .status-cell{border-color:#ccc}
.status-cell:last-child{border-right:none}.status-label{font-size:7px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:850}.status-value{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#rooms{height:42px;flex:0 0 42px;display:flex;gap:7px;align-items:center;overflow-x:auto;padding:5px 8px;border-bottom:1px solid var(--line);scrollbar-width:none;background:var(--panel)}
#rooms::-webkit-scrollbar{display:none}.room-btn{flex:0 0 auto;height:31px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}.room-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(226,184,78,.08)}
#service{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 8px 82px;background:var(--bg)}
#tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;align-content:start}
.table-card{position:relative;min-height:94px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--text);padding:7px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.table-card:active{transform:scale(.985)}.table-card .num{font-size:22px;font-weight:950;letter-spacing:.3px}.table-card .meta{font-size:8px;color:var(--muted);font-weight:800;white-space:nowrap}.table-card .time{font-size:9px;color:var(--muted);font-weight:900}.table-card .badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:10px;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:950}.table-card.empty{opacity:.86}.table-card.active{border-color:var(--gold)}.table-card.ready{border-color:var(--green);box-shadow:inset 0 0 0 1px rgba(70,214,107,.15)}.table-card.wait{border-color:var(--orange)}.table-card.late{border-color:var(--red)}.table-card.reserved{border-color:var(--purple)}.table-card.payment{border-color:#c7ccd0}.table-card.alert{animation:pulse 1.1s infinite;border-color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,98,98,.13)}}
.empty-state{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:30px 15px;text-align:center;color:var(--muted);font-size:12px}

/* BOTTOM TOOLS */
#tools{position:fixed;left:7px;right:7px;bottom:var(--safe-bottom);z-index:45;height:64px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px;border:1px solid rgba(226,184,78,.38);border-radius:15px;background:#07090a;box-shadow:var(--shadow)}
body.sun #tools{background:#fff;border-color:#111}
.tool{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;font-size:7.5px;font-weight:900;text-transform:uppercase;letter-spacing:.15px}.tool .icon{font-size:17px}.tool .tiny{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:6.5px}.tool.rush0,.tool.rush1{border-color:var(--green);color:var(--green)}.tool.rush2,.tool.rush3{border-color:var(--gold);color:var(--gold)}.tool.rush4{border-color:var(--orange);color:var(--orange)}.tool.rush5{border-color:var(--red);color:var(--red)}

/* SHEETS */
.sheet{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;padding:10px;padding-bottom:var(--safe-bottom)}.sheet.open{display:flex}.sheet-card{width:min(560px,100%);max-height:84dvh;border:1px solid var(--line2);border-radius:18px 18px 12px 12px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}.sheet-head{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}.sheet-title{flex:1;min-width:0;font-size:14px;font-weight:950;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close-btn{width:38px;height:38px;border:1px solid var(--line2);border-radius:50%;background:var(--panel2);color:var(--text);font-size:20px}.sheet-body{padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.action-btn{min-height:58px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--text);font-size:11px;font-weight:900;padding:8px}.action-btn.gold{border-color:var(--gold);color:var(--gold)}.action-btn.green{border-color:var(--green);color:var(--green)}.action-btn.orange{border-color:var(--orange);color:var(--orange)}.action-btn.red{border-color:var(--red);color:var(--red)}.action-btn.purple{border-color:var(--purple);color:var(--purple)}.big-state{border:1px solid var(--line2);border-radius:14px;background:var(--panel2);padding:15px;text-align:center;margin-bottom:9px}.big-state .big{font-size:24px;font-weight:950}.big-state .small{font-size:10px;color:var(--muted);margin-top:4px}.list{display:flex;flex-direction:column;gap:7px}.list-row{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:9px;display:flex;align-items:center;gap:8px}.list-row .grow{flex:1;min-width:0}.list-row .title{font-size:11px;font-weight:900}.list-row .sub{font-size:8px;color:var(--muted);margin-top:2px}.mini-btn{height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--text);font-size:9px;font-weight:900}.field{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);padding:9px;outline:none}.field:focus{border-color:var(--gold)}

/* ORDER DRAWER */
#order{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;flex-direction:column}.order-open #order{display:flex}.order-open #tools{display:none}
.order-head{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:7px;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--panel)}.order-name{flex:1;min-width:0;font-size:15px;font-weight:950;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-btn{height:38px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);color:var(--text);font-size:9px;font-weight:900}.head-btn.close{width:38px;padding:0;font-size:18px}
.order-info{height:44px;flex:0 0 44px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--panel)}.info-chip{border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:9px;font-weight:900}.info-chip button{width:28px;height:27px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--text);font-weight:950}
.order-main{flex:1;min-height:0;display:grid;grid-template-rows:42% 58%;overflow:hidden}.menu-side{min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}.categories{height:42px;flex:0 0 42px;display:flex;gap:5px;overflow-x:auto;padding:5px 7px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat-btn{height:31px;flex:0 0 auto;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);font-size:9px;font-weight:900}.cat-btn.active{border-color:var(--gold);color:var(--gold)}.menu-products{flex:1;min-height:0;overflow-y:auto;padding:6px 7px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start}.product{min-height:63px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:6px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:left}.product:active{border-color:var(--gold)}.product .pname{font-size:9px;font-weight:900;line-height:1.15}.product .price{font-size:10px;font-weight:950;color:var(--gold)}.product.sold{opacity:.35;pointer-events:none}
.ticket-side{min-height:0;display:flex;flex-direction:column;background:var(--panel)}.ticket-actions{height:43px;flex:0 0 43px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px 7px;border-bottom:1px solid var(--line)}.ticket-actions button{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);font-size:8px;font-weight:900}.ticket-items{flex:1;min-height:0;overflow-y:auto;padding:5px 7px}.ticket-row{border-bottom:1px solid var(--line);padding:7px 2px;display:grid;grid-template-columns:1fr auto;gap:7px}.ticket-left{min-width:0}.ticket-name{font-size:10px;font-weight:900}.ticket-meta{font-size:7.5px;color:var(--muted);margin-top:2px}.ticket-right{text-align:right}.ticket-price{font-size:10px;font-weight:950;color:var(--gold)}.qtybar{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}.qtybar button{width:25px;height:24px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--text);font-size:12px;font-weight:950}.guest-tag{display:inline-block;margin-left:5px;padding:1px 5px;border:1px solid var(--purple);border-radius:8px;color:var(--purple);font-size:7px}.line-state{display:inline-block;margin-left:5px;font-size:7px;font-weight:950}.line-state.ready{color:var(--green)}.line-state.sent{color:var(--gold)}
.ticket-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:7px}.ticket-total{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:950}.ticket-total strong{font-size:18px;color:var(--gold)}.send-btn{width:100%;height:45px;border:1px solid var(--green);border-radius:10px;background:rgba(70,214,107,.08);color:var(--green);font-size:11px;font-weight:950;letter-spacing:.3px}

/* TOAST / ALERT */
#toast{position:fixed;left:50%;bottom:90px;z-index:20000;transform:translate(-50%,12px);max-width:88vw;padding:9px 13px;border:1px solid var(--line2);border-radius:10px;background:#0b0e0f;color:#fff;font-size:10px;font-weight:850;opacity:0;pointer-events:none;transition:.18s}.toast-show #toast{opacity:1;transform:translate(-50%,0)}
#server-alert{position:fixed;top:calc(52px + var(--safe-top));left:8px;right:8px;z-index:500;display:none;border:1px solid var(--red);border-radius:11px;background:#1a0909;color:#fff;padding:9px 10px;font-size:10px;font-weight:850;box-shadow:var(--shadow)}#server-alert.show{display:block}

/* PLAN */
.plan-wrap{position:relative;width:100%;height:52dvh;min-height:330px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}.plan-canvas{position:absolute;inset:0;transform-origin:0 0}.plan-table{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);font-size:9px;font-weight:950}.plan-zone{position:absolute;border:1px dashed var(--blue);border-radius:10px;background:rgba(99,184,255,.05);color:var(--blue);font-size:8px;font-weight:900;padding:4px;overflow:hidden}

@media (orientation:landscape){#tables{grid-template-columns:repeat(6,minmax(0,1fr))}.table-card{min-height:76px}.order-main{grid-template-columns:53% 47%;grid-template-rows:1fr}.menu-side{border-bottom:none;border-right:1px solid var(--line)}.menu-products{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:720px){#app,#order{max-width:720px;left:50%;right:auto;width:720px;transform:translateX(-50%)}#tools{max-width:706px;left:50%;right:auto;width:706px;transform:translateX(-50%)}#server-alert{max-width:690px;left:50%;right:auto;width:690px;transform:translateX(-50%)}}

/* ===== iCHEF TELEPHONE V2 : 3 ECRANS ===== */
.order-head{height:64px;flex:0 0 64px;padding:8px 10px;gap:8px}
.order-name{font-size:19px;font-weight:950}
.head-btn{min-width:48px;height:48px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:950}
.head-btn.close{width:48px;height:48px;font-size:24px}
.order-info{height:56px;flex:0 0 56px;padding:6px 8px;gap:7px}
.info-chip{min-height:43px;border-radius:11px;font-size:12px;font-weight:950}
.info-chip button{width:36px;height:35px;border-radius:9px;font-size:18px}
.categories{height:56px;flex:0 0 56px;gap:7px;padding:6px 8px}
.cat-btn{height:43px;padding:0 16px;border-radius:11px;font-size:11px;font-weight:950}
.cat-btn.active{border-width:2px}
.menu-products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px;padding:8px}
.product{min-height:96px;border-radius:14px;padding:11px;border-width:1.5px}
.product .pname{font-size:14px;line-height:1.18;font-weight:950}
.product .price{font-size:16px;margin-top:7px}
.product:active{transform:scale(.975);border-color:var(--gold);background:rgba(226,184,78,.08)}
.ticket-actions{height:62px;flex:0 0 62px;gap:6px;padding:6px 7px}
.ticket-actions button{min-height:49px;border-radius:10px;font-size:9px;font-weight:950;line-height:1.12}
.ticket-actions button:nth-child(1){border-color:var(--purple);color:var(--purple)}
.ticket-actions button:nth-child(2){border-color:var(--blue);color:var(--blue)}
.ticket-actions button:nth-child(3){border-color:var(--orange);color:var(--orange)}
.ticket-actions button:nth-child(4){border-color:var(--gold);color:var(--gold)}
.ticket-row{min-height:68px;padding:10px 3px}
.ticket-name{font-size:13px}.ticket-meta{font-size:9px;line-height:1.35}
.ticket-price{font-size:14px}.qtybar{gap:6px;margin-top:6px}
.qtybar button{width:38px;height:36px;border-radius:9px;font-size:19px}
.ticket-total{font-size:15px}.ticket-total strong{font-size:23px}
.send-btn{height:58px;border-width:2px;border-radius:13px;font-size:14px;font-weight:950}
.cooking-tag{display:inline-flex;align-items:center;margin-left:5px;padding:2px 6px;border:1px solid var(--blue);border-radius:8px;color:var(--blue);font-size:7px;font-weight:950}

/* ECRAN 3 */
#summary{position:fixed;inset:0;z-index:1500;display:none;flex-direction:column;background:#f4f1eb;color:#0b0d0e}
body.summary-open #summary{display:flex}
body.summary-open #order,body.summary-open #tools{display:none!important}
.summary-head{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #d8d2c7;background:#f7f4ef}
.summary-table{flex:1;min-width:0;font-size:25px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-close{height:44px;padding:0 12px;border:0;background:transparent;color:#111;font-size:14px;font-weight:900}
.summary-zone{margin:10px 8px 8px;min-height:52px;border:2px solid #9b8f00;border-radius:11px;background:#f6f1db;color:#7b7500;display:flex;align-items:center;justify-content:center;padding:8px 10px;text-align:center;font-size:13px;font-weight:950}
.summary-note{margin:0 8px 8px;min-height:46px;border:1px solid #d9d3c8;border-radius:10px;background:#fffdfa;color:#555;padding:10px 12px;font-size:11px}
.summary-content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 8px 10px}
.summary-group{margin-bottom:9px;border:1px solid #d5cfc4;border-radius:12px;overflow:hidden;background:#fff}
.summary-group-title{min-height:38px;display:flex;align-items:center;padding:7px 10px;background:#111516;color:#fff;font-size:12px;font-weight:950}
.summary-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 10px;border-top:1px solid #ece6dc}
.summary-item-name{font-size:12px;font-weight:900}.summary-item-meta{margin-top:3px;color:#67615b;font-size:9px;line-height:1.3}
.summary-item-price{color:#7b5a00;font-size:12px;font-weight:950;white-space:nowrap}
.summary-fiscal{margin:0 8px 8px;border:1px solid #2a3032;border-radius:12px;background:#07090a;color:#fff;padding:10px}
.summary-fiscal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.summary-fiscal-title{color:var(--gold);font-size:11px;font-weight:950}.summary-fiscal-status{font-size:8px;color:#b4bbbd}
.summary-tax-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:3px 0;border-top:1px solid #252a2c;font-size:9px}
.summary-tax-row strong{color:var(--gold)}
.summary-bottom{flex:0 0 auto;padding:8px;border-top:1px solid #232729;background:#07090a;color:#fff}
.summary-total{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 2px 8px}
.summary-total span{font-size:12px;font-weight:900;color:#b1b7b9}.summary-total strong{color:var(--gold);font-size:30px;font-weight:950}
.summary-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.summary-actions button{min-height:48px;border:1px solid #444b4e;border-radius:10px;background:#111516;color:#fff;font-size:10px;font-weight:950}
.summary-actions .kitchen{border-color:var(--green);color:var(--green)}
.summary-cash{width:100%;height:66px;border:0;border-radius:12px;background:linear-gradient(180deg,#e7b331,#ca8e12);color:#fff;font-size:22px;font-weight:950;letter-spacing:2px}
.fiscal-warning{margin-top:7px;color:#8f979a;font-size:7px;line-height:1.25}
.sheet-card{max-height:88dvh}.action-btn{min-height:68px;font-size:12px}.field{font-size:13px}
@media (orientation:landscape){.menu-products{grid-template-columns:repeat(3,minmax(0,1fr))!important}.product{min-height:82px}}


/* ===== V3 VISUELLE : immédiatement identifiable ===== */
.v3-badge{
  display:inline-flex;align-items:center;justify-content:center;
  margin:0 auto 12px;padding:6px 10px;border:1px solid #e2b84e;border-radius:999px;

/* =========================================================
   V5 — CAPTURE UTILISATEUR
   ÉCRAN 1 = TABLES / 3 COLONNES / GRANDES TOUCHES
   ÉCRAN 2 = COMMANDE XL + ANTI-RUSH PERMANENT
   APPUI 0,6 s = INTITULÉ COMPLET DU PLAT
   ========================================================= */

body{

  -webkit-user-select:none;

}

/* Barre serveur discrète : la salle reste visuellement prioritaire */
#statusbar{

}
.status-label{font-size:6px !important}

/* Bandeau salle comme la capture */
#rooms{

  padding:8px 10px !important;

  background:#060809 !important;

}
.room-btn{
  flex:0 0 min(88vw,430px) !important;
  height:58px !important;
  border:2px solid #c99d36 !important;
  border-radius:999px !important;
  background:#0b0d0e !important;
  color:#e9c55f !important;
  font-size:18px !important;
  font-weight:950 !important;
  text-transform:none !important;
  letter-spacing:.3px !important;
  scroll-snap-align:center;
}
.room-btn.active{
  color:#090909 !important;
  background:linear-gradient(180deg,#ffd978,#e8b847) !important;
  border-color:#ffdf85 !important;
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.28),
    0 5px 18px rgba(226,184,78,.18) !important;
}

/* Zone des tables */
#service{
  padding:10px 8px 86px !important;
}
#tables{
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:9px !important;
}

/* Grandes cartes éclairées */
.table-card{
  min-height:158px !important;
  border:2px solid #343b3e !important;
  border-radius:15px !important;
  padding:15px 6px 10px !important;
  gap:7px !important;
  background:
    radial-gradient(circle at 50% -20%,rgba(255,255,255,.045),transparent 45%),
    linear-gradient(180deg,#0c1010,#070a0b) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 4px 14px rgba(0,0,0,.24) !important;
  overflow:hidden;
}
.table-card::before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;
  height:8px;
  background:#6d7300;
  opacity:.95;
}
.table-card.empty::before{background:#747900}
.table-card.active::before{background:#d1a72e}
.table-card.ready::before{background:#34d58b}
.table-card.wait::before{background:#ff9a43}
.table-card.late::before,
.table-card.alert::before{background:#ff4e63}
.table-card.reserved::before{background:#9b74ff}
.table-card.payment::before{background:#67baff}

.table-card:active{
  transform:scale(.965) !important;
  border-color:#ffd45f !important;
  box-shadow:
    0 0 0 3px rgba(255,212,95,.22),
    0 0 26px rgba(255,212,95,.20) !important;
}

.table-card .num{
  font-size:43px !important;
  line-height:.98 !important;
  font-weight:1000 !important;
  letter-spacing:-1px !important;
  color:#fff !important;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}
.table-card .meta{
  font-size:12px !important;
  color:#f5f5f5 !important;
  font-weight:900 !important;
}
.table-card .time{
  font-size:15px !important;
  color:#45ef69 !important;
  font-weight:1000 !important;
  letter-spacing:.2px;
}
.table-card.active .time,
.table-card.wait .time,
.table-card.late .time,
.table-card.alert .time{
  color:#ff5368 !important;
}
.table-zone{
  max-width:95%;
  min-height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1px 8px;
  border:1.5px solid currentColor;
  border-radius:999px;
  color:#b9be00;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.table-preview{
  width:100%;
  margin-top:1px;
  padding-top:6px;
  border-top:1px solid #353b3d;
  text-align:left;
  overflow:hidden;
}
.table-preview-line{
  display:block;
  width:100%;
  color:#f4f4f4;
  font-size:8px;
  line-height:1.25;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

  color:#ff5368;
  padding-left:5px;
  border-left:3px solid #ff5368;
}
.table-card .badge{
  top:11px !important;
  right:5px !important;
  min-width:22px !important;
  height:22px !important;
  font-size:10px !important;
}

/* ÉCRAN 2 : Anti-Rush permanent */
#rushStrip{
  flex:0 0 50px;
  min-height:50px;
  width:calc(100% - 16px);
  margin:6px 8px 0;
  border:2px solid var(--green);
  border-radius:13px;
  background:linear-gradient(90deg,rgba(70,214,107,.20),rgba(70,214,107,.06));
  color:#fff;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  text-align:left;
  font-weight:950;
}
#rushStrip .rush-dot{
  width:13px;height:13px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px rgba(70,214,107,.6);
}
#rushStrip .rush-main{
  min-width:0;
  font-size:12px;
  line-height:1.15;
}
#rushStrip .rush-sub{
  display:block;
  margin-top:2px;
  color:#d6dfdc;
  font-size:8px;
  font-weight:850;
}
#rushStrip .rush-level{
  min-width:46px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  font-size:12px;
  font-weight:1000;
}
#rushStrip.rush2,#rushStrip.rush3{
  border-color:var(--gold);
  background:linear-gradient(90deg,rgba(226,184,78,.20),rgba(226,184,78,.05));
}
#rushStrip.rush2 .rush-dot,#rushStrip.rush3 .rush-dot{background:var(--gold)}
#rushStrip.rush4{
  border-color:var(--orange);
  background:linear-gradient(90deg,rgba(255,154,79,.20),rgba(255,154,79,.05));
}
#rushStrip.rush4 .rush-dot{background:var(--orange)}
#rushStrip.rush5{
  border-color:var(--red);
  background:linear-gradient(90deg,rgba(255,98,98,.22),rgba(255,98,98,.05));
}
#rushStrip.rush5 .rush-dot{background:var(--red)}

/* Commande : très grosses touches */
.order-head{

}

/* =========================================================
   iCHEF TÉLÉPHONE V6 — SERVICE RAPIDE PRO
   - C1 à C9 visibles et répétés partout
   - 1 tap = 1 article
   - appui 0,6 s = intitulé complet
   - cuisson viande en 1 touche
   - observations / allergies
   - Cuisine / Bar / Pâtisserie séparés
   - annuler dernière action
   ========================================================= */

:root{
  --c1:#ff5a67; --c2:#58a9ff; --c3:#4cda8a;
  --c4:#a785ff; --c5:#ff9a45; --c6:#45d6de;
  --c7:#ff78b7; --c8:#e8d64f; --c9:#d9e0e3;
}

/* Barre convives : les 9 repères sont visibles d'un coup */
.fast-guest-wrap{
  flex:0 0 60px;
  min-height:60px;
  padding:5px 7px 6px;
  background:#080b0c;
  border-bottom:1px solid var(--line);
}
.fast-guest-head{
  height:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-bottom:4px;
  color:#fff;
  font-size:8px;
  font-weight:950;
  letter-spacing:.6px;
}
.fast-active-guest{
  color:var(--gold);
  font-size:9px;
}
.guest-buttons{
  display:grid;
  grid-template-columns:repeat(9,minmax(0,1fr));
  gap:3px;
}
.guest-btn{
  height:34px;
  min-width:0;
  border:2px solid currentColor;
  border-radius:9px;
  background:#0c1011;
  color:#fff;
  font-size:10px;
  font-weight:1000;
  padding:0;
  opacity:.72;
  touch-action:manipulation;
}
.guest-btn.active{
  opacity:1;
  color:#050607 !important;
  transform:translateY(-1px);
  box-shadow:0 0 12px color-mix(in srgb,currentColor 45%, transparent);
}
.guest-btn.extra{
  opacity:.42;
}
.guest-btn[data-seat="1"]{color:var(--c1)} .guest-btn[data-seat="1"].active{background:var(--c1)}
.guest-btn[data-seat="2"]{color:var(--c2)} .guest-btn[data-seat="2"].active{background:var(--c2)}
.guest-btn[data-seat="3"]{color:var(--c3)} .guest-btn[data-seat="3"].active{background:var(--c3)}
.guest-btn[data-seat="4"]{color:var(--c4)} .guest-btn[data-seat="4"].active{background:var(--c4)}
.guest-btn[data-seat="5"]{color:var(--c5)} .guest-btn[data-seat="5"].active{background:var(--c5)}
.guest-btn[data-seat="6"]{color:var(--c6)} .guest-btn[data-seat="6"].active{background:var(--c6)}
.guest-btn[data-seat="7"]{color:var(--c7)} .guest-btn[data-seat="7"].active{background:var(--c7)}
.guest-btn[data-seat="8"]{color:var(--c8)} .guest-btn[data-seat="8"].active{background:var(--c8)}
.guest-btn[data-seat="9"]{color:var(--c9)} .guest-btn[data-seat="9"].active{background:var(--c9)}

/* Badge C1-C9 répété dans ticket, résumé et panneaux */
.seat-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:31px;
  height:22px;
  padding:0 6px;
  margin-right:5px;
  border:2px solid currentColor;
  border-radius:999px;
  background:#090c0d;
  font-size:9px;
  font-weight:1000;
  vertical-align:middle;
}
.seat-badge.seat-1{color:var(--c1)}
.seat-badge.seat-2{color:var(--c2)}
.seat-badge.seat-3{color:var(--c3)}
.seat-badge.seat-4{color:var(--c4)}
.seat-badge.seat-5{color:var(--c5)}
.seat-badge.seat-6{color:var(--c6)}
.seat-badge.seat-7{color:var(--c7)}
.seat-badge.seat-8{color:var(--c8)}
.seat-badge.seat-9{color:var(--c9)}
.summary-group-title .seat-badge{background:#111516}

/* Bouton annulation immédiate dans l'entête */

  min-width:50px !important;

  color:#ffb16f !important;
}

  line-height:1.25;
  font-weight:850;
}
.ticket-obs.critical{

/* ---------- Séparateur MENU / TICKET ---------- */
body.order-open .order-main{
  grid-template-rows:minmax(0,var(--order-menu-split)) 30px minmax(0,1fr)!important;
  background:var(--ui-bg)!important;
}
body.order-open #orderDivider{
  height:30px!important;
  min-height:30px!important;
  padding:0 18px!important;
  border:0!important;
  border-top:1px solid #cfd2d5!important;
  border-bottom:1px solid #cfd2d5!important;
  background:#fff!important;
}
body.order-open #orderDivider::before,
body.order-open #orderDivider::after{
  height:2px!important;
  background:#aeb2b7!important;
  opacity:.65!important;
}
body.order-open #orderDivider .divider-grip{
  min-width:180px!important;
  height:24px!important;
  margin:0 14px!important;
  border:1px solid #aeb2b7!important;
  border-radius:999px!important;
  background:#fff!important;
  color:#151719!important;
  box-shadow:0 1px 3px rgba(0,0,0,.04)!important;
  font-size:13px!important;
  font-weight:1000!important;
  letter-spacing:.15px!important;
}
body.order-open #orderDivider.dragging{background:#f4f4f4!important}
body.order-open #orderDivider.dragging::before,
body.order-open #orderDivider.dragging::after{background:#202225!important}
body.order-open #orderDivider.dragging .divider-grip{
  border-color:#202225!important;
  background:#202225!important;
  color:#fff!important;
}

/* ---------- Ticket ---------- */
body.order-open .ticket-side{
  padding:8px 10px 0!important;
}
body.order-open .ticket-items{
  padding:0 4px 6px!important;
  background:#fff!important;
  border:1px solid #e1e3e5!important;
  border-radius:14px 14px 0 0!important;
}
body.order-open .ticket-row{
  min-height:68px!important;
  padding:10px 8px!important;
  border-bottom:1px solid #eceeef!important;
  background:#fff!important;
}
body.order-open .ticket-name{
  color:#151719!important;
  font-size:17px!important;
  line-height:1.15!important;
  font-weight:950!important;
}
body.order-open .ticket-meta{
  margin-top:4px!important;
  color:var(--ui-muted)!important;
  font-size:12px!important;
}
body.order-open .ticket-price{
  color:#161719!important;
  font-size:18px!important;
  font-weight:1000!important;
}
body.order-open .qtybar button{
  min-width:38px!important;
  width:auto!important;
  height:34px!important;
  padding:0 9px!important;
  border:1px solid var(--ui-border)!important;
  border-radius:9px!important;
  background:#f7f7f8!important;
  color:#111!important;
  font-size:16px!important;
}

/* Pied ticket horizontal : statut + total + envoyer */
body.order-open .ticket-foot{
  min-height:70px!important;
  padding:8px 10px!important;
  display:grid!important;
  grid-template-columns:minmax(125px,.5fr) minmax(220px,.7fr) minmax(300px,1fr)!important;
  align-items:center!important;
  gap:10px!important;
  background:#fff!important;
  border:1px solid #e1e3e5!important;
  border-top:0!important;
  border-radius:0 0 14px 14px!important;
}
body.order-open .order-sync-state{
  min-height:40px!important;
  margin:0!important;
  padding:0 12px!important;
  border:1px solid var(--ui-border)!important;
  border-radius:10px!important;
  background:#f4f5f5!important;
  color:#6d7379!important;
  font-size:11px!important;
}
body.order-open .order-sync-state.good{
  border-color:#bdebcf!important;
  background:var(--ui-green-soft)!important;
  color:#11884b!important;
}
body.order-open .order-sync-state.bad{
  border-color:#ffc7ce!important;
  background:#fff2f4!important;
  color:#c63346!important;
}
body.order-open .ticket-total{
  min-height:46px!important;
  margin:0!important;
  padding:0 12px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:12px!important;
  border-left:1px solid #eceeef!important;
  border-right:1px solid #eceeef!important;
  color:#111!important;
  font-size:16px!important;
}
body.order-open .ticket-total strong{
  color:#d3a32b!important;
  font-size:28px!important;
  line-height:1!important;
}
body.order-open .send-btn{
  width:100%!important;
  min-height:48px!important;
  height:48px!important;
  border:1px solid #2fd071!important;
  border-radius:12px!important;
  background:var(--ui-green-soft)!important;
  color:#20b75d!important;
  font-size:17px!important;
  font-weight:1000!important;
  letter-spacing:.2px!important;
}
body.order-open .send-btn:active{
  background:#dcf8e8!important;
  transform:translateY(1px)!important;
}

/* ---------- Observation : présente mais plus envahissante ---------- */
body.order-open #order > #bottomObservationBar{
  position:absolute!important;
  left:0!important;
  right:0!important;
  bottom:0!important;
  height:72px!important;
  padding:8px 12px!important;
  display:flex!important;
  align-items:center!important;
  background:#fff!important;
  border-top:1px solid #d5d7da!important;
}
body.order-open #bottomObservation{
  width:100%!important;
  height:54px!important;
  min-height:54px!important;
  border:1.5px solid #25282b!important;
  border-radius:13px!important;
  background:#fff!important;
  color:#111!important;
  box-shadow:0 1px 4px rgba(0,0,0,.035)!important;
  font-size:20px!important;
  font-weight:1000!important;
  letter-spacing:.1px!important;
}
body.order-open #bottomObservation:active{
  background:#202225!important;
  color:#fff!important;
}

/* ---------- Fenêtres métier cohérentes ---------- */
.sheet-card,
#quickCookingBar{
  border:1px solid #cfd2d5!important;
  border-radius:18px!important;
  background:#fff!important;
  color:#111!important;
  box-shadow:0 18px 48px rgba(0,0,0,.18)!important;
}
.sheet-head{background:#fafafa!important;border-bottom:1px solid #e2e4e6!important}
.sheet-title{color:#111!important;font-size:18px!important}
.action-btn,.quick-cook-btn{
  border:1px solid #d5d8db!important;
  border-radius:12px!important;
  background:#f8f8f8!important;
  color:#111!important;
}

/* ---------- PAD / grand écran ---------- */
@media (min-width:1300px){
  body.order-open .menu-products{grid-template-columns:repeat(6,minmax(0,1fr))!important}
}
@media (min-width:900px) and (max-width:1299px){
  body.order-open .menu-products{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  body.order-open .product .pname{font-size:18px!important}
}
@media (max-width:899px){
  body.order-open .menu-products{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  body.order-open .ticket-foot{grid-template-columns:1fr 1fr!important}
  body.order-open .order-sync-state{display:none!important}
  body.order-open .send-btn{grid-column:1/-1!important}
}
@media (max-width:560px){
  body.order-open .order-head{padding:6px 7px!important;height:58px!important;flex-basis:58px!important}
  body.order-open .order-name{font-size:18px!important}
  body.order-open .head-btn{height:42px!important;padding:0 8px!important;font-size:11px!important}
  body.order-open .categories{height:56px!important;min-height:56px!important;flex-basis:56px!important;padding:6px!important}
  body.order-open .cat-btn{min-width:112px!important;height:42px!important;font-size:14px!important;padding:0 12px!important}
  body.order-open .menu-products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important;padding:8px!important}
  body.order-open .product{min-height:104px!important;padding:11px!important}
  body.order-open .product .pname{font-size:15px!important}
  body.order-open .product .price{font-size:17px!important}
  body.order-open .ticket-foot{grid-template-columns:1fr!important;gap:6px!important}
  body.order-open .ticket-total{border:0!important}
  body.order-open #orderDivider .divider-grip{min-width:145px!important;font-size:11px!important}
}
</style>
</head>
<body>
<body>
<div id="screenLabel">ÉCRAN 1 · TABLES</div>
<div id="demoRibbon" class="demo-ribbon hidden">APERÇU</div>

<div id="login">
  <div class="login-card">
    <div class="logo">i<span>CHEF</span></div>
    <div class="v3-badge">TÉLÉPHONE · CONNEXION SERVEUR</div>
    <div class="login-sub">CONNEXION SÉCURISÉE</div>
    <div id="tenantBox" class="tenant-box"><input id="tenantInput" autocomplete="off" placeholder="Identifiant établissement"></div>
    <div id="pinDots" class="pin-dots"></div>
    <div id="pinPad" class="pin-pad">
      <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
      <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
      <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
      <button class="secondary" data-act="clear">EFFACER</button><button data-pin="0">0</button><button class="secondary" data-act="back">⌫</button>
    </div>
    <button id="pinValidate" type="button" style="width:100%;height:48px;margin-top:10px;border:1px solid #e2b84e;border-radius:12px;background:#fff3cd;color:#000;font-size:12px;font-weight:950;letter-spacing:.6px">✓ VALIDER LE PIN</button>
    <button id="previewBtn" type="button">👁️ APERÇU DES 3 ÉCRANS<small>Aucune écriture serveur en mode aperçu</small></button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="statusbar">
    <div class="status-cell"><span class="status-label">Serveur</span><span id="stLink" class="status-value warn">CONNEXION</span></div>
    <div class="status-cell"><span class="status-label">Salle</span><span id="stRoom" class="status-value">—</span></div>
    <div class="status-cell"><span class="status-label">Tables</span><span id="stTables" class="status-value">0</span></div>
    <div class="status-cell"><span class="status-label">Rush</span><span id="stRush" class="status-value good">CALME</span></div>
    <div class="status-cell"><span class="status-label">Heure</span><span id="stClock" class="status-value">--:--</span></div>
  </div>
  <div id="rooms"></div>
  <main id="service"><div id="tables"></div></main>
</div>

<div id="tools" class="hidden">
  <button id="toolRush" class="tool rush0" type="button"><span class="tool-label">ANTI-RUSH</span><span id="rushTiny" class="tiny">Calme</span></button>
  <button id="toolWho" class="tool" type="button"><span class="tool-label">QUI MANGE ?</span><span class="tiny">Convives</span></button>
  <button id="toolDisplay" class="tool" type="button"><span class="tool-label">ÉCRAN</span><span id="displayTiny" class="tiny">Auto</span></button>
  <button id="toolKitchen" class="tool" type="button"><span class="tool-label">CUISINE</span><span id="readyTiny" class="tiny">0 prêt</span></button>
  <button id="toolMore" class="tool" type="button"><span class="tool-label">PLUS</span><span class="tiny">Outils</span></button>
</div>

<!-- LE SEUL ET UNIQUE BLOC ORDER -->
<div id="order">
  <div class="order-head" style="background:#e9e9e9!important;border-bottom:2px solid #ccc;padding-right:12px;">
    <div id="orderName" class="order-name" style="flex:0 0 auto;margin-right:15px;">TABLE —</div>
    <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:0;">
      <button id="btnHeadWho" class="head-btn" style="width:auto;padding:0 15px;cursor:pointer;">👥 QUI MANGE ?</button>
      <button class="head-btn" style="width:auto;padding:0 15px;pointer-events:none;">🪑 <span id="zoneValue">Salle</span></button>
      <span class="head-btn" style="width:auto;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;">⏱ <span id="orderAge">00:00</span></span>
      <button id="btnHeadReady" class="head-btn" style="width:auto;padding:0 15px;background:#36d98a;color:#000;display:none;cursor:pointer;">🍽️ PLATS PRÊTS</button>
    </div>
    
    <!-- Zone de droite avec flex-shrink:0 pour empêcher l'écrasement de FERMER -->
    <div style="display:flex;gap:8px;flex:0 0 auto;flex-shrink:0;">
      <button id="btnUndoFast" class="head-btn" type="button" title="Annuler la dernière action" style="width:auto;padding:0 15px;cursor:pointer;" disabled>RETOUR</button>
      <button id="btnKitchenOrder" class="head-btn" title="Communication Cuisine / Bar" style="width:auto;padding:0 15px;cursor:pointer;">DEMANDE</button>
      <button id="btnOrderMore" class="head-btn" style="width:auto;padding:0 15px;cursor:pointer;">OUTILS</button>
      <button id="btnCloseOrder" class="head-btn" style="width:auto;padding:0 15px;cursor:pointer;">FERMER</button>
    </div>
  </div>

  <!-- Éléments cachés nécessaires au fonctionnement -->
  <div style="display:none;">
    <button id="paxMinus">−</button><strong id="paxValue">2</strong><button id="paxPlus">+</button>
    <span id="activeGuestLabel" aria-hidden="true">C1</span>
    <div id="guestButtons" aria-hidden="true"></div>
    <button id="rushStrip" class="rush0" type="button">
      <span class="rush-dot"></span>
      <span class="rush-main">ANTI-RUSH<span class="rush-sub"></span></span>
      <span class="rush-level">N0</span>
    </button>
  </div>

  <div class="order-main">
    <section class="menu-side">
      <div id="categories" class="categories"></div>
      <div id="products" class="menu-products"></div>
    </section>

    <!-- La fameuse barre de séparation -->
    <div id="orderDivider" role="separator" tabindex="0" aria-orientation="horizontal">
      <div class="divider-grip">MENU ↕ TICKET</div>
    </div>

    <section class="ticket-side">
      <div class="ticket-actions" aria-hidden="true">
        <button id="btnObsFast" type="button">OBS.</button>
        <button id="btnCooking" type="button">CUISSONS</button>
        <button id="btnAllergyFast" type="button">ALLERGIE</button>
        <button id="btnSummary" type="button">RÉSUMÉ</button>
      </div>
      <div id="ticket" class="ticket-items"></div>
      <div class="ticket-foot">
        <div id="orderSyncState" class="order-sync-state">SERVEUR</div>
        <div class="ticket-total"><span>TOTAL</span><strong id="ticketTotal">0,00</strong></div>
        <button id="btnSend" class="send-btn" type="button">ENVOYER</button>
      </div>
    </section>
  </div>

  <div id="bottomObservationBar">
    <button id="bottomObservation" type="button">OBSERVATION</button>
  </div>
</div>

<div id="summary">
  <div class="summary-head">
    <div id="summaryTable" class="summary-table">TABLE —</div>
    <button id="summaryClose" class="summary-close" type="button">FERMER</button>
  </div>
  <div id="summaryZone" class="summary-zone"></div>
  <div id="summaryNote" class="summary-note"></div>
  <div id="summaryContent" class="summary-content"></div>
  <div id="summaryFiscal" class="summary-fiscal"></div>
  <div class="summary-bottom">
    <div class="summary-total"><span>TOTAL</span><strong id="summaryTotal">0,00</strong></div>
    <div class="summary-actions">
      <button id="summaryModify" type="button">MODIFIER</button>
      <button id="summaryKitchen" class="kitchen" type="button">CUISINE / BAR</button>
    </div>
    <button id="summaryCash" class="summary-cash" type="button">CAISSE</button>
  </div>
</div>

<div id="quickCookingBar" class="hidden">
  <div class="quick-cook-head">
    <span id="quickCookSeat" class="seat-badge">C1</span>
    <div><div id="quickCookName" class="quick-cook-name">Cuisson</div><div class="quick-cook-help">Choisir la cuisson</div></div>
    <button id="quickCookCancel" class="close-btn" type="button">×</button>
  </div>
  <div id="quickCookGrid" class="quick-cook-grid"></div>
</div>

<div id="sheet" class="sheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title"></div>
      <button id="sheetClose" class="close-btn" type="button">×</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="server-alert"></div>
<div id="toast"></div>
</body>
</html>
